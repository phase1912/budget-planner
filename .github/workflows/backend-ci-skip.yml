name: Backend CI (skip)

# `lint-typecheck-test` and `migration-drift` in backend-ci.yml are required
# status checks on main, but that workflow only triggers on backend/** changes.
# A PR that never touches backend/ would otherwise leave those required checks
# stuck on "Expected" forever, blocking merge with no way for them to report.
# This workflow reports the same check names as an immediate pass for exactly
# the PRs backend-ci.yml skips, so the two together always produce exactly one
# result per job. Keep the `paths-ignore` list a mirror of backend-ci.yml's
# `paths`, and keep the job names here a mirror of backend-ci.yml's jobs.
on:
  pull_request:
    paths-ignore:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "No backend/ changes in this PR — skipping backend CI."

  migration-drift:
    runs-on: ubuntu-latest
    steps:
      - run: echo "No backend/ changes in this PR — skipping migration drift check."
