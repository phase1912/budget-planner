# Ruff and mypy run through `uv run` against backend/pyproject.toml and uv.lock, and
# eslint/prettier through `npm run` against frontend/package.json and package-lock.json,
# so the versions pre-commit uses are exactly the ones CI uses; a pinned `rev` on a
# separate mirror repo would drift from those lockfiles.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: uv run --directory backend ruff check --fix
        language: system
        types: [python]
        files: ^backend/

      - id: ruff-format
        name: ruff format (backend)
        entry: uv run --directory backend ruff format
        language: system
        types: [python]
        files: ^backend/

      - id: mypy
        name: mypy --strict (backend)
        entry: uv run --directory backend mypy .
        language: system
        types: [python]
        files: ^backend/

      - id: eslint
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        types_or: [ts, tsx]
        files: ^frontend/
        pass_filenames: false

      - id: prettier
        name: prettier --check (frontend)
        entry: npm --prefix frontend run format
        language: system
        types_or: [ts, tsx, css, json]
        files: ^frontend/
        pass_filenames: false
        pass_filenames: false
