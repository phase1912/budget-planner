[project]
name = "budget-planner-backend"
version = "0.1.0"
description = "AI Budget Agent backend — FastAPI service (see docs/adr/0001-technology-stack.md)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiobotocore>=3.9.0",
    "alembic>=1.19.1",
    "anthropic>=0.122.0",
    "argon2-cffi>=23.1.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.1.0",
    "fastapi>=0.141.1",
    "filetype>=1.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "polyfactory>=3.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "pytest-bdd>=8.1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
# The CI gate (F0.6.4): `uv run pytest --cov` fails the build below this. Not
# baked into the default addopts above — a contributor without PostgreSQL
# running locally skips the DB-backed tests, which would make this threshold
# an unrelated local failure rather than a signal about their change.
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
