<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login, dark — Budget Agent design</title>
  <link rel="stylesheet" href="../design.css">
</head>
<body>

<div class="screen dark" style="height: 860px;">

  <header class="app-header">
    <div class="app-header__inner">
      <span class="brand">Budget Agent</span>
      <a class="btn-icon btn-icon--round" href="login.html" aria-label="Switch to light theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      </a>
    </div>
  </header>

  <main style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 32px;">
    <div style="width: 420px; display: flex; flex-direction: column; gap: 24px;">

      <div style="display: flex; flex-direction: column; gap: 6px; text-align: center;">
        <h1 class="page-title" style="font-size: 28px;">Welcome back</h1>
        <p class="page-sub" style="font-size: 14px;">Sign in to see where your money went.</p>
      </div>

      <form class="card card--surface" style="padding: 24px; display: flex; flex-direction: column; gap: 16px;">

        <!-- One message for both an unknown address and a wrong password: the form
             must not reveal whether an account exists (BRD N2, task F1.1.4). -->
        <div class="note note--error" style="padding: 12px 14px;">
          <svg class="note__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-error)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
          <span>That email and password do not match an account.</span>
        </div>

        <div class="field">
          <label class="field__label" for="login-email">Email</label>
          <div class="input-group">
            <svg class="input-group__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            <input class="input input--with-icon" id="login-email" type="email" value="anna@example.com">
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="login-password">Password</label>
          <div class="input-group">
            <svg class="input-group__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="input input--with-icon input--with-action input--focused" id="login-password" type="password" value="••••••••">
            <button class="btn-icon input-group__action" type="button" aria-label="Show password">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
          <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--color-muted-foreground);">
            <input class="checkbox" type="checkbox" checked>
            Keep me signed in
          </label>
          <a href="#">Forgot password?</a>
        </div>

        <button class="btn btn--primary btn--block" type="submit" style="padding: 13px 18px; margin-top: 4px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Sign in
        </button>

      </form>

      <p style="margin: 0; text-align: center; font-size: 14px; color: var(--color-muted-foreground);">
        New here? <a href="register.html">Create an account</a>
      </p>

    </div>
  </main>

  <footer style="border-top: 1px solid var(--color-border); padding: 20px 32px; flex-shrink: 0;">
    <p class="meta" style="margin: 0;">Receipt photos and their extracted data are encrypted at rest and visible only to you.</p>
  </footer>

</div>

</body>
</html>
