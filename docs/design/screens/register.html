<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Register — Budget Agent design</title>
  <link rel="stylesheet" href="../design.css">
</head>
<body>

<div class="screen" style="height: 860px;">

  <header class="app-header">
    <div class="app-header__inner">
      <span class="brand">Budget Agent</span>
      <a class="btn-icon btn-icon--round" href="login-dark.html" aria-label="Switch to dark theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </a>
    </div>
  </header>

  <main style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 24px 32px;">
    <div style="width: 440px; display: flex; flex-direction: column; gap: 20px;">

      <div style="display: flex; flex-direction: column; gap: 6px; text-align: center;">
        <h1 class="page-title" style="font-size: 28px;">Create your account</h1>
        <p class="page-sub" style="font-size: 14px;">Photograph a receipt, get a budget. No card needed.</p>
      </div>

      <form class="card card--surface" style="padding: 24px; display: flex; flex-direction: column; gap: 16px;">

        <div class="field">
          <label class="field__label" for="reg-email">Email</label>
          <div class="input-group">
            <svg class="input-group__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            <input class="input input--with-icon" id="reg-email" type="email" value="anna@example.com">
          </div>
        </div>

        <div class="field" style="gap: 8px;">
          <label class="field__label" for="reg-password">Password</label>
          <div class="input-group">
            <svg class="input-group__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="input input--with-icon input--with-action" id="reg-password" type="password" value="••••••••••••••">
            <button class="btn-icon input-group__action" type="button" aria-label="Show password">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>

          <div style="display: flex; gap: 4px;" role="img" aria-label="Password strength: strong">
            <span class="meter meter--sm" style="flex-grow: 1; height: 4px;"><span class="meter__fill" style="width: 100%;"></span></span>
            <span class="meter meter--sm" style="flex-grow: 1; height: 4px;"><span class="meter__fill" style="width: 100%;"></span></span>
            <span class="meter meter--sm" style="flex-grow: 1; height: 4px;"><span class="meter__fill" style="width: 100%;"></span></span>
            <span class="meter meter--sm" style="flex-grow: 1; height: 4px;"></span>
          </div>

          <div style="display: flex; flex-direction: column; gap: 5px;">
            <span style="display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--color-primary);">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
              At least 12 characters
            </span>
            <span style="display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--color-primary);">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
              Not on the common-password list
            </span>
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="reg-confirm">Confirm password</label>
          <div class="input-group">
            <svg class="input-group__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="input input--with-icon" id="reg-confirm" type="password" value="••••••••••••••">
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="reg-currency">Currency</label>
          <div class="input-group">
            <select class="input select" id="reg-currency">
              <option>PLN &mdash; Polish z&#322;oty</option>
            </select>
            <svg class="select-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </div>
          <span class="field__hint">Every receipt is recorded in this currency. It can be changed until your first receipt is stored.</span>
        </div>

        <button class="btn btn--primary btn--block" type="submit" style="padding: 13px 18px; margin-top: 4px;">Create account</button>

      </form>

      <p style="margin: 0; text-align: center; font-size: 14px; color: var(--color-muted-foreground);">
        Already have an account? <a href="login.html">Sign in</a>
      </p>

    </div>
  </main>

</div>

</body>
</html>
