<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; font-family: Manrope, system-ui, sans-serif; background: #fdf2f4; color: #3b1d2a; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 8px">
    <button type="button" onclick="" aria-label="Back" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #ffffff; color: #3b1d2a; display: flex; align-items: center; justify-content: center">

  <div style="flex: 1; overflow: auto; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 18px">

        </div>

        <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #7d5868">You usually have about 820 zł left at the end of a month — 180 zł short. Two small changes close the gap.</p>
      </div>
      
        <span style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #7d5868">Where it could come from</span>
        
          <button type="button" onclick="" style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 12px 16px; border-radius: 20px; border: 2px solid transparent; background: #ffffff; color: #3b1d2a; text-align: left">

            </span>

          <button type="button" onclick="" style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 12px 16px; border-radius: 20px; border: 2px solid transparent; background: #ffffff; color: #3b1d2a; text-align: left">
