<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First sign-in, step 1 — v2</title>
<!-- Design v2 reference (F23, ADR-0022): rendered from the design canvas; static, read-only. -->

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>

<style>body{background:#e9ebf0;display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; font-family: Manrope, system-ui, sans-serif; background: #0f172a; color: #f8fafc; overflow: hidden; transition: background 0.3s">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 8px; min-height: 44px">
    
      <button type="button" aria-label="Back" onclick="" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #1e293b; color: #f8fafc; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </button>
    
    
    <div style="display: flex; gap: 6px">
      
        <span style="height: 6px; border-radius: 3px; width: 6px; background: #4ade80; transition: all 0.3s"></span>
      
        <span style="height: 6px; border-radius: 3px; width: 22px; background: #4ade80; transition: all 0.3s"></span>
      
        <span style="height: 6px; border-radius: 3px; width: 6px; background: #334155; transition: all 0.3s"></span>
      
        <span style="height: 6px; border-radius: 3px; width: 6px; background: #334155; transition: all 0.3s"></span>
      
        <span style="height: 6px; border-radius: 3px; width: 6px; background: #334155; transition: all 0.3s"></span>
      
        <span style="height: 6px; border-radius: 3px; width: 6px; background: #334155; transition: all 0.3s"></span>
      
    </div>
    
      <button type="button" onclick="" style="min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: #a3b0c5; font-weight: 600; font-size: 15px">Skip</button>
    
    
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; padding: 12px 24px 0; overflow: auto">

    

    
      <div style="display: flex; flex-direction: column; gap: 24px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Language and money</h1>
          <p style="margin: 0; font-size: 16px; color: #a3b0c5">We guessed from your phone. Change anything.</p>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #1f3b2c; font-size: 14px; font-weight: 600">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"></path><path d="M3 12h18"></path><path d="M12 3c2.5 3 2.5 15 0 18"></path><path d="M12 3c-2.5 3-2.5 15 0 18"></path></svg>
          Poland detected · Polski · PLN
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #a3b0c5">Language</span>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
            
              <button type="button" onclick="" style="min-height: 52px; border-radius: 14px; border: 2px solid #334155; background: #1e293b; color: #f8fafc; font-weight: 700; font-size: 15px">English</button>
            
              <button type="button" onclick="" style="min-height: 52px; border-radius: 14px; border: 2px solid #334155; background: #1e293b; color: #f8fafc; font-weight: 700; font-size: 15px">Українська</button>
            
              <button type="button" onclick="" style="min-height: 52px; border-radius: 14px; border: 2px solid #4ade80; background: #1e293b; color: #f8fafc; font-weight: 700; font-size: 15px">Polski</button>
            
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #a3b0c5">Currency</span>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
            
              <button type="button" onclick="" style="min-height: 52px; border-radius: 14px; border: 2px solid #4ade80; background: #1e293b; color: #f8fafc; font-weight: 700; font-size: 15px">PLN</button>
            
              <button type="button" onclick="" style="min-height: 52px; border-radius: 14px; border: 2px solid #334155; background: #1e293b; color: #f8fafc; font-weight: 700; font-size: 15px">EUR</button>
            
              <button type="button" onclick="" style="min-height: 52px; border-radius: 14px; border: 2px solid #334155; background: #1e293b; color: #f8fafc; font-weight: 700; font-size: 15px">UAH</button>
            
              <button type="button" onclick="" style="min-height: 52px; border-radius: 14px; border: 2px solid #334155; background: #1e293b; color: #f8fafc; font-weight: 700; font-size: 15px">USD</button>
            
          </div>
          <span style="font-size: 13px; color: #a3b0c5">Receipts in other currencies are converted at the NBP rate.</span>
        </div>
      </div>
    

    

    

    

    
  </div>

  <div style="padding: 16px 24px 32px; display: flex; flex-direction: column; gap: 10px">
    
      <button type="button" onclick="" style="min-height: 56px; border: 0; border-radius: 18px; background: #4ade80; color: #052e16; font-weight: 800; font-size: 17px">Continue</button>
    
    
    
  </div>
</div>

</body>
</html>
