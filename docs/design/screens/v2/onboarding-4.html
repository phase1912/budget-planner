<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First sign-in, step 4 — v2</title>
<!-- Design v2 reference (F23, ADR-0022): rendered from the design canvas; static, read-only. -->

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>

<style>body{background:#e9ebf0;display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; font-family: Manrope, system-ui, sans-serif; background: #0f172a; color: #f8fafc; overflow: hidden; transition: background 0.3s">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 8px; min-height: 44px">
    
      <button type="button" aria-label="Back" onclick="" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #1e293b; color: #f8fafc; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </button>
    
    
    <div style="display: flex; gap: 6px">
      
        <span style="height: 6px; border-radius: 3px; width: 6px; background: #4ade80; transition: all 0.3s"></span>
      
        <span style="height: 6px; border-radius: 3px; width: 6px; background: #4ade80; transition: all 0.3s"></span>
      
        <span style="height: 6px; border-radius: 3px; width: 6px; background: #4ade80; transition: all 0.3s"></span>
      
        <span style="height: 6px; border-radius: 3px; width: 6px; background: #4ade80; transition: all 0.3s"></span>
      
        <span style="height: 6px; border-radius: 3px; width: 22px; background: #4ade80; transition: all 0.3s"></span>
      
        <span style="height: 6px; border-radius: 3px; width: 6px; background: #334155; transition: all 0.3s"></span>
      
    </div>
    
      <button type="button" onclick="" style="min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: #a3b0c5; font-weight: 600; font-size: 15px">Skip</button>
    
    
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; padding: 12px 24px 0; overflow: auto">

    

    

    

    

    
      <div style="display: flex; flex-direction: column; gap: 22px">
        <div style="width: 72px; height: 72px; border-radius: 24px; background: #1f3b2c; color: #4ade80; display: flex; align-items: center; justify-content: center">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Lock it with a code</h1>
          <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #a3b0c5">Two-factor sign-in asks for a code from an authenticator app after your password.</p>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px">
          
            <button type="button" onclick="" style="display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 14px 16px; border-radius: 18px; border: 2px solid #4ade80; background: #1e293b; color: #f8fafc; text-align: left">
              <span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #4ade80; background: #4ade80; flex-shrink: 0"></span>
              <span style="display: flex; flex-direction: column; gap: 2px">
                <span style="font-weight: 700; font-size: 16px">Turn it on now</span>
                <span style="font-size: 13px; color: #a3b0c5">QR code, then 10 recovery codes</span>
              </span>
            </button>
          
            <button type="button" onclick="" style="display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 14px 16px; border-radius: 18px; border: 2px solid #334155; background: #1e293b; color: #f8fafc; text-align: left">
              <span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #334155; background: transparent; flex-shrink: 0"></span>
              <span style="display: flex; flex-direction: column; gap: 2px">
                <span style="font-weight: 700; font-size: 16px">Later, in Profile</span>
                <span style="font-size: 13px; color: #a3b0c5">Your password alone signs you in</span>
              </span>
            </button>
          
        </div>
      </div>
    

    
  </div>

  <div style="padding: 16px 24px 32px; display: flex; flex-direction: column; gap: 10px">
    
      <button type="button" onclick="" style="min-height: 56px; border: 0; border-radius: 18px; background: #4ade80; color: #052e16; font-weight: 800; font-size: 17px">Set up two-factor</button>
    
    
    
  </div>
</div>
