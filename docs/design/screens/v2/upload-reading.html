<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading — v2</title>
<!-- Design v2 reference (F23, ADR-0022): rendered from the design canvas; static, read-only. -->

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
input{font:inherit}
@keyframes scan{0%{top:6%}50%{top:90%}100%{top:6%}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

<style>body{background:#e9ebf0;display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; font-family: Manrope, system-ui, sans-serif; background: #0f172a; color: #f8fafc; overflow: hidden; position: relative">

  

  
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 48px 28px">
      <div style="position: relative; width: 170px; height: 250px; border-radius: 12px; background: #f4efe6; box-shadow: 0 20px 50px rgba(0,0,0,0.25); overflow: hidden; display: flex; flex-direction: column; gap: 9px; padding: 22px 18px; box-sizing: border-box">
        
          <span style="height: 6px; border-radius: 3px; background: #c9c1b2; width: 70%"></span>
        
          <span style="height: 6px; border-radius: 3px; background: #c9c1b2; width: 45%"></span>
        
          <span style="height: 6px; border-radius: 3px; background: #c9c1b2; width: 85%"></span>
        
          <span style="height: 6px; border-radius: 3px; background: #c9c1b2; width: 60%"></span>
        
          <span style="height: 6px; border-radius: 3px; background: #c9c1b2; width: 80%"></span>
        
          <span style="height: 6px; border-radius: 3px; background: #c9c1b2; width: 50%"></span>
        
          <span style="height: 6px; border-radius: 3px; background: #c9c1b2; width: 75%"></span>
        
          <span style="height: 6px; border-radius: 3px; background: #c9c1b2; width: 40%"></span>
        
          <span style="height: 6px; border-radius: 3px; background: #c9c1b2; width: 65%"></span>
        
          <span style="height: 6px; border-radius: 3px; background: #c9c1b2; width: 30%"></span>
        
          <span style="height: 6px; border-radius: 3px; background: #c9c1b2; width: 55%"></span>
        
          <span style="height: 6px; border-radius: 3px; background: #c9c1b2; width: 80%"></span>
        
        <span style="position: absolute; left: 0; right: 0; height: 3px; background: #4ade80; box-shadow: 0 0 18px #4ade80; animation: scan 2.2s ease-in-out infinite"></span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
        <h1 style="margin: 0; font-size: 24px; font-weight: 800">Reading your receipt</h1>
        <span style="font-size: 15px; color: #a3b0c5">Every line, its price and its category</span>
      </div>
      <div style="width: 100%; display: flex; flex-direction: column; gap: 8px">
        
          <span style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: #1e293b; font-size: 14px; font-weight: 600; animation: pop 0.4s ease both">
            <span style="width: 10px; height: 10px; border-radius: 5px; background: #4ade80"></span>
            <span style="flex: 1">Coffee Lavazza 1 kg</span>
            <span>59,99 zł</span>
          </span>
        
          <span style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: #1e293b; font-size: 14px; font-weight: 600; animation: pop 0.4s ease both">
            <span style="width: 10px; height: 10px; border-radius: 5px; background: #38bdf8"></span>
            <span style="flex: 1">Kids T-shirt</span>
            <span>49,99 zł</span>
          </span>
        
          <span style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: #1e293b; font-size: 14px; font-weight: 600; animation: pop 0.4s ease both">
            <span style="width: 10px; height: 10px; border-radius: 5px; background: #fb7185"></span>
            <span style="flex: 1">Shampoo Elseve</span>
            <span>24,99 zł</span>
          </span>
        
      </div>
      <button type="button" onclick="" style="min-height: 52px; width: 100%; border: 0; border-radius: 18px; background: #1e293b; color: #f8fafc; font-weight: 700; font-size: 15px">Show the result</button>
    </div>
  

  

  

  
</div>

</body>
</html>
