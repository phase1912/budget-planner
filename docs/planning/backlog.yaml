# Source of truth for the AI Budget Agent delivery backlog.
#
# This file — not GitHub — is authoritative. `scripts/backlog_sync.py` pushes it
# idempotently into GitHub milestones, issues, labels and the Projects v2 board.
# To change the plan: edit this file, commit, re-run the sync.
#
# Hierarchy: epic -> feature -> task.
#   epic    -> a GitHub milestone AND a tracking issue (label: epic)
#   feature -> an issue (label: feature), listed in its epic's task-list
#   task    -> an issue (label: task), listed in its feature's task-list
#
# `tasks:` is only populated for epics that have been groomed. Ungroomed epics
# carry features only and are decomposed just before work on them starts, so the
# decomposition reflects the codebase as it actually is at that moment.
#
# `key:` on a task is its permanent identity — the marker `sync` matches an
# existing GitHub issue against. Without it the key is positional, so deleting a
# task silently re-points every issue below it at the wrong task and orphans the
# last one. Every task that owns an issue carries an explicit key; write one for
# any new task at grooming time and never reuse a retired key.
#
# `depends_on:` lists the backlog keys that must land before this item can start,
# and renders into the issue body as "Blocked by: #N". Order of work comes from
# these edges, not from epic numbers — E9's frontend foundation is deliberately
# built before E1, and the numbering does not say so on its own.
#
# Epics are vertical slices, not layers: the UI for a capability belongs in the
# same epic — and, at grooming time, in the same feature — as the endpoint it
# calls, so one pull request delivers a slice testable from the screen down to
# the database. A trailing "interface" feature is for genuinely aggregate screens
# only (a dashboard over several capabilities), never for "the frontend half".
#
# `demo:` is how that rule is enforced rather than merely stated. Every phase-1
# feature says how it is demonstrated by using the product, and the sync writes it
# into the issue under "Demonstrated by". It is not always a new screen: a feature
# may name screens that already exist ("no screen of its own — proven by ..."), and
# some genuinely have no surface of their own. What is not allowed is a feature
# that can only be shown to work by reading a test. If writing `demo:` is hard,
# that is the signal the feature is a layer rather than a slice — F1.5, F2.6, F3.7,
# F5.7, F7.7 and F8.10 were all retired for exactly that reason, and the retired
# keys are listed at the point in the file where each used to sit.
#
# `scope:` decides what is built. `diploma` epics are the diploma project: the base
# already delivered, E8 to the end, and the epics the competitor analysis chose as
# what the product does better than the apps already on the market (see "Diploma
# scope" in docs/planning/working-agreement.md).
# `out-of-scope` epics stay planned in the open but are not worked on. Every issue is
# labelled with its epic's scope, and the board's Scope field splits it the same way.
# When a feature the analysis asks for already sits in a planned epic, that epic is
# moved into scope rather than a new one written; a new epic is written only where
# that is simpler, and the old one is then left out of scope.
#
# `phase:` records where an epic came from: 1 for the BRD, 2 for scope beyond it.
# It no longer decides what ships; `scope:` does.

project:
  name: AI Budget Agent
  repo: phase1912/budget-planner
  brd: docs/requirements/ai-budget-agent-brd-v1.1.md

labels:
  - {name: epic,       color: "5319E7", description: "Tracking issue for an epic"}
  - {name: feature,    color: "1D76DB", description: "A user-visible capability inside an epic"}
  - {name: task,       color: "0E8A16", description: "An implementable unit of work"}
  - {name: backend,    color: "B60205", description: "FastAPI / Python side"}
  - {name: frontend,   color: "FBCA04", description: "React / MobX side"}
  - {name: database,   color: "5B4C3B", description: "Schema, migrations, queries"}
  - {name: ai,         color: "D93F0B", description: "Claude API, extraction, classification, advice"}
  - {name: infra,      color: "C2E0C6", description: "Tooling, CI, environments, deployment"}
  - {name: security,   color: "000000", description: "Security, privacy, access control"}
  - {name: testing,    color: "BFDADC", description: "Test harness and acceptance coverage"}
  - {name: needs-grooming, color: "E99695", description: "Not yet decomposed into tasks"}
  - {name: diploma,      color: "0E8A16", description: "In the diploma project's scope"}
  - {name: out-of-scope, color: "D4C5F9", description: "Planned, but not part of the diploma project"}

epics:

  - key: E0
    title: Foundation & Delivery Platform
    br: []
    phase: 1
    scope: diploma
    groomed: true
    summary: >
      Everything required before a single business requirement can be implemented:
      repository layout, both runtimes, the database and migration baseline, the local
      development environment, CI, and a BDD harness that executes the BRD's Gherkin
      scenarios directly.
    features:

      - key: F0.1
        title: Repository layout and language tooling
        labels: [infra]
        intent: >
          A contributor can clone the repository and get a lint-clean, type-checked
          workspace for both the Python and the TypeScript side with one documented command.
        tasks:
          - key: F0.1.1
            title: Establish the repository layout (backend, frontend, infra, docs, scripts)
            labels: [infra]
            detail: >
              Create the top-level directories with placeholder READMEs describing what belongs
              in each. Document the boundary rule: no import may cross from frontend to backend
              except through the generated OpenAPI client.
          - key: F0.1.2
            title: Set up the Python project with uv and pyproject.toml
            labels: [backend, infra]
            detail: >
              Python 3.12, uv-managed lockfile, dependency groups for runtime vs dev.
              Pin FastAPI, SQLAlchemy 2.x, Alembic, pydantic-settings, anthropic.
          - key: F0.1.3
            title: Configure ruff, mypy and pre-commit for the backend
            labels: [backend, infra]
            detail: >
              ruff for lint and format, mypy in strict mode for app code. pre-commit runs both
              plus trailing-whitespace and end-of-file fixers. CI must run the same versions.
          - key: F0.1.4
            title: Add EditorConfig, license and contribution conventions
            labels: [infra]
            detail: >
              .editorconfig covering both languages, LICENSE, and a CONTRIBUTING.md that states
              the branch naming and commit message conventions used by the ticket workflow.
          - key: F0.1.5
            title: Support feature-scoped branches and pull requests in the ticket workflow
            labels: [infra]
            detail: >
              The ticket-first workflow (working-agreement.md, the task skill, AGENTS.md) only
              covered one task per branch per pull request. Tasks inside one feature routinely
              overlap in practice, producing diffs that conflicted across separate branches.
              Add a feature-scoped mode: when the unit of work is a whole feature rather than
              one task, use a single feature/<key>-<slug> branch, implement every task under
              the feature as one consistent pass instead of task-by-task in isolation, and open
              one pull request whose body closes every task issue under the feature (one
              `Closes #N` per issue). The single-task workflow is unchanged.

      - key: F0.2
        title: FastAPI application skeleton
        labels: [backend]
        intent: >
          A running API process exists with configuration, health reporting, a uniform error
          envelope and a published OpenAPI schema, so feature work only adds routers.
        tasks:
          - key: F0.2.1
            title: Application factory and router registration
            labels: [backend]
            detail: >
              create_app() assembling middleware, exception handlers and routers. Routers are
              registered from a single module so feature epics add one line, not wiring.
          - key: F0.2.2
            title: Configuration module using pydantic-settings
            labels: [backend, infra]
            detail: >
              Typed settings with env-var layering and fail-fast validation on boot. No direct
              os.environ reads anywhere else in the codebase.
          - key: F0.2.3
            title: Health and version endpoints
            labels: [backend]
            detail: >
              GET /health returning liveness plus database reachability, and GET /version
              returning build SHA and parser version (the latter is required by BRD A15).
          - key: F0.2.4
            title: Uniform error envelope and global exception handlers
            labels: [backend]
            detail: >
              RFC 7807 problem+json responses. Validation, not-found, permission and internal
              errors each map to a stable machine-readable code that the client can branch on.
              BRD A2 and B6 both require reasons to be returned, not just status codes.

      - key: F0.3
        title: PostgreSQL, SQLAlchemy and Alembic baseline
        labels: [database]
        intent: >
          The persistence layer is established with async sessions, migration tooling and
          model conventions, so entities from the BRD data model can be added incrementally.
        tasks:
          - key: F0.3.1
            title: Async SQLAlchemy engine and request-scoped session dependency
            labels: [backend, database]
            detail: >
              Async engine with a pool sized from settings, and a FastAPI dependency yielding a
              session per request with commit-on-success and rollback-on-exception semantics.
          - key: F0.3.2
            title: Initialise Alembic with the async migration template
            labels: [database]
            detail: >
              Alembic configured against the same settings object, autogenerate enabled, and a
              documented policy that every schema change ships as a reviewed migration.
          - key: F0.3.3
            title: Declarative base and model conventions
            labels: [database]
            detail: >
              UUID primary keys, created_at/updated_at on every table, and an explicit constraint
              naming convention so autogenerated migrations are deterministic.
          - key: F0.3.4
            title: Baseline migration enabling required PostgreSQL extensions
            labels: [database]
            detail: >
              Enable pgcrypto (needed for encryption at rest under BRD N1) and any UUID support
              the chosen generation strategy requires.

      - key: F0.4
        title: Local development environment
        labels: [infra]
        intent: >
          A developer can bring up the full stack — API, client, PostgreSQL and S3-compatible
          object storage — locally with one command.
        tasks:
          - key: F0.4.1
            title: Docker Compose stack with PostgreSQL and MinIO
            labels: [infra]
            detail: >
              Compose file with pinned images, named volumes, health checks, and a bootstrap step
              creating the receipts bucket. MinIO stands in for production object storage.
              Lives at the repository root, not under infra/, so `docker compose up` works from
              a fresh clone with no extra flags.
          - key: F0.4.2
            title: Task runner targets for the common workflows
            labels: [infra]
            detail: >
              up, down, migrate, test, lint, typecheck. Both languages behind the same
              interface so nobody memorises two toolchains. The `seed` target landed with
              the seed script itself in F5.8.
          - key: F0.4.4
            title: Quickstart section in the README
            labels: [infra]
            detail: >
              Clone-to-running instructions, prerequisites with versions, and how to obtain and
              configure the Claude API key.

      - key: F0.5
        title: Continuous integration
        labels: [infra]
        intent: >
          Every pull request is automatically linted, type-checked and tested on both sides,
          and schema drift is caught before merge.
        tasks:
          - key: F0.5.1
            title: Backend CI workflow
            labels: [infra, backend]
            detail: >
              GitHub Actions job running ruff, mypy and pytest against a service-container
              PostgreSQL, with dependency caching keyed on the uv lockfile.
          - key: F0.5.2
            title: Frontend CI workflow
            labels: [infra, frontend]
            detail: >
              ESLint, tsc --noEmit, Vitest and a production build, so type or build breakage
              cannot reach the default branch.
          - key: F0.5.3
            title: Migration drift check
            labels: [infra, database]
            detail: >
              CI job asserting that alembic autogenerate against the models produces an empty
              diff, catching model changes that shipped without a migration.
          - key: F0.5.4
            title: Pull request template and CODEOWNERS
            labels: [infra]
            detail: >
              PR template linking back to the closing issue and listing the BRD requirement IDs
              the change satisfies, so traceability from BRD to commit is mechanical.

      - key: F0.6
        title: BDD acceptance harness
        labels: [testing]
        intent: >
          The Gherkin scenarios already written in the BRD execute as the automated acceptance
          suite, so acceptance criteria and regression tests are the same artefact.
        tasks:
          - key: F0.6.1
            title: pytest foundation with async support and isolated test database
            labels: [testing, backend]
            detail: >
              pytest-asyncio, a per-run test database created from migrations, and transactional
              rollback between tests for isolation.
          - key: F0.6.2
            title: Extract the BRD Gherkin into executable .feature files
            labels: [testing]
            detail: >
              Move the scenarios from BRD sections BR-1 through BR-6 into tests/features/, one
              file per business requirement, preserving the wording verbatim so the documents
              stay comparable. Steps are stubbed as skipped until their epic is implemented.
          - key: F0.6.3
            title: Test data factory infrastructure and conventions
            labels: [testing]
            detail: >
              The factory library, the base class and the naming convention that lets a scenario
              read as business language rather than ORM setup. Delivers no per-entity factory:
              no domain entity exists yet at E0, and each is added by the epic that introduces
              it — the same rule F1.3's cross-user suite follows.
          - key: F0.6.4
            title: Coverage reporting and BRD traceability report
            labels: [testing]
            detail: >
              Coverage gate in CI, plus a generated report mapping each BRD requirement ID
              (A1-A15, B1-B9, C1-C7, D1-D7, E1-E6, F1-F9, N1-N6) to the tests covering it.

      - key: F0.7
        title: Configuration, secrets and environments
        labels: [infra, security]
        intent: >
          Configuration and secrets are handled consistently across local, CI and deployed
          environments, with no credential ever committed.
        tasks:
          - key: F0.7.1
            title: Document the settings surface and provide .env.example
            labels: [infra]
            detail: >
              Every setting listed with purpose, default and whether it is required, including
              the thresholds BRD section 10 defers to design time.
          - key: F0.7.2
            title: Secret handling for CI and deployment
            labels: [infra, security]
            detail: >
              GitHub Actions secrets for the Claude API key and database credentials, with a
              documented rotation procedure and secret scanning enabled on the repository.
          - key: F0.7.3
            title: Environment matrix definition
            labels: [infra]
            detail: >
              Define local, staging and production: what differs, which is authoritative for
              data, and which AI model tier each uses.

      - key: F0.8
        title: Global architecture and domain model documentation
        labels: [infra]
        intent: >
          A written reference for the system's shape and its business rules, kept current as
          the codebase grows, so a reader (human or agent) can act on global context instead
          of re-deriving it from the BRD or from reading the whole codebase.
        tasks:
          - key: F0.8.1
            title: Write docs/architecture/overview.md and domain-model.md
            labels: [infra]
            detail: >
              overview.md: component boundaries, layering (router/service/repository/port),
              the ingestion pipeline's three requirement-driven properties (async processing,
              manual_review as a state, same-receipt-only matching), security posture, and
              explicit non-goals from BRD section 4.2. domain-model.md: entities, the receipt
              lifecycle, and a numbered list of invariants traced to BRD requirement IDs,
              plus a table of the BRD's open questions and which epics they block. Both
              documents carry an explicit instruction to be updated in the same commit as
              any change that invalidates them, and CLAUDE.md and the task skill reference
              them as required reading before structural or business-rule changes.

      - key: F0.9
        title: Cloud deployment on Google Cloud, deployed on every merge
        labels: [infra]
        depends_on: [F0.5, F0.7]
        intent: >
          The application runs in the cloud from infrastructure-as-code, not by hand, and every
          merge to main deploys itself. Targets Google Cloud (ADR-0014, which replaces the AWS
          decision in ADR-0002) at the smallest sizes that run it reliably: one production
          environment, a scale-to-zero backend, Postgres on a free-tier VM, and free static
          hosting, about $1-4 a month. Staging is deliberately absent while the author is the
          only user.
        demo: >
          No screen of its own: merge a visible change to main, watch the Deploy workflow go
          green, and open the production URL on a phone to see it live — sign in, upload a
          receipt photo and find it read, and forward an e-receipt to the appspotmail address
          shown in Profile.
        tasks:
          - key: F0.9.1
            title: Decide the Google Cloud deployment
            labels: [infra]
            detail: >
              ADR-0014: Cloud Run for the backend, Postgres on an e2-micro VM, Cloud Storage
              as the backend's service account (no keys), Firebase Hosting, Vertex AI Gemini, App Engine for
              inbound mail, Secret Manager, Workload Identity Federation for CI. Records costs,
              limits and risks; marks ADR-0002 superseded; updates environments.md, secrets.md
              and configuration.md.
          - key: F0.9.2
            title: Production backend image and cloud settings
            labels: [infra, backend]
            detail: >
              A production Dockerfile (no reload, non-root, listens on $PORT); the Anthropic key
              stops being required now that every model goes through the llm_* settings
              (ADR-0006); Vertex AI project and location become settings passed to the agent; a
              Cloud Storage adapter behind StoragePort reaches the photo bucket keylessly, since
              the organisation forbids service account keys.
          - key: F0.9.3
            title: Terraform for the production environment
            labels: [infra]
            detail: >
              One root module under infra/terraform with state in GCS: APIs, network, the
              database VM with its data disk and daily snapshots, the photo bucket, Artifact Registry, secrets, the Cloud Run service and migrations job, App
              Engine, service accounts with least privilege, GitHub Workload Identity
              Federation and a billing budget with alerts.
          - key: F0.9.4
            title: Inbound mail relay on App Engine
            labels: [infra, backend]
            detail: >
              The production counterpart of infra/dev/mail-relay: receives
              *@<project>.appspotmail.com and posts each raw message to the intake webhook with
              the shared secret (ADR-0013).
          - key: F0.9.5
            title: Deploy on every merge to main
            labels: [infra]
            detail: >
              A Deploy workflow that runs after CI passes on main: build and push the backend
              image, run migrations as a Cloud Run job, deploy the service, build and publish
              the frontend to Firebase Hosting, redeploy the mail relay when it changed, and
              smoke-test the health endpoint. Terraform gets fmt and validate checks in CI.
          - key: F0.9.6
            title: First deployment and its runbook
            labels: [infra]
            detail: >
              Apply the infrastructure, run the first deploy, check the demo end to end
              (including presigned photo URLs signed through IAM) and write the runbook:
              bootstrap, apply, restoring the database from a snapshot, and stopping costs.

      - key: F0.10
        title: Identity, access and NFR acceptance criteria in the BRD
        labels: [testing, security]
        intent: >
          Every existing BRD scenario opens with "Given the user is logged in", but the BRD
          itself never says what that means, and section 8's non-functional requirements
          (N1-N6) have EARS text with no Gherkin at all — both are real gaps F0.6.2's
          extraction correctly left untouched, since it could only move what the BRD already
          had. This closes them the same way BR-1..BR-6 were written: business-approved
          acceptance criteria first, so E1 (Identity & Account) and E10 (Security, Privacy &
          Observability) have something to build against instead of inventing it mid-epic.
        tasks:
          - key: F0.10.1
            title: BR-7 Identity & Access, and NFR acceptance scenarios
            labels: [testing, security]
            detail: >
              Adds a new BR-7 section to the BRD (EARS requirements + Gherkin) covering
              registration, login, logout and session refresh; an admin role limited to
              service operation (no exception to N2 — an admin never reads another user's
              receipts or statistics); and sign-in via Google/Facebook OIDC coexisting with
              password auth, linked to an existing account only on a verified email match,
              with an explicit scenario rejecting a link attempt on an unverified email
              (the standard account-takeover vector for social login). Adds a Gherkin block
              to BRD section 8 for N1-N6, which today are EARS-only. Extends BRD section 9's
              data model with the User.role field and the identity-provider link entity BR-7
              needs. Mirrors F0.6.2's own job for this new material: the scenarios land in
              tests/features/br7_identity_and_access/ and tests/features/nfr_cross_cutting/,
              wired via pytest-bdd and skipped pending E1/E10, and
              scripts/generate_brd_traceability.py regenerates brd-traceability.md to include
              them. Updates E1's `br:` list in backlog.yaml to add BR-7 alongside N2.

  - key: E1
    title: Identity & Account
    br: [BR-7, N2]
    phase: 1
    scope: diploma
    groomed: true
    summary: >
      Every BRD scenario begins with "Given the user is logged in", and N2 forbids one user's
      data from reaching another. This epic establishes authentication, session handling, the
      user profile fields from the BRD data model, and the scoping guarantee that all later
      epics depend on. Full stack, and paired feature by feature rather than layer by layer:
      the login and registration screens ship inside F1.1 with the endpoints they post to,
      and token storage, transparent refresh and the protected route table ship inside F1.2
      with the session model they depend on. E9 owns only the frontend groundwork that has
      no domain dependency.
    features:

      - key: F1.1
        title: Registration and login
        labels: [backend, security, frontend]
        depends_on: [F9.4, F9.6]
        intent: >
          A person can create an account with an email and password and authenticate with it,
          through the product rather than through curl: the screens ship with the endpoints.
        demo: >
          Create an account on /register, sign out, sign back in on /login, and land on the
          root route as yourself. Then fail a sign-in and confirm a wrong password and an
          unknown address are indistinguishable (BRD N2).
        tasks:
          - key: F1.1.1
            title: User table migration and SQLAlchemy model
            labels: [database]
            detail: >
              Implements the User entity from BRD section 9: user_id, email, password_hash,
              currency, budget_limit. The goal relationship is added by epic E8; currency and
              budget_limit land here because they are account-level settings.
          - key: F1.1.2
            title: Password hashing and strength policy
            labels: [backend, security]
            detail: >
              Argon2id with documented parameters, a minimum-length policy, and a check against
              a common-password list. Hashing cost must be configurable per environment so tests
              stay fast without weakening production.
          - key: F1.1.3
            title: POST /auth/register endpoint
            labels: [backend]
            detail: >
              Validates the payload, rejects duplicate emails without revealing whether an
              address is registered, and returns the created account with a session.
          - key: F1.1.4
            title: POST /auth/login endpoint
            labels: [backend]
            detail: >
              Constant-time credential verification, a uniform error for both unknown email and
              wrong password, and throttling on repeated failures.
          - key: F1.1.5
            title: Acceptance tests for registration and login
            labels: [testing]
            detail: >
              Covers the happy path, duplicate registration, wrong password, and the guarantee
              that responses do not leak account existence.
          - key: F1.1.6
            title: Login and registration screens
            labels: [frontend]
            detail: >
              The two public routes, built from docs/design/screens/login.html and
              register.html and posting through the generated client. The sign-in failure
              shows one message for both an unknown address and a wrong password, matching
              what F1.1.4 returns — the screen must not leak what the endpoint withholds.
          - key: F1.1.7
            title: Post-login landing at the root route
            labels: [frontend]
            detail: >
              Where signing in actually lands, per docs/design/screens/home.html: account
              facts, an honest "no receipts yet" and one way forward. F6.7 later replaces the
              body of this same route with the dashboard rather than adding a second one
              (ADR 0004).

      - key: F1.2
        title: Session and token management
        labels: [backend, security, frontend]
        depends_on: [F9.4]
        intent: >
          An authenticated session persists across requests, can be refreshed, and can be
          revoked on logout — including on the client, where the token is held and where
          expiry decides what the user sees.
        demo: >
          Stay signed in across a reload; let the access token expire mid-edit and watch the
          action complete anyway; sign out on one device and find the other rejected.
        tasks:
          - key: F1.2.1
            title: Access token issuance
            labels: [backend, security]
            detail: >
              Short-lived JWT carrying the user id and issued-at, signed with a key from
              settings. Claims kept minimal — no financial data in the token.
          - key: F1.2.2
            title: Refresh token storage and rotation
            labels: [backend, security, database]
            detail: >
              Server-side refresh tokens with rotation on use and reuse detection that revokes
              the whole family, so a stolen refresh token cannot be replayed.
          - key: F1.2.3
            title: Refresh and logout endpoints
            labels: [backend]
            detail: >
              POST /auth/refresh exchanging a valid refresh token, POST /auth/logout revoking
              the current session.
          - key: F1.2.4
            title: Current-user dependency
            labels: [backend]
            detail: >
              A FastAPI dependency resolving the authenticated user, returning 401 with the
              standard error envelope when absent or expired. This is the single entry point
              every protected route uses.
          - key: F1.2.5
            title: Token storage and the authenticated fetch layer
            labels: [frontend, security]
            detail: >
              Where the access token lives on the client and how the refresh in F1.2.2 is
              spent: a 401 triggers one refresh and replays the original request, so a token
              expiring mid-edit does not cost the user their work. Concurrent 401s share a
              single refresh rather than racing to rotate the family.
          - key: F1.2.6
            title: Protected route table and expiry redirect
            labels: [frontend]
            detail: >
              The public-versus-authenticated split F9.4.3 left open, the guard in front of
              it, and the redirect when a session ends — returning the user to where they
              were once they sign back in, not to the root.

      - key: F1.3
        title: Per-user data scoping guarantee
        labels: [security, backend]
        intent: >
          Satisfies BRD N2 structurally rather than by convention: it must be difficult to
          write a query that returns another user's data.
        demo: >
          No screen of its own — it is what every other feature's cross-account check rests on.
          Proven by signing in as a second account and finding the first account's receipts,
          statistics and goals absent, with direct URLs answering 404 rather than 403.
        tasks:
          - key: F1.3.1
            title: Request-scoped user context
            labels: [backend]
            detail: >
              The authenticated user id is available to the persistence layer for the duration
              of the request without being threaded manually through every function signature.
          - key: F1.3.2
            title: Ownership-enforcing repository base class
            labels: [backend, database]
            detail: >
              A base repository that applies the user_id filter automatically for all
              user-owned entities. Bypassing it requires an explicit, greppable escape hatch.
          - key: F1.3.3
            title: Cross-user access test suite
            labels: [testing, security]
            detail: >
              For every user-owned resource, assert that user B receives 404 rather than 403
              for user A's records, so existence is not disclosed. This suite is extended by
              each later epic that introduces a new owned entity.

      - key: F1.4
        title: User profile and preferences
        labels: [backend, frontend]
        depends_on: [F1.1, F9.4]
        intent: >
          A user can set the account currency and an optional monthly budget limit, which
          BRD D7 uses to express spend as a percentage of target.
        demo: >
          Set a monthly limit in Preferences and see it reflected on the root route. Try to
          change currency once receipts exist and find the control locked with the reason.
        tasks:
          - key: F1.4.1
            title: GET and PATCH /me endpoints
            labels: [backend]
            detail: >
              Read and partially update the profile. Changing budget_limit must not retroactively
              rewrite finalised monthly snapshots — it affects presentation only.
          - key: F1.4.2
            title: Currency validation and the single-currency assumption
            labels: [backend]
            detail: >
              ISO 4217 validation, and an explicit guard rejecting a currency change once
              receipts exist, since BRD section 4.2 puts conversion out of scope.
          - key: F1.4.3
            title: Profile screen
            labels: [frontend]
            detail: >
              Displays and edits currency and monthly budget limit, backed by a MobX store
              following the conventions set in epic E9.

  # F1.5 "Authentication flows and protected routing" was retired here. Collecting this
  # epic's whole UI into one trailing feature was the same layering mistake that put
  # authentication's screens in E9 to begin with — it just moved the seam. Its work now
  # sits with the endpoints it exercises: the screens in F1.1.6 and F1.1.7, token storage
  # and the route guard in F1.2.5 and F1.2.6. Issue #198 was closed by hand, as #119 was
  # when F9.5 was retired for the same reason. The key is retired; never reuse it.

  - key: E2
    title: Receipt Ingestion & Storage
    br: [BR-1]
    phase: 1
    scope: diploma
    groomed: true
    summary: >
      Accepting receipt photos: format validation, the two upload modes with their photo-count
      and size limits, durable encrypted storage of the originals, and asynchronous processing
      status. Covers BRD A1 through A8 and the storage half of A12.

      The upload screen is built here rather than parked in a trailing interface feature:
      F2.1 puts it on screen, and F2.2, F2.3 and F2.5 each extend it as they land, so every
      feature in this epic can be exercised by using the product.
    features:
      - key: F2.1
        title: Upload endpoint, format validation and the upload screen
        labels: [backend, frontend]
        requirements: [A1, A2]
        depends_on: [F1.2, F9.4]
        intent: >
          Submitted files are validated as JPEG, PNG, HEIC or PDF-scan by content inspection
          rather than by extension, and rejections state the accepted formats — with the screen
          that submits them. The first slice of docs/design/screens/upload-1-photos.html: pick
          files, send them, see what came back.
        demo: >
          Choose a photo on /upload and send it. Then choose a .docx and watch it be refused
          with the accepted formats named, per the "Unsupported file" panel in
          docs/design/screens/states.html.
      - key: F2.2
        title: Single-receipt upload mode
        labels: [backend, frontend]
        requirements: [A3, A4, A7, A8]
        depends_on: [F2.1]
        intent: >
          One receipt captured across up to 10 photos totalling at most 50 MB, with limit
          violations rejected and explained. Adds the mode selector, the photo strip and the
          count-and-size meter to F2.1's screen — the limits are enforced on the server and
          shown before bytes are sent, not only after.
        demo: >
          Add photos in single-receipt mode and watch the meter fill; add an eleventh and see
          the 10-photo limit refuse it in words rather than silence.
        tasks:
          - key: F2.2.1
            title: Extend upload endpoint for multiple files and limits
            labels: [backend]
            detail: >
              Modify POST /receipts/upload to accept a list of files. Enforce a maximum of 10
              files per request and a total payload size of 50 MB. Return a 400 with a specific
              RFC 7807 problem json when limits are exceeded (BRD A4, A8).
          - key: F2.2.2
            title: Upload screen mode selector and photo strip
            labels: [frontend]
            detail: >
              Update the upload UI to include a mode selector (Single vs Multiple) and a photo
              strip for previewing selected files, plus a meter showing count/size against the
              10-photo/50MB limits before submission.
          - key: F2.2.3
            title: BDD scenarios for single-receipt mode limits
            labels: [testing]
            detail: >
              Write and wire acceptance tests verifying the 10-photo and 50MB limits are enforced
              on the server and explained clearly on rejection.
      - key: F2.3
        title: Multiple-receipts upload mode
        labels: [backend, frontend]
        requirements: [A3, A5, A6, A7, A8]
        depends_on: [F2.2]
        intent: >
          Several distinct receipts in one session, one upload line each, with the 10-photo and
          50 MB limits applied independently per line so one bad line cannot fail the others.
          Adds the second mode and the per-line UI to the same screen.
        demo: >
          Add two upload lines, overload the first past 10 photos, and confirm the second line
          is untouched and still submits — the independence A7 requires, visible rather than
          asserted.
        tasks:
          - key: F2.3.1
            title: Multi-line multiple-receipts upload endpoint
            labels: [backend]
            detail: >
              Extend the API to accept multiple distinct receipts in one request, with limits
              (10 photos / 50MB) applied independently to each receipt (BRD A7).
          - key: F2.3.2
            title: Multiple-receipts mode frontend
            labels: [frontend]
            detail: >
              Add the multi-line UI for multiple-receipts mode. Let the user add distinct upload
              lines, each tracked and validated independently.
      - key: F2.4
        title: Encrypted object storage for receipt images
        labels: [backend, security]
        requirements: [A12, N1]
        depends_on: [F2.1]
        intent: >
          Original images are stored in object storage encrypted at rest, referenced from the
          receipt record, and retrievable only by their owner via time-limited URLs.
        demo: >
          No screen of its own — the photo thumbnails on F2.1's screen render through the
          time-limited URL, so they prove the path works. Ownership is shown by signing in as
          a second account and getting a 404 for the first account's image URL (BRD N2).
        tasks:
          - key: F2.4.1
            title: S3-compatible storage integration
            labels: [backend, infra]
            detail: >
              Implement a storage service client (e.g., using aiobotocore or minio) that uploads
              files to the configured bucket with encryption at rest (BRD A12, N1).
          - key: F2.4.2
            title: Time-limited URL generation
            labels: [backend, security]
            detail: >
              Implement an endpoint or service to generate presigned, time-limited URLs for
              viewing receipt images, ensuring only the owner can access them.
      - key: F2.5
        title: Asynchronous ingestion pipeline and status tracking
        labels: [backend, frontend]
        requirements: [N4]
        depends_on: [F2.1]
        intent: >
          Upload returns immediately with a tracking handle while parsing proceeds in the
          background, so the 10-second target of N4 is a processing budget rather than a
          request timeout. Adds the processing state to the upload screen.
        demo: >
          Send a batch and watch the "Reading 2 receipts" state from
          docs/design/screens/states.html — then leave the page and come back to find the work
          still progressing.
        tasks:
          - key: F2.5.1
            title: Background worker queue and task submission
            labels: [backend, infra]
            detail: >
              Introduce a background task queue (e.g. using FastAPI BackgroundTasks or celery/rq)
              to process receipts asynchronously and return a tracking handle immediately (BRD N4).
          - key: F2.5.2
            title: Processing state API and frontend polling
            labels: [backend, frontend]
            detail: >
              Add an endpoint to query the status of a given tracking handle. Update the upload
              wizard to poll this endpoint and render the processing state panel.

  # F2.6 "Upload user interface" was retired here. It was the whole epic's UI in one trailing
  # feature, which left F2.1 through F2.5 with nothing to try by hand — the same layering
  # mistake as F1.5, one epic further along. Its work now sits with the endpoints it exercises
  # (F2.1, F2.2, F2.3, F2.5), and the three-step wizard frame moved to F3.1, which is where a
  # second step first exists to step to. Issue #62 was closed by hand. The key is retired.

  - key: E3
    title: Receipt Parsing & Extraction
    br: [BR-1]
    phase: 1
    scope: diploma
    groomed: false
    summary: >
      Turning a validated photo into a structured receipt: field extraction, confidence
      handling, manual-review flagging, duplicate detection and persistence with provenance.
      Covers BRD A9 through A15.

      This is where photographing a receipt starts paying off, so F3.1 puts step 2 of the
      upload wizard on screen and every later feature in the epic extends it. Nothing here
      ships as extraction that only a test can see.
    features:
      - key: F3.1
        title: Vision extraction, and seeing what was read
        labels: [ai, backend, frontend]
        requirements: [A9]
        depends_on: [F2.1, F9.4]
        intent: >
          A versioned, testable adapter over the Claude vision API that turns receipt images
          into structured output, with the prompt and schema under source control — and the
          screen that shows the result. Introduces the three-step wizard frame, because this
          is the first point at which a second step exists to step to (the frame was formerly
          F2.6's). First slice of docs/design/screens/upload-2-extracted.html.
        demo: >
          Photograph a real receipt, send it, and read the merchant, date and line items back
          off step 2 of the wizard.
      - key: F3.2
        title: Extraction schema and validation
        labels: [ai, backend, frontend]
        requirements: [A9]
        depends_on: [F3.1]
        intent: >
          Merchant, transaction date, transaction time, line items (name, quantity, unit price,
          total price) and total amount, validated for internal arithmetic consistency. The
          screen gains the per-receipt footer reconciling the sum of lines against the printed
          total.
        demo: >
          Upload a receipt whose lines do not add up to its printed total and see the
          disagreement stated on step 2 rather than absorbed silently.
      - key: F3.3
        title: Confidence scoring and low-confidence flagging
        labels: [ai, backend, frontend]
        requirements: [A10]
        depends_on: [F3.2]
        intent: >
          Per-field confidence recorded, and fields below threshold marked "low confidence" and
          surfaced for confirmation instead of being silently accepted. The screen marks those
          fields where they appear.
        demo: >
          Upload a blurred receipt and find the unreadable total marked "low confidence" on
          step 2 instead of presented as fact.
      - key: F3.4
        title: Manual-review status for missing critical fields
        labels: [backend, frontend]
        requirements: [A11]
        depends_on: [F3.3]
        intent: >
          A receipt without an extractable total or date is marked "requires manual review" and
          excluded from all automated budget calculation until a human resolves it — and says
          so on its face wherever it appears.
        demo: >
          Upload a receipt with its total torn off; the screen says the total could not be
          read and that the receipt is held out until it is supplied, per the "Held out of the
          total" panel in docs/design/screens/states.html.
      - key: F3.5
        title: Receipt persistence with provenance
        labels: [database, backend]
        requirements: [A12, A13, A15]
        depends_on: [F3.2]
        intent: >
          Header, line items and image reference stored under a unique receipt id, owned by the
          submitting account, stamped with processing time and parser version.
        demo: >
          No screen of its own — it is proven by what depends on it. Complete the wizard, then
          re-upload the same receipt and watch F3.6 recognise it, which is only possible if
          the first one was really stored. F3.8 then shows it in a list.
      - key: F3.6
        title: Duplicate receipt detection
        labels: [backend, frontend]
        requirements: [A14]
        depends_on: [F3.5]
        intent: >
          A receipt matching an existing one on merchant, date and total prompts the user to
          confirm before storing, rather than being silently accepted or silently dropped. Two
          trips to one shop on one day are normal, so this asks rather than decides.
        demo: >
          Upload the same receipt twice and answer the prompt both ways — once skipping, once
          storing it as new — per the "Possible duplicate upload" panel in
          docs/design/screens/states.html.
      - key: F3.8
        title: Receipt list and detail
        labels: [backend, frontend]
        requirements: [A12, A13, N2]
        depends_on: [F3.5, F1.2, F9.4]
        intent: >
          What "Receipts" in the navigation means: the endpoint listing an account's stored
          receipts newest first with pagination, and the screens over it — the list, and a
          detail dialog showing the merchant and everything bought. Screens at
          docs/design/screens/receipts.html and receipt-detail.html. Deliberately no
          per-category summary in the dialog yet.
        demo: >
          Open Receipts, page through them, and click one to read its line items. Sign in as a
          second account and confirm the first account's receipts are absent and its receipt
          URL returns 404 rather than 403 (BRD N2).

      - key: F3.9
        title: Correct a stored receipt
        labels: [backend, frontend]
        requirements: [A11, D6]
        depends_on: [F3.8]
        intent: >
          Edit the merchant, date, total and line items of a receipt that is already stored,
          from the detail dialog the "Edit" button already sits in. A11 marks a receipt
          "requires manual review ... until resolved" and D6 assumes a receipt can be edited
          after the fact, but nothing in the product can currently change a stored receipt:
          there is no PATCH endpoint and the button has no handler. Groomed late because F6.5
          was written assuming this capability rather than building it.
        demo: >
          Open a stored receipt whose total the parser misread, correct it from the detail
          dialog, and see the list row and the receipt itself both show the new figure.

  # F3.7 "Upload step 2 — what we read" was retired here. Its screen is now built by the
  # features whose extraction it displays: F3.1 puts it on screen, F3.2, F3.3, F3.4 and F3.6
  # each extend it as they land. Keeping it would have left five extraction features with
  # nothing to look at until the end of the epic. Issue #70 was closed by hand. Key retired.

  - key: E4
    title: Multi-Photo Position Matching
    br: [BR-2]
    phase: 1
    scope: diploma
    groomed: true
    summary: >
      Recognising that a line item appearing on two overlapping photos of one long receipt is
      the same purchase, so it is counted once — while never collapsing genuinely repeated
      purchases made on different receipts. Covers BRD B1 through B9.
    features:
      - key: F4.1
        title: Independent per-photo extraction for comparison
        labels: [ai, backend, frontend]
        requirements: [B1]
        depends_on: [F3.1]
        intent: >
          Each photo is parsed on its own before any comparison, so a match decision is never
          an artefact of parsing the two images together. Step 2 of the wizard gains the
          per-photo provenance that makes this visible: which frame each line came from.
        demo: >
          Photograph one long receipt in two overlapping frames and see, on step 2, each item
          attributed to the frame it was read from.
        tasks:
          - key: F4.1.1
            title: Parse photos independently in _run_extraction
            labels: [backend]
            detail: >
              Modify process_upload_job_task to parse each image sequentially/independently rather than in one batch array to Claude. Add file_id tracking per line item.
          - key: F4.1.2
            title: Expose per-photo provenance in frontend Step 2
            labels: [frontend]
            detail: >
              Update frontend receipt wizard step 2 to show which frame each line item came from (tagging line items with their source image).
      - key: F4.2
        title: Position comparison rules
        labels: [backend, frontend]
        requirements: [B2, B3, B4]
        depends_on: [F4.1]
        intent: >
          Item name, unit price, quantity and total price must all match exactly for a pair to
          be "same position"; any difference makes it "different position". Ships with the
          conflict card that shows the comparison field by field, so the verdict is legible
          rather than asserted.
        demo: >
          Upload the overlapping pair and read the evidence table for a matched item — all
          four fields ticked — and for a near-match where one price differs.
        tasks:
          - key: F4.2.1
            title: Implement position comparison logic
            labels: [backend]
            detail: >
              Compare extracted items on exact match of name, unit price, quantity, and total. Yield matches or mismatches.
          - key: F4.2.2
            title: Build conflict card UI
            labels: [frontend]
            detail: >
              Show the conflict card field by field comparison as specified in design.
      - key: F4.3
        title: Same-receipt scoping guard
        labels: [backend, frontend]
        requirements: [B5, B9]
        depends_on: [F4.2]
        intent: >
          Comparison runs only between photos of one physical receipt. Identical items on two
          distinct transactions are two purchases, never a duplicate — this is the requirement
          most likely to be violated by a naive deduplication implementation.
        demo: >
          Upload two separate receipts a week apart that each contain "Milk 2% 1L" at 4.50 and
          confirm both purchases survive, with no match offered between them.
        tasks:
          - key: F4.3.1
            title: Restrict position match to single receipt
            labels: [backend]
            detail: >
              Ensure the comparison only runs across photos that belong to the same physical receipt group, and never across separate receipts.
      - key: F4.4
        title: Comparison failure handling
        labels: [backend, frontend]
        requirements: [B6]
        depends_on: [F4.2]
        intent: >
          If either photo failed to parse, return "comparison not possible" with the reason
          instead of guessing — and say so where the comparison would have been.
        demo: >
          Upload one clear frame and one unreadable one; the pair reports that it could not be
          compared and why, per the "Comparison not possible" panel in
          docs/design/screens/states.html.
        tasks:
          - key: F4.4.1
            title: Handle parse failures during comparison
            labels: [backend, frontend]
            detail: >
              Return "comparison not possible" when a photo fails to parse, and render the corresponding failure panel on the frontend.
      - key: F4.5
        title: Manual override and correction capture
        labels: [backend, database, frontend]
        requirements: [B7, B8]
        depends_on: [F4.2]
        intent: >
          A user can overturn any automatic determination, and the correction is stored as
          labelled data for future evaluation and tuning. Ships with the same-item / two-items
          control and the settled-with-undo state on the conflict card.
        demo: >
          Flip a "same item" verdict to two items, see the receipt total change accordingly,
          and undo it.
        tasks:
          - key: F4.5.1
            title: Manual override endpoints and DB storage
            labels: [backend, database]
            detail: >
              Provide API to flip "same item" decisions. Store correction as labelled data.
          - key: F4.5.2
            title: Implement manual override UI controls
            labels: [frontend]
            detail: >
              Implement the same-item / two-items control and settled-with-undo state on the conflict card.
      - key: F4.6
        title: Deduplicated receipt assembly
        labels: [backend, frontend]
        requirements: [B3]
        depends_on: [F4.2]
        intent: >
          Merge the per-photo extractions of one receipt into a single item list where matched
          positions appear exactly once, and reconcile the result against the printed total.
        demo: >
          After resolving the overlap, step 2 shows one item list for the receipt with the
          duplicate collapsed, and its footer agrees with the printed total.
        tasks:
          - key: F4.6.1
            title: Assemble deduplicated receipt item list
            labels: [backend, frontend]
            detail: >
              Merge per-photo extractions into a single item list where matched positions appear once, updating totals on backend and displaying cleanly on step 2.
      - key: F4.7
        title: Upload step 3 — the resolve gate
        labels: [backend, frontend]
        requirements: [B7]
        depends_on: [F4.5, F3.4, F3.6, F1.2, F9.4]
        intent: >
          The third step of the wizard, and the endpoint behind it: a batch of decisions is
          applied together and the receipts are committed only once none are outstanding. One
          queue for everything needing a human across the whole batch — a position caught in
          two frames, a field below the confidence threshold, a receipt matching one already
          stored, a missing total — with a counter, and nothing written while any of it is
          open. Decisions the agent made alone appear settled and reversible in the same queue
          rather than hidden. Kept as its own feature because it composes flags raised by four
          features across two epics; the individual verdicts and evidence are theirs. Screen
          at docs/design/screens/upload-3-resolve.html.
        demo: >
          Upload a batch that raises several kinds of conflict at once, watch "Store receipts"
          stay disabled while the counter is above zero, settle them one by one, and only then
          commit the batch.
        tasks:
          - key: F4.7.1
            title: Resolve gate API
            labels: [backend]
            detail: >
              Create a central queue endpoint for outstanding decisions and block saving the batch until all are settled.
          - key: F4.7.2
            title: Step 3 UI implementation
            labels: [frontend]
            detail: >
              Implement the third step of the wizard showing the queue and disabling "Store receipts" until empty.

      - key: F4.8
        title: Receipt list search and filtering
        labels: [backend, frontend, database]
        requirements: []
        depends_on: [F3.8]
        intent: >
          Filter the receipt list by processing status, by a specific date, month, or a
          custom date range (including past dates), and search by merchant or item name.
          Brings the UI elements in the receipts.html header to life.
        demo: >
          Open Receipts, filter by a past month and see only those receipts. Search for
          a specific merchant and confirm the list restricts to matching receipts.
        tasks:
          - key: F4.8.1
            title: API and database filtering logic
            labels: [backend, database]
            detail: >
              Add query parameters for date, status, and search to the list_receipts endpoint
              and implement the SQLAlchemy query logic in ReceiptRepository.
          - key: F4.8.2
            title: Frontend store and filter controls
            labels: [frontend]
            detail: >
              Implement date, status, and search input controls. Connect them to the receipt
              store to trigger API re-fetches when changed.

  - key: E5
    title: Spend Categorization
    br: [BR-3]
    phase: 1
    scope: diploma
    groomed: false
    summary: >
      Classifying every line item into a spending category, with a confidence-gated fallback,
      user correction that the system learns from, and user-defined categories. Covers BRD C1
      through C7.
    features:
      - key: F5.1
        title: Default category taxonomy
        labels: [database, backend, frontend]
        requirements: [C1, C2]
        depends_on: [F3.5, F9.4]
        intent: >
          Seeded default categories (Groceries, Dining, Transport, Utilities, Health,
          Entertainment, Other) plus a guaranteed Uncategorized fallback, modelled so custom
          user categories coexist with defaults. Ships with the read-only taxonomy screen that
          F5.6 later makes editable, so the seeded set is inspectable the day it lands.
        demo: >
          Open Categories and read the built-in list with the item count and total behind each,
          per the "Built in" section of docs/design/screens/categories.html.
      - key: F5.2
        title: Automatic item categorization
        labels: [ai, backend, frontend]
        requirements: [C1]
        depends_on: [F5.1]
        intent: >
          Each parsed line item receives a category and a recorded confidence score, shown
          against the item wherever line items are displayed.
        demo: >
          Upload a grocery receipt and find each line carrying a category chip on step 2 of
          the wizard and in the receipt detail dialog.
      - key: F5.3
        title: Confidence threshold, Uncategorized fallback and the review queue
        labels: [ai, backend, frontend]
        requirements: [C2, C3]
        depends_on: [F5.2]
        intent: >
          Below-threshold classifications become Uncategorized and are flagged for review
          rather than guessed at — with the queue that collects them, oldest first. Screen at
          docs/design/screens/categorisation.html.
        demo: >
          Upload a receipt with an obscure item name and find it waiting in the review queue
          marked Uncategorized, rather than filed under a confident guess.
        tasks:
          - implement backend categorization fallback: check confidence against threshold and assign Uncategorized.
          - create backend repository method `list_uncategorized_items` sorting by date.
          - add API endpoint `GET /receipts/line-items/review` to expose the review queue.
          - implement frontend MobX `CategoriesStore` queue fetching.
          - create frontend `CategorisationQueuePage.tsx` mimicking the design.
          - map frontend router to `/categories` and move existing taxonomy to `/categories/manage`.
      - key: F5.4
        title: Manual category reassignment
        labels: [backend, frontend]
        requirements: [C4]
        depends_on: [F5.3]
        intent: >
          Any line item's category can be changed by its owner, and the override is recorded
          as manual so later automatic passes do not overwrite it. Adds the inline picker to
          the queue and to every other place a line item is shown.
        demo: >
          Reassign an item from the queue, then re-run categorisation and confirm your choice
          survives — the override is respected, not overwritten.
      - key: F5.5
        title: Learning from corrections
        labels: [ai, backend]
        requirements: [C5]
        depends_on: [F5.4]
        intent: >
          A correction creates a rule applying to future items with the same or highly similar
          name from the same merchant, which requires a defined similarity measure and a
          precedence order against automatic classification.
        demo: >
          No screen of its own — it is proven through F5.4's. Reassign "Protein Bar XL" from
          Fresh Market to Health with "apply to future items" ticked, upload another Fresh
          Market receipt containing it, and find it already filed under Health.
      - key: F5.6
        title: User-defined custom categories
        labels: [backend, frontend]
        requirements: [C6, C7]
        depends_on: [F5.1, F5.4]
        intent: >
          Users can create their own categories, immediately available for both manual and
          automatic assignment, including the behaviour when a category in use is renamed or
          deleted. Makes F5.1's taxonomy screen editable.
        demo: >
          Create "Pet Supplies", file items under it, then delete it and choose where those
          items land — per the delete dialog in docs/design/screens/categories.html.
        tasks:
          - custom categories - create, rename, delete with a "move items to" choice (C6, C7).
          - >
            unplanned, added during F5.6 at the owner's request - pagination and a purchase-date
            filter on the categorisation screen's views (/categories), which returned every item
            in one response. Shares DateRangeFilter and Pagination with the receipts list.

      - key: F5.8
        title: Seed script for local sample data
        labels: [infra, database]
        depends_on: [F1.1, F3.5, F5.1]
        intent: >
          A demo user with a handful of categorised receipts spanning two months, plus the
          `seed` task-runner target that invokes it — enough to exercise the monthly-budget
          and statistics epics without uploading photos. Lands here, at the end of E5, because
          this is the first point where every entity it writes exists: User (F1.1), receipt and
          line items (F3.5) and categories (F5.1). It was originally planned in E0's local
          development environment, where none of those had been built yet.
        demo: >
          Run `seed`, sign in as the demo user, and find two months of categorised receipts
          already there — which is what makes E6 and E7 workable without photographing
          anything.
        tasks:
          - >
            the demo data is exported from real uploads (`make seed-export EMAIL=...`), not
            invented: 22 receipts with their categories, including a custom category and a
            receipt under manual review (D3). Dates shift by whole months on load, so the
            newest receipt always falls in the current month.
          - >
            `make seed` recreates demo@budget-agent.local idempotently, with a PLN budget
            limit to measure the months against.
          - >
            unplanned, added at the owner's request - toasts get an opaque background (the
            header showed through) and the success toast its missing colours.

  # F5.7 "Categorization review interface" was retired here. The review queue now lands with
  # F5.3, which is the feature that flags items into it, and inline editing with F5.4, which
  # is the feature that changes them. Neither is worth building without the other half.
  # Issue #86 was closed by hand. The key is retired.

  - key: E6
    title: Monthly Budget Calculation
    br: [BR-4]
    phase: 1
    scope: diploma
    groomed: false
    summary: >
      Aggregating receipts into monthly totals by transaction date, distinguishing a
      month-to-date figure from a finalised one, excluding flagged receipts transparently, and
      recalculating when history changes. Covers BRD D1 through D7.
    features:
      - key: F6.1
        title: Monthly aggregation engine, and the month view
        labels: [backend, database, frontend]
        requirements: [D1, D2]
        depends_on: [F3.5, F9.4]
        intent: >
          Sum line-item totals across all receipts whose transaction date — not upload date —
          falls in the month, which makes back-dated uploads behave correctly. Ships with the
          figure on screen and the month switcher beside it — the first slice of
          docs/design/screens/dashboard.html.
        demo: >
          Seed two months (F5.8), open the root route and read this month's total, then step
          back a month. Upload a receipt dated last month and watch it land in last month's
          figure rather than this one.
        tasks:
          - >
            ADR-0009 - calendar months; a receipt belongs to the month printed on it (its stored
            transaction date, the shop's wall clock, unconverted); the current month is the
            browser's.
          - >
            GET /api/v1/budget/months/{year}/{month} - the sum of line-item totals of parsed
            receipts dated in the month, the receipt count, and whether the user has any
            receipts at all (D1, D2). Cross-user isolated (N2).
          - >
            the month view at / once a receipt exists - month switcher that stops at the
            current month, and the month's figure; the welcome screen stays for a user with
            none. Limit, month-to-date label, excluded-receipts notice and breakdown are
            F6.6, F6.3, F6.2 and F6.7.
          - >
            unplanned, added at the owner's request - the categorisation screen (/categories)
            gains a category filter and totals. A "Where it went" list shows each category's
            spend for the current filters and picks the category; the list footer totals the
            whole selection. Counted like the month total, so items on receipts under review
            are listed and marked but held out, and their count and value are stated.
      - key: F6.2
        title: Transparent exclusion of receipts under review
        labels: [backend, frontend]
        requirements: [D3]
        depends_on: [F6.1, F3.4]
        intent: >
          Receipts marked "requires manual review" are excluded from the total, and the summary
          states how many were excluded and their value, so the number is never quietly wrong.
        demo: >
          With a flagged receipt in the month, the month view carries the notice naming how
          many receipts and how much money sit outside the total, with a way through to fix
          them.
        tasks:
          - >
            the month summary reports receipts under manual review - count and the value of
            their lines - placed by purchase date, or upload date when none was read (D3).
          - >
            the dashboard notice names them and leads to /receipts?status=manual_review,
            which opens the receipts list already filtered to them.
          - >
            unplanned, added at the owner's request - "OPUST" discount lines fold into the
            product above them at upload (domain model 5a), so no negative line reaches a
            category; the wizard shows the discount beside the product. Existing local data
            was recalculated by hand, with no migration or script.
      - key: F6.3
        title: Month-to-date versus finalised presentation
        labels: [backend, frontend]
        requirements: [D4]
        depends_on: [F6.1]
        intent: >
          An in-progress month is labelled incomplete wherever it appears, so a partial figure
          is never mistaken for a full one.
        demo: >
          The current month reads "month-to-date, still running" with the days elapsed; step
          back to a finished month and the label changes to finalised.
        tasks:
          - >
            BudgetMonth.progress(today) - complete once the user's today is past the month's
            last day; otherwise the days elapsed of the month's days (D4).
          - >
            the month summary takes the browser's `today` (ADR-0009) and returns is_complete,
            days_elapsed and days_in_month.
          - >
            the dashboard labels the month "Month-to-date · still running" or "Finalised ·
            complete month" beside the switcher, with "N of M days recorded" under the figure,
            per docs/design/screens/dashboard.html and dashboard-dark.html.
          - >
            found on the way - the dark theme's --tone-neutral-bg equalled the surface colour,
            so every neutral pill (the finalised one included) was invisible; it is now the
            translucent tint dashboard-dark.html draws.
      - key: F6.4
        title: Monthly snapshot generation
        labels: [backend, database]
        requirements: [D5]
        depends_on: [F6.3]
        intent: >
          When a month completes, persist a finalised snapshot (the MonthlySnapshot entity),
          including how the transition is triggered across user time zones.
        demo: >
          No screen of its own — proven through F6.3's label. Roll the clock past a month
          boundary and watch that month switch from month-to-date to finalised and stop
          changing, which only a persisted snapshot makes true.
        tasks:
          - >
            ADR-0010 - the snapshot is taken on the first look at a month that is over by
            the user's clock (no scheduler, no stored timezone), and only once the month has
            ended in UTC+14, so a clock running ahead cannot freeze a running month.
          - >
            monthly_snapshots (one per user and month) and MonthlySnapshotRepository; the
            month summary reads a finished month from it and reports finalised_at.
          - >
            decided with the owner to land D6's backend here rather than in F6.5 - a
            before_flush hook drops the snapshot of every month a receipt or line change
            touches, and receipt deletion now goes through the ORM so the hook sees it.
            F6.5 is left with showing the change on screen without a reload.
      - key: F6.5
        title: Recalculation on receipt change
        labels: [backend, frontend]
        requirements: [D6, N3]
        depends_on: [F6.4]
        intent: >
          Adding, editing or deleting a receipt in a closed month recalculates and updates the
          stored snapshot, with the recalculation reflected in the same session.
        demo: >
          Edit the total of a receipt in a finalised month from the receipt detail dialog and
          watch that month's figure move without a reload.
        tasks:
          - >
            ReceiptStore and UploadStore take an "a receipt changed" callback that RootStore
            points at BudgetStore.refresh(), so a correction, deletion or upload refetches
            the month on screen; the toast names each finished month it recalculated.
          - >
            the dashboard reopens on the month it was left on rather than always on the
            current one, and forgets it when a different user signs in.
          - >
            unplanned, added at the owner's request - the two columns under the figure in
            docs/design/screens/dashboard.html, taken from F6.7 so the receipt dialog opens
            on the dashboard itself and the demo above is literal. "Where it went" reuses
            CategorySpendList over the line-items endpoint, a row opening that category's
            items for the month on the categories screen. The receipts column lists six
            from the receipts endpoint: the newest of a running month, the biggest of a
            finished one as dashboard-dark.html shows (order=largest), with "All N" opening
            the receipts list narrowed to the month; phones omit it, as the mobile design
            does.
          - >
            unplanned, added at the owner's request - correcting a receipt no longer resets
            its time of purchase to midnight, and purchase times are shown in UTC, as
            printed, instead of shifted into the browser's timezone (ADR-0009).
          - >
            the receipts list's date filter places an undated receipt by its upload date,
            as the month total does, so a month's list and figure agree.
          - >
            BR-4's D6 scenario runs against the real database, through the flush hook.
      - key: F6.6
        title: Budget limit and percentage of target
        labels: [backend, frontend]
        requirements: [D7]
        depends_on: [F6.1, F1.4]
        intent: >
          Where a monthly limit is set, express current spend as a percentage of it, including
          the over-100% case.
        demo: >
          Set a limit in Preferences and watch the progress bar and percentage appear on the
          month view; push spend past the limit and confirm it reads over-100% in error tone
          rather than clamping at full, per docs/design/screens/dashboard-dark.html.
        tasks:
          - >
            limit_usage in the budget domain - the share of the limit spent, rounded down and
            uncapped, and what is left (negative when over); the month summary carries
            budget_limit, limit_percent and limit_remaining, null when no limit is set. The
            limit is read as it stands now for every month, never stored in a snapshot, as
            profile.html promises that changing it rewrites no finalised month.
          - >
            the dashboard's figure card shows the share, what is left or how far over, and a
            shared Meter bar - full, in the error tone and notched where the limit sat once
            spend passes it.
          - >
            the profile refuses a limit of zero or less (422): spend is shown as a share of
            it, so such a value is not a limit; the input's minimum says so too.
          - >
            BR-4's D7 scenario runs; with it every BR-4 scenario does, so the module's skip
            list is gone.
      - key: F6.7
        title: Budget dashboard — composing the landing view
        labels: [backend, frontend]
        requirements: [D1, D4, D7]
        depends_on: [F6.6, F5.2, F3.8]
        intent: >
          What turns F6.1's month figure into the landing view: the category breakdown beside
          it and the latest-receipts column next to that, each opening into the screens that
          own them. Both are already on screen from F6.5, fetched as three requests over the
          existing endpoints. Kept as its own feature because it composes three epics'
          data — E6's totals, E5's categories, E3's receipts — and needs the endpoint that
          returns them
          together rather than three round trips. The figure, the limit bar, the excluded
          notice and month switching are already there from F6.1, F6.2, F6.3 and F6.6; this
          finishes docs/design/screens/dashboard.html rather than starting it.
        demo: >
          Open the root route on a seeded account: spend, limit, breakdown and recent receipts
          on one screen. Click a receipt to open its dialog, click through to full statistics.
        tasks:
          - >
            one round trip - GET /api/v1/budget/months/{year}/{month}/dashboard returns the
            month's summary, its spend by category and its receipts column, composed by
            DashboardService from BudgetService and the receipts repository over one set of
            month bounds; the server picks newest or biggest receipts by whether the month
            is over. BudgetStore makes that one request instead of F6.5's three.
          - >
            "Full statistics" beside the month switcher, and "All" on the phone's "Where it
            went", lead to /statistics, still a placeholder until E7.
          - >
            the phone's dashboard per docs/design/screens/dashboard-mobile.html - the month
            centred between bordered 44px arrows with a short status beneath, the shorter
            figure card with the limit bar above its figures, the held-out receipts as one
            tappable line, and the top five categories without bars.
          - >
            unplanned, added at the owner's request - the phone's app shell from the same
            screen: the header keeps only the brand, theme and account, and a bottom bar
            carries Home, Receipts, a round upload button, Stats and Goals. Categories is
            reached from Receipts, whose tab it lights, as docs/design/README.md proposed;
            the upload flow goes without the bar, as upload-mobile.html does.
          - >
            unplanned, added at the owner's request - the rest of the app on a phone. Receipts
            lists receipts as cards; Receipts and Categories (queue and taxonomy) open with a
            "Receipts | Categories" switch so Categories is plain to see under the Receipts
            tab; the queue's view switch fits the width with short labels. The shared Modal
            stays centred but takes nearly the full width on a phone, so the receipt, edit
            and fix-extraction dialogs stack their line items instead of squeezing columns.
            Preferences loses its doubled padding and gets full-width fields and buttons. The upload flow
            gets upload-mobile.html's "New receipt" header, a full-width mode switch and
            full-width actions, and loses the doubled side padding; its Cancel now starts
            over.

  - key: E7
    title: Statistics, Comparison & Export
    br: [BR-5]
    phase: 1
    scope: diploma
    groomed: false
    summary: >
      Category-level insight over arbitrary date ranges, period-over-period comparison, honest
      empty states, chart-ready output, and data export. Covers BRD E1 through E6 and N6.
    features:
      - key: F7.1
        title: Category statistics engine, and the ranked breakdown
        labels: [backend, database, frontend]
        requirements: [E1, E4]
        depends_on: [F5.2, F9.4]
        intent: >
          Total spend, share of overall spend and transaction count per category, ranked from
          highest to lowest by default — with the screen that shows the ranking. First slice
          of docs/design/screens/statistics.html.
        demo: >
          Open Statistics on a seeded account and read the table: every category with its
          total, its share and its item count, biggest first.
        tasks:
          - >
            the engine - StatisticsPeriod (whole days, both ends included) and rank_categories
            in app/domain/statistics.py: total, share to one decimal place and item count per
            category, highest spend first, ties by name, no division by zero on a period of
            refunds. StatisticsService feeds it the receipts repository's per-category spend,
            counted like the month total, with items under review named beside it (D3).
          - >
            GET /api/v1/statistics/categories?start=&end= - a period ending before it starts
            is refused with 422 invalid_period. The endpoint already takes any range; F7.2
            adds the presets, the picker and the edge cases on screen.
          - >
            the database part - an expression index on receipts (user_id,
            coalesce(transaction_date, created_at)) and one on line_items.receipt_id: every
            month total, list and statistic filters by exactly that, and neither existed.
          - >
            the Statistics screen at /statistics, replacing the placeholder: this month so
            far, the ranked table with each category leading to its items for the period,
            and the held-out items named above it. On a phone the item count moves under the
            category name. The chart, comparison, empty state and export stay with F7.2-F7.6.
          - >
            BR-5's E1/E4 scenario runs; the other three stay skipped, each naming the
            feature that brings it.
      - key: F7.2
        title: Arbitrary date-range support
        labels: [backend, frontend]
        requirements: [E2]
        depends_on: [F7.1]
        intent: >
          Statistics for any start and end date, not only calendar months, with inclusive
          boundary semantics defined once and applied everywhere. Adds the preset chips and
          the range picker to the screen.
        demo: >
          Ask for 10–24 July specifically and watch the totals narrow to those fifteen days,
          then switch to a preset and back.
        tasks:
          - >
            ADR-0012 - one DateRange (app/domain/periods.py): whole days, both ends included,
            bounded from midnight on the first day to midnight after the last, exclusive, so
            a purchase at 23:59:59.5 stays in its day. The repository filters through one
            _within(period); month totals, the dashboard and statistics all use it, and the
            month total now files an undated receipt by upload date like everything else.
          - >
            every date-filtering endpoint takes start and end as plain dates, parsed once by
            app/api/periods.py - /receipts and /receipts/line-items move off start_date and
            end_date timestamps; a backwards range or a single end is 422 invalid_period.
          - >
            the frontend sends plain dates everywhere (DateRangeFilter, the receipts and
            categorisation stores, the dashboard's links) and never builds a time of day.
          - >
            the Statistics screen's presets - This month (so far), Last month (whole), Last 3
            months (this month so far and the two before) and Custom, which opens the date
            picker; the period button shows the days and opens it too. They fit a phone.
          - >
            BR-5's E2 scenario runs.
          - >
            unplanned, added at the owner's request - a phone-layout guard in frontend CI:
            npm run lint:responsive (frontend/scripts/check-responsive.mjs) fails on a fixed
            width over 200px or pixel grid columns over 200px without a md:/lg: prefix, the
            pattern behind the broken Receipts list, receipt dialog and upload steps; the
            desktop-only table headers now say md:grid-cols to match.
      - key: F7.3
        title: Period-over-period comparison
        labels: [backend, frontend]
        requirements: [E3]
        depends_on: [F7.2]
        intent: >
          Absolute and percentage change per category between two periods, including categories
          present in only one of them and the division-by-zero case. Adds the comparison
          columns and the note that a running month is compared like for like.
        demo: >
          Turn on comparison against the previous period and read the change column — Dining
          up 29.5%, Groceries down 8.6% — with the running month compared against the same
          number of days.
        tasks:
          - >
            DateRange.previous() - like for like: a period from a 1st meets the same days of
            as many months before (1-27 July meets 1-27 June, a month's last day meets the
            other's, a missing day falls back to the month's last); any other period meets
            as many days right before it. stops_mid_month flags the running-month case.
          - >
            compare_categories in the statistics domain - change and change percent per
            category, one decimal place; a new category has no percent instead of dividing by
            zero, and one spent on only before stays listed at zero, down 100%, after the
            ranked ones.
          - >
            GET /api/v1/statistics/categories?compare=true adds previous_total, change and
            change_percent to each row and a comparison block with the previous period.
          - >
            the screen's "Compare with …" switch, the previous-period and Change columns
            (down in the primary tone, up in the error tone, "new", "no change"), and the
            note that a running month is compared against the same days. On a phone the
            change sits under the amount and the previous column is dropped.
          - >
            BR-5's E3 scenario runs.
      - key: F7.4
        title: Empty-period handling
        labels: [backend, frontend]
        requirements: [E5]
        depends_on: [F7.2]
        intent: >
          A range with no receipts returns an explicit "no data" result rather than a
          zero-filled report that reads like real information.
        demo: >
          Pick a period before your first receipt and read "no receipts in that period" —
          not a table of zeroes, per the E5 panel in docs/design/screens/states.html.
        tasks:
          - >
            ReceiptRepository.count_in(period) - receipts of any status filed under the
            period; the statistics response carries it as receipt_count, and with 0 its total
            and item_count are null rather than zeroes. The comparison block does the same
            for the previous period.
          - >
            the Statistics screen shows the E5 panel of docs/design/screens/states.html for an
            empty period ("No receipts in March 2025", "Pick another period" opening the
            picker), says so when the period compared against is empty, and tells a period
            whose receipts all await review apart from an empty one.
          - >
            BR-5's E5 scenario runs; with it every BR-5 scenario does, so the module's skip
            list is gone.
          - >
            unplanned, found while checking the screen at tablet width - the header ran 7px
            past a 768px screen on every page; its Upload button keeps only its icon until
            lg, so every page now fits at 375, 768, 1024 and 1280.
      - key: F7.5
        title: Chart-ready output and the comparison chart
        labels: [backend, frontend]
        requirements: [E6]
        depends_on: [F7.3]
        intent: >
          A response shape the client can render directly, so presentation logic does not
          re-derive aggregates — and the grouped bar chart that consumes it.
        demo: >
          The chart above the table shows both periods side by side per category, and moves
          when the range changes.
        tasks:
          - >
            app/domain/charts.py - nice_scale picks a round axis top and ticks (steps of 1, 2,
            2.5 or 5 times a power of ten); build_chart turns the ranked breakdown, with the
            comparison when there is one, into bar groups whose heights are already a share of
            that scale. Eight categories are drawn, the rest counted and left to the table.
          - >
            GET /api/v1/statistics/categories?chart=true returns that chart; the Statistics
            screen always asks for it.
          - >
            the chart above the table, per the dataviz skill - 24px columns with 4px rounded
            ends from one baseline, recessive gridlines at the server's ticks, a legend for
            the two periods, a hover tooltip, each group described for screen readers, the
            table below as the text view. On a phone, horizontal bars per category.
          - >
            the previous period's grey is muted-foreground, not the design's border-strong:
            the palette validator measured border-strong at 1.45:1 against the surface;
            statistics.html is changed to match (ADR 0004).
          - >
            found while checking the phone - F7.3's change under the amount wrapped over three
            lines; a phone now shows only the percentage, on one line.
      - key: F7.6
        title: Data export
        labels: [backend, frontend]
        requirements: [N6]
        depends_on: [F7.1]
        intent: >
          CSV and JSON export of the user's receipts, line items and statistics, generated
          asynchronously for large histories, reachable from where the numbers are.
        demo: >
          Export from Statistics and from Receipts, and open the file — the figures match what
          the screen showed.
        tasks:
          - >
            ExportJob (export_jobs, migration 1e0496d719c2) - kind, format, the screen's
            filters, status, stored file and error; kinds, formats and statuses kept as text
            so adding one needs no enum migration.
          - >
            app/services/export.py - run_export writes the file in the background with its
            own session and storage client, like receipt processing: receipts page by page
            under the list's filters (CSV one row per item, JSON nested as the list API
            returns), or the statistics for the period (JSON exactly the statistics API's
            answer, CSV its rows, comparison columns when compared). Formula-starting cells
            are written as text. The statistics response mapping moved from the router into
            the service so the endpoint and the export share it.
          - >
            POST /api/v1/exports (202), GET /api/v1/exports/{id} and
            GET /api/v1/exports/{id}/file (409 until ready); another user's export is 404
            (N2); a missing or backwards period is 422 as everywhere.
          - >
            ExportStore follows the job and saves the file; an ExportMenu (CSV or JSON)
            replaces Receipts' placeholder "Export this list" link and sits in the Statistics
            header, each exporting what that screen shows. Full width and 44px on a phone.

  # F7.7 "Statistics and charts interface" was retired here. Its screen is now built up by the
  # features whose numbers it displays — F7.1 puts the ranked table on screen, F7.2 the range
  # picker, F7.3 the comparison, F7.4 the empty state, F7.5 the chart, F7.6 the export action.
  # Nothing was left for a trailing feature to do. Issue #102 was closed by hand. Key retired.

  - key: E8
    title: Goals & AI Optimization Advice
    br: [BR-6]
    phase: 1
    scope: diploma
    groomed: true
    summary: >
      The product's differentiator: a user states a financial or lifestyle goal and receives
      specific, evidence-based, quantified recommendations tied to their own purchase history,
      with proactive warnings and a feedback loop. Covers BRD F1 through F9.
    features:
      - key: F8.1
        title: Goal definition, storage and the goals screen
        labels: [backend, database, frontend]
        requirements: [F1]
        depends_on: [F1.2, F9.4]
        intent: >
          Model both financial goals (savings target, category reduction, overall ceiling) and
          lifestyle goals (lose weight, save for a car) in one schema without collapsing the
          distinction that F9 depends on — and the screen that states them. First slice of
          docs/design/screens/goals.html.
        demo: >
          Set "stay under 3 000 PLN a month" and "lose weight" as goals, see them both on the
          Goals screen, and edit one.
        tasks:
          - key: F8.1.1
            title: Goal database model and migration
            labels: [database, backend]
            detail: >
              Implement the Goal SQLAlchemy model containing type (financial vs lifestyle), target amounts, category references, and text descriptions. Write an Alembic migration to add the goals table with a user_id foreign key, enforcing per-user isolation.
          - key: F8.1.2
            title: Goal API endpoints (CRUD)
            labels: [backend]
            detail: >
              Create GET, POST, PATCH, DELETE /api/v1/goals endpoints. Enforce cross-user isolation so users can only access their own goals. Include cross-user access tests in the suite per F1.3.3.
          - key: F8.1.3
            title: Goals frontend store and API integration
            labels: [frontend]
            detail: >
              Generate the OpenAPI client. Implement GoalsStore using MobX to fetch, create, edit, and delete goals, following the observable-vs-derived conventions.
          - key: F8.1.4
            title: Goals screen UI
            labels: [frontend]
            detail: >
              Build the Goals screen at /goals implementing docs/design/screens/goals.html. Include the "New goal" dialog and the list of active goals as cards with edit actions.

      - key: F8.2
        title: Lifestyle goal to spending mapping
        labels: [ai, backend, frontend]
        requirements: [F9]
        depends_on: [F8.1, F5.1]
        intent: >
          Translate a non-financial goal into the relevant categories and recurring items
          before any advice is generated, since the rest of the pipeline reasons over spend.
          The goal card shows what it decided to watch, and lets you correct it.
        demo: >
          The "lose weight" card lists the spending lines it maps to — sweets, snacks, sugary
          drinks, alcohol — and you can adjust that list rather than guess at it.
        tasks:
          - key: F8.2.1
            title: Goal mapping AI port and prompt
            labels: [ai, backend]
            detail: >
              Create a prompt and Claude API adapter that translates a lifestyle goal text into a list of spending categories and matching keywords/items.
          - key: F8.2.2
            title: Map goals on creation/update
            labels: [backend]
            detail: >
              Call the mapping port when a lifestyle goal is created or updated, and save the mapped categories/items to the database as part of the goal record.
          - key: F8.2.3
            title: Display and edit goal mappings in UI
            labels: [frontend]
            detail: >
              Update the goal card to show the spending lines it maps to. Allow the user to edit the mapped categories and items.

      - key: F8.3
        title: Spend analysis for advice
        labels: [backend]
        requirements: [F2]
        depends_on: [F8.2, F7.1]
        intent: >
          Identify highest-spend categories, largest recent increases, and recurring positions
          most relevant to the stated goal — the evidence every recommendation must cite.
        demo: >
          No screen of its own — it is the input F8.4 cites. Proven when a recommendation
          names "9 of your 14 Fresh Market receipts", a claim only this analysis can supply.
        tasks:
          - key: F8.3.1
            title: Statistics extraction for goal analysis
            labels: [backend]
            detail: >
              Create a service that collects relevant category totals, recent increases (period over period), and frequent line items matching a goal's targets.
          - key: F8.3.2
            title: Context builder for advice generation
            labels: [backend]
            detail: >
              Format the extracted historical data into a structured prompt context to be fed into the advice generation AI.

      - key: F8.4
        title: Recommendation generation and the advice feed
        labels: [ai, backend, frontend]
        requirements: [F3]
        depends_on: [F8.3]
        intent: >
          Produce specific, actionable recommendations naming a category or an individual
          recurring item. Constraint 11.3 rules out generic financial tips, so genericness is
          a defect to be tested for, not a style preference. Ships with the advice feed that
          carries them.
        demo: >
          Ask for advice on a seeded account and read a recommendation naming an actual item
          you actually buy — not "consider reducing discretionary spending".
        tasks:
          - key: F8.4.1
            title: Advice generation prompt and AI port
            labels: [ai, backend]
            detail: >
              Write a prompt enforcing non-generic, specific recommendations based on the spend analysis context. Implement the AI adapter to call Claude.
          - key: F8.4.2
            title: Recommendation endpoints
            labels: [backend]
            detail: >
              Add an endpoint to trigger advice generation for a goal and another to list generated recommendations. Store generated recommendations in the database.
          - key: F8.4.3
            title: Advice feed UI
            labels: [frontend]
            detail: >
              Build the advice feed section below goals in docs/design/screens/goals.html to display the generated recommendations.

      - key: F8.5
        title: Projected impact quantification
        labels: [backend, frontend]
        requirements: [F4]
        depends_on: [F8.4]
        intent: >
          Every recommendation states its expected effect on the goal, computed from the
          user's actual history rather than asserted by the model.
        demo: >
          Each advice card carries its figure — "−61.20 PLN a month", "−64% of sweet
          purchases" — and the arithmetic can be checked against the receipts behind it.
        tasks:
          - key: F8.5.1
            title: Compute projected impact mathematically
            labels: [backend]
            detail: >
              Ensure the backend calculates projected impact strictly from historical data rather than trusting AI hallucinated numbers, and includes this in the recommendation payload.
          - key: F8.5.2
            title: Display impact figures on advice cards
            labels: [frontend]
            detail: >
              Render the calculated impact values on the recommendation cards in the advice feed.

      - key: F8.6
        title: Insufficient-data guard
        labels: [backend, frontend]
        requirements: [F5]
        depends_on: [F8.4]
        intent: >
          Below a configured minimum of history, say more data is needed instead of emitting a
          low-confidence recommendation.
        demo: >
          Ask for advice on a fresh account with three receipts and read that more history is
          needed, per the F5 panel in docs/design/screens/states.html — no invented advice.
        tasks:
          - key: F8.6.1
            title: Enforce minimum data threshold in advice generation
            labels: [backend]
            detail: >
              Check if the user has sufficient history (e.g., minimum number of receipts or months) before generating advice. Return an explicit insufficient-data status if not.
          - key: F8.6.2
            title: Insufficient data UI state
            labels: [frontend]
            detail: >
              Show the "more history needed" state panel (F5 panel from states.html) when the backend indicates insufficient data.

      - key: F8.7
        title: On-track progress reporting
        labels: [backend, frontend]
        requirements: [F6]
        depends_on: [F8.4, F6.6]
        intent: >
          When pace meets the goal, report positive progress and explicitly suppress
          unnecessary cuts.
        demo: >
          With spend on pace to finish under the ceiling, the feed leads with "nothing to cut
          this month" and the projected finish, and offers no savings advice for that goal.
        tasks:
          - key: F8.7.1
            title: Detect on-track status during generation
            labels: [backend]
            detail: >
              Evaluate the spending pace against the goal before generating advice. If on pace, skip generating cuts and output an "on track" message.
          - key: F8.7.2
            title: Render on-track status in UI
            labels: [frontend]
            detail: >
              Display the positive progress card ("nothing to cut this month") when the user is on track, suppressing normal advice cards.

      - key: F8.8
        title: Proactive at-risk warnings
        labels: [backend, frontend]
        requirements: [F7]
        depends_on: [F8.7]
        intent: >
          Detect mid-month that projected spend will miss the goal and surface a warning with at
          least one corrective recommendation before the month ends — this requires scheduled
          evaluation and a delivery channel, not just a request handler.
        demo: >
          Push mid-month spend onto a pace that overshoots the ceiling and find the warning
          waiting without having asked for it, with at least one way to correct course.
        tasks:
          - key: F8.8.1
            title: Background task for proactive evaluation
            labels: [backend]
            detail: >
              Implement a scheduled background job to evaluate goals mid-month and generate at-risk warnings if projected spend overshoots.
          - key: F8.8.2
            title: Display at-risk warnings in dashboard and goals
            labels: [frontend]
            detail: >
              Fetch and prominently display proactive warnings in the dashboard and goals screens.

      - key: F8.9
        title: Recommendation feedback loop
        labels: [backend, ai, frontend]
        requirements: [F8]
        depends_on: [F8.4]
        intent: >
          Capture "not followed" and "not helpful" feedback and deprioritise similar
          recommendations in later generations, through controls on the advice itself.
        demo: >
          Mark a Dining recommendation "not for me", ask for advice again, and find similar
          Dining suggestions demoted and the dismissed one shown as such with an undo.
        tasks:
          - key: F8.9.1
            title: Recommendation feedback endpoints
            labels: [backend]
            detail: >
              Add endpoints to submit feedback (not helpful, not followed) for a recommendation and save it to the DB.
          - key: F8.9.2
            title: Feed feedback into advice context
            labels: [ai, backend]
            detail: >
              Include dismissed/unhelpful recommendation history in the prompt context to ensure Claude avoids suggesting similar cuts.
          - key: F8.9.3
            title: Feedback UI controls
            labels: [frontend]
            detail: >
              Add feedback action buttons to advice cards and handle the UI state (e.g. graying out dismissed cards with an undo option).

  # F8.10 "Goals and advice interface" was retired here. It was the worst case of the pattern:
  # nine features would have shipped before anything about goals could be seen at all. The
  # screen is now built up by the features it belongs to — F8.1 the goal cards, F8.2 the
  # mapped spending lines, F8.4 the advice feed, F8.5 the impact figures, F8.6 the
  # insufficient-data state, F8.7 the on-track card, F8.9 the feedback controls.
  # Issue #113 was closed by hand. The key is retired.

  - key: E9
    title: Web Client Foundation
    br: []
    phase: 1
    scope: diploma
    groomed: true
    summary: >
      The React and MobX groundwork every feature screen builds on. Deliberately separated so
      that state, API access and layout conventions are decided once rather than reinvented in
      each feature epic. Scope rule: only what has no domain dependency belongs here. Screens
      for a capability ship inside that capability's own epic — this epic is the shared floor
      they stand on, not "the frontend half" of the product. Built before E1 despite its
      number, because nothing in it waits on an endpoint; see `depends_on` for the real order.
    features:
      - key: F9.1
        title: React, Vite and TypeScript project setup
        labels: [frontend, infra]
        intent: >
          Strict TypeScript, path aliases, ESLint and Prettier matching the backend's rigour,
          and Vitest with React Testing Library.
        tasks:
          - key: F9.1.1
            title: Scaffold the Vite + React + TypeScript project
            labels: [frontend, infra]
            detail: >
              Vite's react-ts template under frontend/, strict TypeScript (mirrors the
              backend's mypy --strict) with no implicit any, and a `@/` path alias resolved
              consistently in both tsconfig.json and vite.config.ts.
          - key: F9.1.2
            title: ESLint and Prettier matching backend lint rigour
            labels: [frontend, infra]
            detail: >
              Flat ESLint config with typescript-eslint strict rules, react-hooks, and
              jsx-a11y (enforces the semantic-HTML convention below). Prettier for formatting.
              Both wired into the repository's pre-commit alongside ruff and mypy.
          - key: F9.1.3
            title: Vitest and React Testing Library harness
            labels: [frontend, testing]
            detail: >
              Vitest with the jsdom environment, RTL plus jest-dom matchers, and a `test`
              script. A smoke test rendering App proves the harness runs in CI (F0.5).
          - key: F9.1.4
            title: Establish the src/ folder structure
            labels: [frontend]
            detail: >
              src/pages, src/components (feature-scoped), src/shared/components,
              src/shared/styles, src/stores, src/api and src/routes, documented in
              frontend/README.md with the rule for shared/ versus feature-local: a component
              or style used by more than one feature, with no feature-specific business logic,
              belongs in shared/.

      - key: F9.2
        title: MobX store architecture and conventions
        labels: [frontend]
        intent: >
          Root store composition, dependency injection into components, the rule for what is
          observable versus derived, and async action conventions. Written down as a short
          guide, because this is the decision later epics will otherwise each make differently.
        tasks:
          - key: F9.2.1
            title: Root store composition and context injection
            labels: [frontend]
            detail: >
              A single RootStore instantiated once and provided through a React context with a
              useStores() hook. No component or feature store reaches for another store via a
              direct import — DIP applies to frontend state the same way it applies to the
              backend's ports.
          - key: F9.2.2
            title: Observable-vs-derived and async-action conventions
            labels: [frontend]
            detail: >
              Document when a field is `observable` versus a computed `get`, and the
              idle/loading/success/error status-flag shape every async action follows, so a
              reader recognises the pattern in any store without re-deriving it.
          - key: F9.2.3
            title: ThemeStore for light/dark mode
            labels: [frontend]
            detail: >
              Persists the theme preference to localStorage, defaults to the OS
              prefers-color-scheme, and toggles the `.dark` class the color tokens (F9.6) key
              off — same responsibility as budget-checker's ThemeStore.

      - key: F9.3
        title: Generated API client from OpenAPI
        labels: [frontend, infra]
        intent: >
          TypeScript types and client generated from the FastAPI schema in CI, so a backend
          contract change breaks the frontend build rather than production.
        tasks:
          - key: F9.3.1
            title: Backend OpenAPI schema export script
            labels: [backend, infra]
            detail: >
              backend/scripts/export_openapi_schema.py imports create_app() and writes
              app.openapi() as JSON to stdout. Schema generation is pure route/model
              introspection — no environment variables and no database connection required —
              so it runs the same way locally and in CI. The single source both the frontend
              codegen and the CI drift check read from.
          - key: F9.3.2
            title: Generated types and typed client wired into npm scripts
            labels: [frontend, infra]
            detail: >
              openapi-typescript generates frontend/src/api/schema.ts (checked in, not
              hand-edited) from the backend's exported schema via `npm run generate:api`.
              openapi-fetch provides the runtime client in frontend/src/api/client.ts, typed
              against those generated paths, with its base URL read from the
              VITE_API_BASE_URL env var. This is the only module a store may import to reach
              the backend — see the frontend/backend boundary rule in
              docs/architecture/overview.md.
          - key: F9.3.3
            title: CI check that the checked-in client matches the current schema
            labels: [frontend, infra]
            detail: >
              frontend-ci.yml also triggers on backend/app/** changes and regenerates
              src/api/schema.ts before the build, failing the job (git diff --exit-code) if
              the regenerated file differs from what's committed. A backend contract change
              with no matching frontend regeneration fails CI instead of surfacing as a
              runtime mismatch in production.
      - key: F9.4
        title: Application shell and navigation
        labels: [frontend]
        depends_on: [F9.1, F9.6]
        intent: >
          The static frame every screen renders inside, plus something to see at the root
          before an account exists. Deliberately excludes the authenticated route table, the
          guard and the expiry redirect — those need F1's session model and ship with it in
          F1.2.6. What remains has no domain dependency, so it lands before any endpoint does
          and gives E1's screens a frame to arrive into.
        demo: >
          Open the root route signed out and land on a real screen with working links to sign
          in and register, inside the shell every later screen will use.
        tasks:
          - key: F9.4.1
            title: Application shell — header, navigation and content container
            labels: [frontend]
            detail: >
              The frame every screen renders inside: header with the brand and theme toggle,
              the navigation row, and the responsive content container. Anatomy and spacing
              come from docs/design/components.md, colours from the tokens in F9.6.1. No
              global footer — login and register carry a one-line privacy strip and no other
              screen has one, so there is nothing to share yet.
          - key: F9.4.2
            title: Public landing screen at the root route
            labels: [frontend]
            detail: >
              What an unauthenticated visitor sees at /: the brand header, one sentence on
              what the product does, and two actions — sign in, create an account.
              Deliberately minimal; the BRD asks for no marketing page, and this exists so
              the root is not blank and the shell has a real screen to prove itself against.
              Once a session exists the same route belongs to F1.1.7.
          - key: F9.4.3
            title: Router with the public route table
            labels: [frontend]
            detail: >
              react-router mounted with the public routes only — landing, login, register —
              and a not-found route. The authenticated table and the guard in front of it are
              F1.2.6's, so this task must not invent a placeholder guard for them.
      - key: F9.6
        title: Component primitives and design tokens
        labels: [frontend]
        depends_on: [F9.1]
        intent: >
          Buttons, forms, tables, modals, currency and date formatting bound to the account
          currency, and the token set they draw from. The values are already fixed by
          docs/design/design.css — this feature ports them into the app, it does not choose
          them again (ADR 0004).
        demo: >
          Toggle the theme on any screen and watch every colour follow from the tokens, then
          compare a button against docs/design/screens/design-language.html.
        tasks:
          - key: F9.6.1
            title: Color-token system ported from budget-checker
            labels: [frontend]
            detail: >
              Tailwind v4 with a `@theme` layer over semantic CSS custom properties
              (--color-background, --color-primary, etc.) in src/shared/styles/colors.css,
              light values on :root and dark overrides on .dark. One source of truth per DS-1:
              components reference tokens (bg-primary, text-foreground), never a raw hex.
          - key: F9.6.2
            title: Responsive breakpoint tokens (mobile / tablet / desktop)
            labels: [frontend]
            detail: >
              Named breakpoint tokens in src/shared/styles/breakpoints.css and a mobile-first
              convention: base styles target mobile, md:/lg: Tailwind variants layer up tablet
              and desktop. No shared component ships a fixed pixel width.
          - key: F9.6.3
            title: Reusable primitive component library
            labels: [frontend]
            detail: >
              src/shared/components/ — Button, Input, Select, Modal, Table, Card — each typed,
              each built only from the tokens above. A feature screen composes these instead of
              hand-rolling markup for a UI role that already exists.
          - key: F9.6.4
            title: Shared layout primitives and style utilities
            labels: [frontend]
            detail: >
              src/shared/styles/ spacing and typography scale plus layout primitives (Stack,
              Grid, a responsive Container) reused across breakpoints, so a screen composes
              layout instead of hand-rolling flexbox per page.

      - key: F9.7
        title: Loading, empty and error state conventions
        labels: [frontend]
        intent: >
          One documented treatment for each, so the honest empty states E5 and F5 require are
          consistent rather than per-screen improvisations. Not yet groomed into tasks: easiest
          to standardise once a couple of real feature screens exist to generalise from.
        demo: >
          Every empty, loading and refused state in the product matches its panel in
          docs/design/screens/states.html — checked screen by screen, not asserted.
        tasks:
          - title: Implement Loading state component
            detail: >
              A generic loading component (e.g. spinner or skeleton) for use while fetching data.
          - title: Implement Empty state component
            detail: >
              A component for screens with no data, supporting an icon, title, message, and action button.
          - title: Implement Error state component
            detail: >
              A component for failure/refused states, supporting an error icon, message, and retry button.

      - key: F9.8
        title: Installable app (PWA)
        labels: [frontend]
        depends_on: [F0.9]
        intent: >
          The web client installs on a phone's home screen and opens full screen like an app,
          so photographing receipts does not start with typing an address — without an app
          store, its fees or its review, and with every deploy reaching installed copies at
          once. Push notifications are left for a feature of their own: they need a backend
          to send them and something worth sending.
        demo: >
          On an iPhone, open the production URL in Safari, follow the hint to add it to the
          Home Screen, and open it from the new icon: full screen, no browser bar, the camera
          available on Upload. On Android, Chrome offers "Install app" itself. With the network
          off, the installed app opens to a page saying it is offline instead of a browser error.
        tasks:
          - key: F9.8.1
            title: Web app manifest and icons
            labels: [frontend]
            detail: >
              A manifest naming the app, its start URL, standalone display and theme colours
              from the design tokens; an app icon (also maskable) and an Apple touch icon, added
              to docs/design; the iOS meta tags that make the installed app full screen. The
              browser tab gets the same icon.
          - key: F9.8.2
            title: Service worker for the app shell
            labels: [frontend]
            detail: >
              Caches the built app so an installed copy opens fast and, without a network, shows
              an offline page rather than a browser error. Never caches API responses — receipts
              and figures are financial data and must not linger on the device. A new deploy is
              picked up on the next launch. Firebase Hosting serves the worker and manifest
              uncached.
          - key: F9.8.3
            title: Install hint
            labels: [frontend]
            detail: >
              Where a browser offers installing (Android Chrome), an "Install app" action in the
              profile; on iPhone Safari, which never offers it, a short dismissible hint how to
              add the app to the Home Screen. Nothing shown once installed. Checked at 375, 768
              and 1280 px.

      - key: F9.9
        title: Localization (English, Ukrainian, Polish)
        labels: [frontend, backend]
        depends_on: [F9.2]
        intent: >
          The product speaks the user's language: English, Ukrainian or Polish, chosen on first
          visit from the browser's language — never from where the user is, since a Ukrainian
          living in Poland reads Ukrainian — and changed any time on Profile or, before signing
          in, on the public pages. The choice is kept with the account, so it follows the user to
          another device and the server answers in it too. Dates, amounts and plural forms follow
          the language. Receipts are not translated: merchants and items stay as printed.
        demo: >
          Open the app in a browser set to Ukrainian: the landing page and sign-in are in
          Ukrainian. Switch to Polish on Profile: every screen follows, "2 paragony" and
          "5 paragonów" included, and signing in on a phone shows Polish there as well.
        tasks:
          - key: F9.9.1
            title: Language infrastructure and switchers
            labels: [frontend, backend, database]
            detail: >
              i18next with one JSON resource file per screen area under
              frontend/src/locales/{en,uk,pl}/, English the source whose keys type-check the
              others; plural forms through Intl.PluralRules. The language is the account's
              (`users.language`, add-only migration, read and changed through /users/me) or, before
              signing in, the browser's own choice kept in localStorage; on a first visit, the
              browser's languages, else English. A switcher on Profile and a compact one on the
              public pages. Dates and amounts formatted in the chosen language instead of the
              hard-coded en-GB / en-US. A check in CI fails when a key is missing from uk or pl.
              Checked at 375, 768 and 1280 px.
          - key: F9.9.2
            title: Public and sign-in screens in three languages
            labels: [frontend]
            detail: >
              Landing, sign in, register, the password checklist, the invite page and the app
              shell (navigation, toasts, not-found) read from the resources, translated into
              Ukrainian and Polish. Checked at 375, 768 and 1280 px in each language.
          - key: F9.9.3
            title: Upload and receipts in three languages
            labels: [frontend]
            detail: >
              The upload wizard, the receipts list, the receipt view and its dialogs, read from
              the resources and translated. Checked at 375, 768 and 1280 px in each language.
          - key: F9.9.4
            title: Dashboard, statistics, categories, goals and profile in three languages
            labels: [frontend]
            detail: >
              The remaining screens, read from the resources and translated; built-in category
              names translated by key, the user's own as they named them. Checked at 375, 768 and
              1280 px in each language.
          - key: F9.9.5
            title: Server messages and advice in the user's language
            labels: [backend, frontend]
            detail: >
              Refusals the user reads get their own problem codes and their values as `params`
              beside the English `detail`; the client shows its translation of the code and falls
              back to `detail` for a code it does not know. Goal advice is written in the user's
              language. Tests that every code the server can send has a translation.

  - key: E10
    title: Security, Privacy & Observability
    br: [N1, N2, N3, N5]
    phase: 1
    scope: out-of-scope
    groomed: false
    summary: >
      The cross-cutting non-functional requirements from BRD section 8 and the constraints in
      section 11, given their own epic so they are scheduled work rather than assumed work.
    features:
      - key: F10.1
        title: Encryption at rest for images and extracted data
        labels: [security, database]
        requirements: [N1]
        intent: >
          Receipt images and the extracted financial fields are encrypted at rest, with a
          documented key management and rotation approach.
        demo: >
          No screen of its own — receipt photos and totals keep rendering exactly as before,
          which is the point. Proven at the storage layer and by rotating a key without any
          screen changing.
      - key: F10.2
        title: Access control verification
        labels: [security, testing]
        requirements: [N2]
        intent: >
          An automated suite covering every user-owned endpoint, extending the base suite from
          F1.3 as each epic adds resources.
        demo: >
          No screen of its own. Proven by the suite failing when a new endpoint is added
          without an ownership filter — the check that F1.3's guarantee stays true as the
          product grows.
      - key: F10.3
        title: Receipt deletion and cascade
        labels: [backend, frontend]
        requirements: [N3]
        intent: >
          Deleting a receipt removes it from budget and statistics results within the same
          session, including its effect on any finalised snapshot.
        demo: >
          Delete a receipt from its detail dialog and watch the month total and the category
          breakdown both move without a reload.
      - key: F10.4
        title: Classification decision audit log
        labels: [backend, database]
        requirements: [N5]
        intent: >
          Every automatic category assignment and position-match decision logged with its
          confidence score, supporting both auditing and the tuning that C5 and B8 imply.
        demo: >
          No screen of its own — it records what the screens already show. Proven by
          categorising a receipt and finding each decision and its confidence in the log.
      - key: F10.5
        title: Structured logging, metrics and tracing
        labels: [infra, backend]
        intent: >
          Correlated request logging with financial values redacted, plus the latency metrics
          needed to prove the N4 target is met.
        demo: >
          No screen of its own. Proven by uploading a receipt, following one request id from
          the browser through every service log, and finding no amounts in any of them.
      - key: F10.6
        title: Rate limiting and abuse protection
        labels: [security, backend, frontend]
        # Taken into the diploma on its own: the product is public on Google Cloud
        # (ADR-0014) and every receipt read costs a model call, while the rest of E10 stays
        # planned but out of scope.
        scope: diploma
        groomed: true
        depends_on: [F0.9]
        intent: >
          Upload and AI-backed endpoints are the expensive ones; limit them per account and
          define the behaviour when a limit is hit. Each account gets a monthly number of
          receipt reads, configurable without a release; admins have none. Expensive and
          abusable endpoints are rate-limited per IP, and a service-wide daily ceiling on
          model calls caps the bill whatever happens to the per-account limits.
        demo: >
          On a phone, upload receipts as an ordinary account and watch "8 of 10 receipts left
          this month" count down; past the limit the upload screen says what the limit is and
          the date it resets, rather than a bare 429. Signed in as the admin, the same screen
          says there is no limit.
        tasks:
          - key: F10.6.1
            title: Monthly receipt-reading quota per account
            labels: [backend]
            detail: >
              Each account may have at most `monthly_receipt_quota` receipts read per calendar
              month (UTC, ADR-0009), default 10, set by environment variable. A receipt counts
              when it is read, not when it is stored, because the model call is the cost:
              receipts in upload jobs started this month plus emailed receipts. An upload that
              would exceed it is refused before any model call with a `quota_exceeded`
              problem stating the limit and the reset date; emailed receipts over it are
              dropped and logged. GET /users/me/quota returns limit, used, remaining, reset
              date and whether the account is unlimited.
          - key: F10.6.2
            title: Admin accounts without limits
            labels: [backend, infra]
            detail: >
              An account is an admin when its role is `admin` or its email is listed in
              `admin_emails` (environment, set from Terraform). Admins have no receipt quota
              and no service-wide ceiling. Being an admin grants no access to another user's
              data (BRD N2, G8).
          - key: F10.6.3
            title: Per-IP rate limits on expensive endpoints
            labels: [backend, security]
            detail: >
              Registration, receipt upload, asking for advice and exports are limited per
              client IP (Cloud Run passes it in X-Forwarded-For), alongside the existing login
              limit. A limit hit is a 429 in the RFC 7807 envelope with the retry delay, never
              the library's default body.
          - key: F10.6.4
            title: Service-wide daily ceiling on receipt reads
            labels: [backend]
            detail: >
              At most `daily_receipt_read_ceiling` receipts are read per UTC day across all
              non-admin accounts, so the bill is bounded even if the per-account quota is
              misconfigured or many accounts are created. Over it, uploads are refused with a
              `service_busy` problem saying when to try again. Vertex AI quotas cannot serve
              this: Gemini 2.x runs on a shared dynamic quota with no per-project cap.
          - key: F10.6.5
            title: Quota on the upload screen and the profile
            labels: [frontend]
            detail: >
              The upload screen shows how many receipts are left this month, and past the limit
              explains the limit and the reset date instead of offering to upload; the profile
              shows the month's usage; an admin sees that there is no limit. Checked at 375,
              768 and 1280 px.

      # F10.7 "Account deletion and full data export" moved to F17.9 (data rights and
      # retention), which brings it into the diploma's scope before the service is offered
      # to the public. Its issue was closed by hand. The key is retired; never reuse it.

  # ---------------------------------------------------------------- phase 2
  # Everything below goes beyond the BRD. It was written down early because three of
  # these epics change decisions made in phase 1 (who owns a receipt, how a receipt
  # arrives, what is recorded about a line item). The competitor analysis for the
  # diploma project moved E11 and E12 into scope and added E15 and E16; E13 and E14
  # stay planned but out of it.

  - key: E11
    title: Alternative Receipt Intake
    br: []
    phase: 2
    scope: diploma
    groomed: true
    summary: >
      BRD section 10 assumes every receipt arrives as a photograph. That assumption is the
      product's largest retention risk: photographing receipts is effort the user has to repeat
      every week, and repeated effort is what stops budgeting apps being opened after the second
      week. This epic adds intake that costs the user nothing — e-receipts arriving by email, the
      fiscal QR code printed on the receipt, and national e-receipt services — behind the same
      ingestion pipeline, so the channel changes only how a receipt arrives and nothing
      downstream of it.
    features:
      - key: F11.1
        title: Intake channel abstraction
        labels: [backend, frontend]
        requirements: [A12, A15]
        intent: >
          One ingestion port with an adapter per channel, so adding a channel does not touch
          parsing, categorisation or budget calculation. Every receipt records the channel it
          arrived through and the source reference, because a support question about a wrong
          figure starts with where the data came from. Photo upload becomes the first adapter;
          its behaviour does not change.
        demo: >
          No new screen of its own: upload a receipt photo exactly as before and confirm it, and
          the receipt's detail view says it was added from a photo.
        tasks:
          - key: F11.1.1
            title: Extend Receipt model with channel metadata
            labels: [backend]
            detail: >
              Add `channel` (enum: photo, email, qr) and an optional `source_reference` to the
              Receipt model and response schema, with an Alembic migration that marks every
              existing receipt as a photo. Further values arrive with the channel that needs
              them (F11.4's e-receipt service among them), not ahead of it.
          - key: F11.1.2
            title: Define Receipt Ingestion Port
            labels: [backend]
            detail: >
              Create a `ReceiptIngestionPort` protocol, typed by the payload its channel
              receives, that turns one receipt's raw input into one extraction for the existing
              categorisation and review pipeline.
          - key: F11.1.3
            title: Refactor photo upload to use Ingestion Port
            labels: [backend]
            detail: >
              Move photo storage and vision extraction into a photo adapter implementing the
              port. A pure move: same storage keys under the owner's prefix (N2), same merging
              of overlapping shots (B2-B4), same failure reporting; the existing tests pass
              unchanged in what they assert.
          - key: F11.1.4
            title: Carry the channel from intake to the stored receipt
            labels: [backend]
            detail: >
              The adapter states its channel and source reference; the upload job keeps them and
              the confirmed receipt is stored with them, so a second channel records itself
              rather than silently landing as a photo.
          - key: F11.1.5
            title: Show how a receipt arrived
            labels: [frontend]
            detail: >
              The receipt detail view shows the channel ("Added from a photo") and, where there
              is one, the source reference. Checked at 375, 768 and 1280 px.

      - key: F11.2
        title: Email receipt ingestion
        labels: [backend, infra, frontend]
        depends_on: [F11.1]
        intent: >
          A per-user forwarding address that accepts electronic receipts, extracting items from
          HTML bodies and PDF attachments. Sender verification matters here: an intake address is
          a public endpoint that writes to a user's financial record.
        demo: >
          In Profile, copy your receipt forwarding address and forward a store's e-receipt to it
          from the email you signed up with: the receipt appears on Receipts marked "From email",
          itemised and categorised like a photo. The same forward from an unknown sender adds
          nothing.
        tasks:
          - key: F11.2.3
            title: Decide the inbound email provider
            labels: [infra]
            detail: >
              ADR choosing how inbound mail reaches the backend without a paid domain — App
              Engine's inbound mail on `<project>.appspotmail.com` relayed to a webhook
              (ADR-0013) — and fixing the limits a public intake address needs: message size,
              accepted attachment types, and a per-user daily rate. Includes the local SMTP relay
              that stands in for it in docker compose.
          - key: F11.2.4
            title: Per-user forwarding address
            labels: [backend]
            detail: >
              Give each user an unguessable forwarding address, stored with the user, that can be
              regenerated to stop spam reaching it; the old address stops accepting mail at once.
              Exposed to the user's own profile only (N2).
          - key: F11.2.1
            title: Configure email ingestion webhook
            labels: [backend, infra]
            detail: >
              Receive raw messages from the relay behind a shared secret, resolve the forwarding
              address to its user, and accept only mail from that user's account email, within
              the daily limit. Rejected mail is logged and dropped, never stored. The App Engine
              receiver itself is deployed with the Google Cloud infrastructure (F0.9).
          - key: F11.2.2
            title: Implement email parsing and adapter
            labels: [backend]
            detail: >
              An email adapter implementing `ReceiptIngestionPort`: read the receipt from the HTML
              body or a PDF attachment through the existing parser, with the message id as the
              source reference. The receipt lands in the same review flow as a photo.
          - key: F11.2.5
            title: Forwarding address and email receipts in the UI
            labels: [frontend]
            detail: >
              Profile shows the forwarding address with copy and regenerate, and how to forward a
              receipt to it. Receipts marks email receipts and can be filtered by how they arrived.
              Checked at 375, 768 and 1280 px.

      - key: F11.3
        title: Fiscal identity of a receipt
        labels: [backend, frontend]
        requirements: [A12, A14]
        depends_on: [F11.1, F11.4]
        intent: >
          Every fiscal receipt prints numbers that identify it uniquely — in Poland the cash
          register's number (ECA …) and the printout number, in Ukraine the register's and the
          receipt's fiscal numbers. The reader takes them off the photo, and they are stored
          with the receipt. This replaces the planned QR intake: the F11.4 spike (ADR-0015)
          found that neither market lets a third-party app fetch a receipt's items, and Polish
          receipts carry no fiscal QR code at all.
        demo: >
          Upload a Polish shop receipt: the receipt view shows "Register ECA 2201079960 ·
          receipt 85503". A restaurant bill without fiscal numbers shows none, and nothing else
          changes.
        tasks:
          - key: F11.3.1
            title: Read and store the fiscal identity
            labels: [backend]
            detail: >
              The reader returns the register number and the receipt number, normalised; they
              are stored on the receipt, from the wizard and from email alike, indexed per user.
              A receipt without them stores none. Parser version bumped.
          - key: F11.3.2
            title: Show the fiscal identity on the receipt
            labels: [frontend]
            detail: >
              The receipt view shows the register and receipt numbers when the receipt has them.
              Checked at 375, 768 and 1280 px.

      - key: F11.4
        title: National e-receipt service integration
        labels: [backend]
        intent: >
          A feasibility spike on integrating with the target markets' e-receipt systems
          (e-Paragony in Poland, єЧек in Ukraine) and on fiscal QR codes. Answered by ADR-0015:
          neither is open to a third-party app today, so there is no integration to build; the
          receipt's printed fiscal identity (F11.3) is used instead.
        demo: >
          No screen of its own: proven by ADR-0015, which records for Poland and Ukraine what a
          fiscal QR code holds, why its items cannot be fetched, and what to watch for that would
          reopen the question.
        tasks:
          - key: F11.4.1
            title: Spike e-receipt system integration
            labels: [backend]
            detail: >
              Research integration feasibility with national e-receipt services and with fiscal
              QR codes in Poland and Ukraine. Produce an ADR with findings and architectural
              decisions, and the follow-up tasks for F11.3 and F11.4.

      - key: F11.5
        title: Cross-channel duplicate detection
        labels: [backend, frontend]
        requirements: [A14]
        depends_on: [F11.2, F11.3]
        intent: >
          One purchase that arrives twice — photographed twice, or photographed and emailed — is
          one receipt. BRD A14 compares merchant, date and total, which cannot tell a second copy
          apart from a second visit to the same shop on the same day; the fiscal identity can.
        demo: >
          Upload a receipt already stored: the wizard says "Already stored — added 3 October" and
          does not store it again, without asking. Forward the e-receipt of a restaurant bill you
          already photographed: Receipts marks the new one as a possible duplicate, and you keep
          both or remove it.
        tasks:
          - key: F11.5.1
            title: Recognise a receipt already stored by its fiscal identity
            labels: [backend]
            detail: >
              A receipt whose register and receipt numbers match one of the user's stored receipts
              is not stored again — in the wizard it is shown as already stored, with when it was
              added, and left out of the commit; by email it is dropped. Without a fiscal identity,
              merchant, date and total still ask the user (A14). A duplicate the user chose to skip
              is never stored.
          - key: F11.5.2
            title: Confirm a cross-channel duplicate outside the upload flow
            labels: [frontend, backend]
            detail: >
              Email receipts arrive without the wizard, so a likely duplicate by merchant, date and
              total is stored marked as possibly the same as an earlier receipt; Receipts shows the
              mark, and the receipt view offers to keep both or remove the new one. Checked at 375,
              768 and 1280 px.

      - key: F11.7
        title: Receipts in a foreign currency
        labels: [backend, frontend]
        requirements: [D1]
        depends_on: [F11.1]
        intent: >
          A receipt from a trip abroad — hryvnias on a złoty account — is converted into the
          account's currency at the rate of its purchase date, instead of being counted as if
          1197 UAH were 1197 PLN. The original amount, currency and rate stay on the receipt,
          so the figure can always be traced back. Until now the reader recognised the
          currency and the app dropped it, which overstated a month roughly tenfold; the BRD
          had multi-currency down as a non-goal, and this feature reverses that, with an ADR.
        demo: >
          On a złoty account, upload a Ukrainian receipt: the wizard shows "1197.00 UAH ≈
          115.40 PLN · NBP rate, 3 October"; once stored, the month total and the statistics
          count 115.40, and the receipt shows both amounts.
        tasks:
          - key: F11.7.1
            title: Decide how foreign receipts are converted
            labels: [backend]
            detail: >
              ADR: a free, keyless rate source that covers any account currency and any receipt
              currency, wherever the user lives — the National Bank of Poland's tables A (daily)
              and B (weekly, the rarer currencies), crossed through the złoty for accounts in
              other currencies, with the ECB rates (Frankfurter) as the fallback; verify both
              cover UAH and USD before deciding. Also the rate date (the purchase date, else the
              last published rate before it), rounding, and that the rate is stored with the
              receipt so totals never shift afterwards. Updates the BRD non-goal and answers the
              domain model's open question on multi-currency.
          - key: F11.7.2
            title: Exchange-rate port with cached rates
            labels: [backend]
            detail: >
              An ExchangeRatePort with NBP and ECB adapters, converting between any two
              currencies they cover (crossing through a common one where needed, e.g. UAH → PLN
              → USD for a dollar account); each rate fetched is cached in the
              database by currency pair and date, so a month of receipts costs a handful of
              calls. Tests stub the port; a rate service that cannot answer raises one error
              type the caller handles.
          - key: F11.7.3
            title: Store the original amount and convert on intake
            labels: [backend]
            detail: >
              A receipt keeps its original currency, original total and the rate and its date;
              its line totals are stored in the account's currency so every total, statistic and
              budget figure stays one currency (D1). Conversion happens when a receipt is stored,
              whether through the wizard or by email. With no rate available the receipt is held
              in review saying why, never stored as if it were in the account's currency.
          - key: F11.7.4
            title: Show both amounts
            labels: [frontend]
            detail: >
              The wizard and the receipt view show the original amount beside the converted one
              with the rate's source and date; the receipts list shows the converted total with
              the original currency marked. Checked at 375, 768 and 1280 px.

  # F11.6 "Intake settings interface" was retired at grooming. It was this epic's UI in one
  # trailing feature: the forwarding address now ships with email intake (F11.2.5), and "what
  # arrived through each" with the receipts list (F11.1.4). QR scanning was dropped (ADR-0015).
  # Issues #163, #365 and #366 are closed by hand. The key is retired; never reuse it.

  - key: E12
    title: Household & Shared Budgets
    br: []
    phase: 2
    scope: diploma
    groomed: true
    summary: >
      BRD section 4.2 places shared budgets out of scope and section 14 leaves the question open.
      Commercially they are what makes the product stick: a household that has agreed a shared
      budget does not churn the way one person tracking their own spending does. Groomed on
      2026-10-09 around the cheapest model that delivers it: a receipt stays its owner's, and
      belonging to a household only adds read access to the other members' receipts, so N2,
      every repository and every access test written so far keep working unchanged. Goals and
      advice stay personal.
    features:
      - key: F12.1
        title: Ownership model decision
        labels: [backend, database]
        requirements: [N2]
        demo: >
          No screen of its own: the ADR in docs/adr/ that every later E12 feature is built on.
        intent: >
          A receipt is owned by the user who added it; a household is a group of users, and
          membership grants read access to the members' shared receipts, never write access.
          Decided and written up before any schema changes, because it constrains every
          repository already written.
        tasks:
          - key: F12.1.1
            title: Decide how a household shares receipts
            labels: [backend]
            detail: >
              ADR: receipts stay owned by their user (user_id unchanged); one household per user;
              members read each other's shared receipts and only the owner edits or deletes;
              joining shares everything except receipts marked private; a private receipt's
              money still counts in the household's totals, but the household sees only one
              line per member per month ("Private — Anna: 120 PLN") with no merchant, items,
              category or date; members must share one account currency, since household totals
              are in it (ADR-0016). Updates the BRD out-of-scope note, the domain model's open
              question on households and invariants for the household, and overview.md.

      - key: F12.2
        title: Household and its members
        labels: [backend, frontend, database]
        demo: >
          On Profile, create a household and give it a name; it lists you as its owner. A second
          account that joins (F12.3) appears in the list; the owner can remove it, and a member
          can leave.
        intent: >
          A household, the users in it, and two roles: the owner, who created it and may rename
          it, set its budget and remove members, and members, who may leave.
        tasks:
          - key: F12.2.1
            title: Household and membership
            labels: [backend, database]
            detail: >
              Household (name, owner) and HouseholdMember (household, user, role, joined_at),
              with a migration that only adds. Endpoints to create, read, rename, leave, and for
              the owner to remove a member. A user belongs to at most one household; the owner
              leaving with members left is refused until they remove them, and the last member
              leaving deletes it. Cross-household tests (N2): a non-member reads nothing and
              changes nothing.
          - key: F12.2.2
            title: Household on Profile
            labels: [frontend]
            detail: >
              Profile gains a Household card: create one, see its name and members with their
              roles, rename and remove members as owner, leave as member, each with a
              confirmation. Checked at 375, 768 and 1280 px.

      - key: F12.3
        title: Joining by invite link
        labels: [backend, frontend]
        demo: >
          The owner copies the household's invite link from Profile and sends it by messenger;
          the other person opens it, signs in or registers, and joins after confirming.
        intent: >
          Joining by a link the owner shares however they like, so no mail provider is needed.
          The link can be regenerated, which stops the old one working.
        tasks:
          - key: F12.3.1
            title: Invite codes
            labels: [backend]
            detail: >
              The household carries an unguessable invite code the owner can read and
              regenerate. Joining by code adds the user as a member unless they are already in a
              household or their account currency differs from the household's, each refused
              with a reason; a regenerated code invalidates the old one. Joining is rate-limited
              per IP like login (F10.6). Tests for each refusal.
          - key: F12.3.2
            title: Invite link and join page
            labels: [frontend]
            detail: >
              The Household card shows the invite link with copy and regenerate. /join/:code
              shows the household's name and owner and a Join button; an anonymous visitor is
              sent to sign in or register and returned to it. Refusals are shown in words.
              Checked at 375, 768 and 1280 px.

      - key: F12.4
        title: Shared and private receipts
        labels: [backend, frontend]
        requirements: [N2]
        demo: >
          In a household of two, Receipts gains a "Mine / Household" switch: the household view
          lists both members' receipts with who added each, read-only for the other's. Marking
          a receipt private removes it from the other member's view.
        intent: >
          A member's receipts are shared with the household from the moment they join, except
          those they mark private. The household sees shared receipts in full and read-only;
          a private one is never shown, only its money (F12.5).
        tasks:
          - key: F12.4.1
            title: Read access through membership
            labels: [backend, database]
            detail: >
              Receipt gains `is_private` (default false, add-only migration). A household
              receipts listing returns the members' non-private receipts with who added each, and
              a member may open one; edit, delete, recategorise and every write stay owner-only
              through the existing ownership filter. Leaving or being removed revokes access at
              once. Cross-household tests: a non-member, a removed member and a private receipt
              are each invisible (N2).
          - key: F12.4.2
            title: Mark a receipt private
            labels: [backend, frontend]
            detail: >
              The owner marks or unmarks a receipt private from the receipt view, which says what
              the household then sees ("only the amount, in your monthly private total"). Absent
              outside a household. Checked at 375, 768 and 1280 px.
          - key: F12.4.3
            title: Household view of Receipts
            labels: [frontend]
            detail: >
              A "Mine / Household" switch on Receipts, shown only in a household; the household
              view marks whose each receipt is and opens another member's read-only, without
              edit, delete or category controls. Filters and pagination work as in the personal
              view. Checked at 375, 768 and 1280 px.

      - key: F12.5
        title: Household budget and statistics
        labels: [backend, frontend]
        demo: >
          The owner sets a household budget on Profile; the dashboard's "Household" view shows
          the month's total against it with each member's share, private spending included as
          one line per member; Statistics shows the household's categories with a "Private" row.
        intent: >
          BR-4 and BR-5 over the household's combined spending, including each member's
          contribution, which is the number households actually argue over. Private receipts
          count in the money but never show what they were. Goals and advice stay personal.
        tasks:
          - key: F12.5.1
            title: Household month and limit
            labels: [backend]
            detail: >
              The owner sets an optional household monthly budget. The household month adds every
              member's parsed receipts filed in it (D1-D3, same month rules as personal), private
              ones included, against that budget, and splits the total per member, each member's
              private receipts summed into one figure with no date or detail. Tests that a
              private receipt changes the totals and nothing else about it is returned.
          - key: F12.5.2
            title: Household statistics
            labels: [backend]
            detail: >
              Category statistics over the household's shared receipts for a period, as the
              personal ones (E6), with private spending as a single "Private" row; each member's
              own categories are kept apart by user, so a custom category name is shown with its
              owner. Tests that no private receipt's category or items leak.
          - key: F12.5.3
            title: Household dashboard and statistics views
            labels: [frontend]
            detail: >
              Dashboard and Statistics gain the same "Mine / Household" switch: the household
              month shows the total against the household budget and a per-member split with
              private lines; Statistics shows household categories with the Private row. The
              owner sets the household budget on the Household card. Checked at 375, 768 and
              1280 px.

      - key: F12.6
        title: Access control under shared ownership
        labels: [security, testing]
        requirements: [N2]
        demo: >
          No screen of its own: the cross-household suite in CI, failing if any household
          endpoint lets a non-member, a removed member or a private receipt through.
        intent: >
          One suite that walks every household-aware endpoint as the owner, a member, a removed
          member and a stranger, so a later change cannot open one quietly.
        tasks:
          - key: F12.6.1
            title: Cross-household access suite
            labels: [testing]
            detail: >
              A parametrised suite over every endpoint E12 adds or widens: membership grants
              read only, removal revokes at once, a private receipt's details are never in any
              response to anyone but its owner, and every write stays owner-only.

      - key: F12.8
        title: Shared money in the family
        labels: [backend, frontend, database]
        requirements: []
        depends_on: [F12.5, F23.17, F23.18]
        intent: >
          Today an income, a regular bill or the budget one adult sets is invisible to the
          other: the family's money is not the family's. Each of them is either "mine" or
          "shared with the family". A shared one is seen and changed by every adult in the
          household; a shared bill is split equally or by income. When a member adds one, the
          app asks once whether it is shared, shared being the default inside a household.
        demo: >
          Add the 3 000 zł flat as a shared bill split by income on your phone; on your wife's
          phone Plan shows it, she changes it to 3 100, and your Plan follows.
        tasks:
          - key: F12.8.1
            title: Shared or mine on incomes, bills and the budget
            labels: [backend, database]
            detail: >
              A household scope on regular incomes, regular bills, one-off incomes and the
              household budget, readable and writable by every adult member (not by a child,
              F12.10); a split (equal or by income) on shared bills; the household month counts
              shared ones once. Domain model and ADR-0017 updated; cross-household and
              child-cannot-write tests (N2).
          - key: F12.8.2
            title: Whose it is, on Plan and Settings
            labels: [frontend]
            detail: >
              "Shared with family / Only mine" when adding or changing one (canvas F_Shared), a
              chip on every row (Shared, Mine, the member's name), who added it, and the split
              with each one's part. Checked at 375, 768 and 1280 px.
      - key: F12.9
        title: The family's month on Home
        labels: [frontend, backend]
        requirements: []
        depends_on: [F12.8]
        intent: >
          Switching Home to the family still shows the first design. The family's month in
          the new one (canvas F_Home): what is left together, the shared income, bills and
          budget, and who spends what — each member's share in percent, as a ring, by
          category or by day — with others' private receipts as one undated sum (ADR-0017).
        demo: >
          Switch Home to Family: the ring says what is left together; "Who spends what" shows
          you 62 % and Anna 38 %; tap Categories, then By day.
        tasks:
          - key: F12.9.1
            title: Family Home in the new design
            labels: [frontend, backend]
            detail: >
              The household month and statistics endpoints extended with each member's share
              overall and per category; Home's Family view rebuilt after canvas F_Home with the
              chart switch (share, categories, by day). Checked at 375, 768 and 1280 px.
      - key: F12.10
        title: Adults and children
        labels: [backend, frontend, security]
        requirements: [N2]
        depends_on: [F12.8]
        intent: >
          A family is not only two adults. A member is an adult or a child: a child adds their
          receipts and sees the family's month but changes nothing shared. The owner is an
          adult who also invites and removes people; whether only the owner may change the
          shared budget is the owner's choice.
        demo: >
          Mark Max as a child: on his phone he adds a receipt, but the flat and the budget
          open read-only.
        tasks:
          - key: F12.10.1
            title: Roles and what each may do
            labels: [backend, frontend, security]
            detail: >
              A role on the membership (adult, child), set by the owner (canvas F_Members); every
              shared write refuses a child; "only the owner changes the budget" setting;
              access tests for each role. Checked at 375, 768 and 1280 px.
      - key: F12.11
        title: What the family buys, line by line
        labels: [backend, frontend, ai]
        requirements: []
        depends_on: [F12.9, F16.1]
        intent: >
          What no bank-fed budget can show, because it never sees a receipt's lines: who buys
          what, products the family bought twice the same day or week, what on one receipt is
          the family's and what is one person's, and a family goal's advice naming the
          products to change.
        demo: >
          Home shows "Bought twice this week: bread and milk, you both, on Tuesday"; a family
          goal "save 500 a month" lists the swaps that make it, by product.
        tasks:
          - key: F12.11.1
            title: Who buys what and bought twice
            labels: [backend, frontend]
            detail: >
              Per member per product over a period from shared receipts only (ADR-0017), the
              same product bought by two members within a few days, and a card for it on the
              family Home. Checked at 375, 768 and 1280 px.
          - key: F12.11.2
            title: Family goal advice by product
            labels: [backend, ai]
            detail: >
              The goal check (F23.13) over the household's shared lines, naming products and
              the member-neutral swaps that reach the goal, from the family's own prices.

  # F12.7 "Household interface" was retired at grooming: E12's screens sit with the endpoints
  # they expose (F12.2.2, F12.3.2, F12.4.2-3, F12.5.3), per the working agreement's vertical
  # slices. Issue #171 is closed by hand. The key is retired; never reuse it.

  - key: E13
    title: Aggregated Purchase Analytics
    br: []
    phase: 2
    scope: diploma
    groomed: true
    summary: >
      After E21, and only if the diploma's timetable leaves room. The item-level data BO-2
      produces is something bank and card feeds structurally cannot supply: what was actually
      bought, not which shop was paid. Aggregated across many users and anonymised, it first
      serves the users themselves — what a product costs across everyone and where it is cheapest
      this week — and could later be a saleable market signal (F13.6 and E18 decide whether, with
      a lawyer; nothing in this epic sells anything). The failure mode is legal rather than
      technical, so the constraints come first: no aggregate without explicit, revocable opt-in,
      no figure for a cohort small enough to identify someone, no row with a user in it ever
      leaving PostgreSQL. The warehouse is BigQuery within its free tier, filled by a job run from
      the backend's image as a Cloud Run Job — recorded as the first part to move into a service
      of its own when there are the means to run one.
    features:
      - key: F13.1
        title: Explicit opt-in consent and withdrawal
        labels: [security, backend, frontend]
        requirements: [N6]
        depends_on: [F17.9]
        intent: >
          A separate, freely revocable consent — never bundled into terms of service and never a
          pre-ticked box — recording what was agreed to and when. Nothing else in this epic may
          touch a user's data without it, and withdrawal takes effect without the user having to
          ask twice. The privacy policy, terms and record of processing (ADR-0020) say so.
        demo: >
          Turn on "Take part in shared price statistics" on Profile and read what it shares; open
          the privacy policy and find the new section and version; turn it off again.
        tasks:
          - key: F13.1.1
            title: The sharing choice
            labels: [backend, frontend, database]
            detail: >
              A flag on the user with the time it was last changed, false for every account,
              existing ones included; a Profile switch saying what is shared — what was bought,
              where, for how much, by which week, never who — and that turning it off removes the
              user's part from the next recalculation, in three languages; the choice in the full
              data export (F17.9.2). Checked at 375, 768 and 1280 px.
          - key: F13.1.2
            title: Privacy policy, terms and record of processing updated
            labels: [docs, frontend]
            detail: >
              ADR-0020 lists the aggregates, their purpose and legal basis (consent), the
              warehouse and its location, the minimum cohort, and that aggregates are not personal
              data once published; the /privacy and /terms pages say the same in three languages
              under a new TERMS_VERSION, and signed-in users are shown once that the policy
              changed. Checked at 375, 768 and 1280 px.
      - key: F13.2
        title: Product normalisation catalogue
        labels: [ai, backend, database]
        requirements: []
        depends_on: [F16.1]
        intent: >
          "MLEKO UHT 3,2% 1L" and "Mleko 3.2% 1l" have to become one canonical product across
          users, as F16.1 already makes them one within a user. This is the technical core of the
          epic: without normalisation the aggregates are noise, and normalisation quality sets the
          ceiling on what the data is worth. The catalogue holds names and sizes only, nothing of
          anyone's.
        demo: >
          Two test accounts each buy "MLEKO 2% 1L" in different shops; both products point to one
          catalogue entry "mleko 2% 1 l".
        tasks:
          - key: F13.2.1
            title: Shared catalogue and matching
            labels: [backend, database]
            detail: >
              A catalogue table keyed like a product — words and size, without the user — each
              user's product linked to one entry, matched by rule and, where unsure, by the model
              as F16.1 matches lines; filled as products are matched and for those already there;
              a merge or split (F16.1) moves the link; tests that no user id or receipt reaches
              the catalogue.
      - key: F13.3
        title: Anonymisation and aggregation pipeline
        labels: [backend, database]
        requirements: []
        depends_on: [F13.1, F13.2]
        intent: >
          Pseudonymisation, deliberate coarsening of anything that narrows a person down, and
          aggregation — producing output in which no basket can be traced back to a household:
          weekly price aggregates per catalogue entry and shop chain (median, lowest and highest
          unit price, how many bought), from the purchases of users who opted in, recalculated
          from scratch every night.
        demo: >
          Run the job on seeded data with twelve sharing accounts and read this week's price of
          "mleko 2% 1 l" in Biedronka from twelve contributors.
        tasks:
          - key: F13.3.1
            title: Aggregation job
            labels: [backend]
            detail: >
              The weekly aggregates computed by the backend's image, runnable as a Cloud Run Job;
              no timestamps finer than the week, no addresses finer than the shop chain, no user
              ids in the output; unit prices per kg, l or piece as F16.2 compares them.
      - key: F13.4
        title: Minimum cohort thresholds
        labels: [security, backend]
        requirements: []
        depends_on: [F13.3]
        intent: >
          No figure is published for a cohort below a defined number of contributing users. A
          query that would breach the threshold returns nothing rather than a small-sample
          number, because a small sample is how anonymised data stops being anonymous.
        demo: >
          With nine sharing accounts buying a product, no aggregate for it exists; a tenth makes it
          appear on the next run.
        tasks:
          - key: F13.4.1
            title: The contributor threshold
            labels: [security, backend]
            detail: >
              A setting, 10 by default, applied before anything is written; tests that an
              aggregate under it is never written, by the job or by any query.
      - key: F13.5
        title: Separate analytics store
        labels: [database, infra]
        requirements: []
        depends_on: [F13.4, F0.9]
        intent: >
          Aggregates live outside the operational database, with no path from a business query
          back to a user's receipts. A boundary enforced by topology is worth more here than one
          enforced by review. The store is BigQuery in us-central1 within its free tier; the
          aggregates are also copied back into a PostgreSQL table the product screens read.
        demo: >
          After a run, the BigQuery table holds the week's aggregates and nothing with a user in
          it; the service account that writes it can write nothing else.
        tasks:
          - key: F13.5.1
            title: Warehouse in Terraform
            labels: [infra]
            detail: >
              A BigQuery dataset and table, the job and its nightly Cloud Scheduler trigger, a
              service account allowed to write only there; an ADR for the warehouse, the threshold
              and why the job is not yet a service of its own; docs/architecture/overview.md
              updated.
      - key: F13.6
        title: Business insight API
        labels: [backend]
        scope: out-of-scope
        intent: >
          Price and basket trends per product and category for business consumers, versioned and
          metered, delivering only what the aggregation pipeline has already cleared. Waits for an
          audience large enough to make the aggregates worth anything and for E18's legal work.
      - key: F13.7
        title: Transparency and deletion propagation
        labels: [security, backend]
        requirements: [N3, N6]
        depends_on: [F13.3]
        intent: >
          A user can see what their data contributes, and withdrawing consent or deleting an
          account removes their contribution from future aggregates — the extension of N3 and N6
          into a second data store. Recalculating from scratch each night is what makes it so:
          nothing of a user who stopped sharing survives the next run.
        demo: >
          Turn sharing off for three of twelve contributing accounts and run the job again: the
          aggregate falls under the threshold and is gone from both stores.
        tasks:
          - key: F13.7.1
            title: Withdrawal and deletion reach the warehouse
            labels: [security, backend]
            detail: >
              Tests that a user who stopped sharing or deleted the account is in no aggregate
              after the next run; Profile says how many of the week's published prices the user's
              purchases are part of. Checked at 375, 768 and 1280 px.
      - key: F13.8
        title: Prices from everyone
        labels: [backend, frontend]
        requirements: []
        depends_on: [F13.5, F16.3]
        intent: >
          A product's page shows what it costs across everyone this week and where it is cheapest,
          beside what the user paid — for any product with enough contributors, and for any user,
          sharing or not: the aggregates are anonymous. The cheaper-shop hint (F16.3) uses them
          where the user's own receipts are too few.
        demo: >
          Open "mleko 2% 1 l": "Everyone this week: median 3.49 PLN, cheapest at Lidl (2.99)", next
          to the user's own last price.
        tasks:
          - key: F13.8.1
            title: Shared prices on the products screens
            labels: [backend, frontend]
            detail: >
              The week's aggregate for each product with a catalogue entry in the products API;
              the explore panel and the cheaper-shop hint showing it, in three languages, and
              saying nothing where no aggregate is published. Checked at 375, 768 and 1280 px.

  - key: E14
    title: B2B Export & Accounting Integrations
    br: []
    phase: 2
    scope: out-of-scope
    groomed: false
    summary: >
      Willingness to pay for structured receipt data is far higher among small businesses and the
      accountants who serve them than among individuals tracking groceries, and the sale needs no
      consumer marketing budget. F7.6 already exports CSV and JSON; this epic is about an export
      a bookkeeper's software ingests without a human reshaping it, the business fields such an
      export requires, and the extraction pipeline itself sold as an API.
    features:
      - key: F14.1
        title: Business expense fields
        labels: [backend, database]
        intent: >
          VAT rate and amount per line item, the merchant's tax identifier, and a
          business-or-personal split. BRD section 9's data model carries none of them, and an
          accounting export is worthless without all three.
      - key: F14.2
        title: Accounting-format export
        labels: [backend]
        requirements: [N6]
        intent: >
          Export in the formats accounting software reads directly, rather than the generic
          CSV/JSON of F7.6 that leaves the reshaping work to whoever receives it.
      - key: F14.3
        title: Scheduled and bulk delivery
        labels: [backend, infra]
        intent: >
          The monthly export is produced and delivered without anyone remembering to request it,
          including histories large enough that generating one synchronously is not an option.
      - key: F14.4
        title: Receipt parsing API for third parties
        labels: [backend, security]
        intent: >
          The extraction pipeline built in E3 offered as a product in its own right: API keys, a
          versioned response contract that callers can depend on across parser versions, and
          quotas.
      - key: F14.5
        title: Usage metering and plan limits
        labels: [backend]
        intent: >
          Counting what each account consumes — receipts parsed, API calls made, images stored.
          Every paid tier depends on this number, and nothing in phase 1 records it.
      - key: F14.6
        title: Business account interface
        labels: [frontend]
        intent: >
          Export configuration, API key management and current usage against plan limits.

  # ------------------------------------------------------- diploma: better than the market
  # Written from the competitor analysis: what no app on the Polish, Ukrainian or
  # global market does, or does well enough, and no planned epic already covered.
      - key: F14.7
        title: Sole traders and KSeF invoices
        labels: [backend, frontend]
        intent: >
          A Polish sole trader (JDG) keeps the firm's costs apart from the household's: purchase
          invoices fetched from KSeF, the national e-invoice system mandatory from 2026, with the
          trader's NIP and authorisation token; receipts and invoices marked as a business cost;
          VAT and the cost column of the revenue and expense ledger (KPiR) worked out per
          document; a month's costs handed to the accountant or sent to iFirma, inFakt or wFirma.
          The personal budget never counts a business cost, as business trips already are not.
      - key: F14.8
        title: Tax deductions from receipts
        labels: [backend, ai]
        intent: >
          Purchases that lower personal income tax — medical and rehabilitation costs (ulga
          rehabilitacyjna), internet, thermal modernisation — recognised from receipt lines and
          gathered for the yearly PIT return, with the receipts that prove them kept past the
          usual 90 days.

  - key: E15
    title: Receipt Accuracy & Trust
    br: []
    phase: 2
    scope: diploma
    groomed: true
    summary: >
      Reading a receipt is right on clean paper and wrong on a long, faded one with a dozen
      discounts: the best readers manage 70-85% there, and the apps on the market either hide
      the error or leave the user to find it. A receipt that does not add up and does not say
      why is the fastest way to lose a user's trust, and an untrusted figure makes every piece
      of advice built on it worthless. This epic makes every disagreement visible, explained
      and fixable in one step, marks the lines the reader doubted, remembers what the user
      corrected, and measures how often reading goes wrong.
    features:
      - key: F15.1
        title: Explained totals mismatch and the missed-discount fix
        labels: [backend, frontend]
        requirements: []
        depends_on: [F3.4, F3.9]
        intent: >
          A receipt whose lines disagree with its printed total says by how much and why, wherever
          it is shown. Lines above the total usually mean a discount the reader missed, offered as
          one line of exactly that amount; lines below it mean a line is missing or misread. A grosz
          of rounding is not a disagreement. Nothing is added without the user's say.
        demo: >
          Upload a Biedronka receipt whose OPUST lines were not read; the card says the lines come
          to 38.24 more than the 188.02 printed and offers a -38.24 discount; one click and the
          receipt adds up and counts toward the month.
        tasks:
          - key: F15.1.1
            title: Missed discount added to an extracted receipt
            labels: [backend]
            detail: >
              Endpoint that appends one discount line to an extraction, filed under the receipt's
              dominant category, and re-checks its arithmetic; the same category for a discount
              typed into a stored receipt. One grosz of tolerance shared by upload and edit.
          - key: F15.1.2
            title: Mismatch note in the upload wizard, the receipt view and the edit dialog
            labels: [frontend]
            detail: >
              One shared note that names both figures and the gap, offers the discount when the
              lines are above the total and a way to fix the receipt when they are below.
      - key: F15.2
        title: Doubtful lines marked
        labels: [backend, frontend]
        requirements: [A10]
        depends_on: [F3.3, F15.1]
        intent: >
          The lines the reader was unsure of are marked where the user looks at the receipt, with
          the photo beside them, so checking a receipt means checking three lines, not thirty.
        demo: >
          Open a receipt read from a faded photo; two lines carry a "check this" mark, and the
          filter "doubtful only" shows just those two next to the photo.
        tasks:
          - key: F15.2.1
            title: Keep each line's read confidence with the stored receipt
            labels: [backend, database]
            detail: >
              Persist the per-line extraction confidence on line items and return it with the
              receipt detail, so the mark survives storing the receipt.
          - key: F15.2.2
            title: Doubtful-line marks and filter
            labels: [frontend]
            detail: >
              Mark low-confidence lines in the upload wizard and the receipt view, with a filter
              showing only those and the receipt photo beside them.
      - key: F15.3
        title: Corrections that stick
        labels: [backend, frontend]
        requirements: []
        depends_on: [F15.1, F5.5]
        intent: >
          A line name the user corrected on a receipt from one shop is corrected the same way on
          the next receipt from that shop, so the same misreading is fixed once, not every week.
        demo: >
          Correct "MastoZPolskMlecz200g" to "Masło 200g" on one Biedronka receipt; the next
          Biedronka receipt reads "Masło 200g" and says it was corrected from what was printed.
        tasks:
          - key: F15.3.1
            title: Per-shop correction memory applied at extraction
            labels: [backend, database]
            detail: >
              Record name corrections per user and merchant and apply them to later extractions
              from that merchant, keeping what was read alongside what is shown.
          - key: F15.3.2
            title: Corrected-line indicator with undo
            labels: [frontend]
            detail: >
              Show that a line was corrected from memory and let the user undo it for that line or
              forget the correction.
      - key: F15.4
        title: Reading accuracy report
        labels: [backend, frontend]
        requirements: []
        depends_on: [F15.2]
        intent: >
          How often reading needs correcting, by shop and over time, measured from what users
          actually changed. It shows whether the trust work is working, and gives the diploma
          defence a number rather than a claim.
        demo: >
          Open the accuracy panel and read that 4 of the last 20 receipts needed a correction,
          all from one shop, and that the share fell after corrections began to stick.
        tasks:
          - key: F15.4.1
            title: Accuracy figures from corrections
            labels: [backend]
            detail: >
              Count receipts and lines changed after reading, per merchant and per month, from the
              stored corrections and mismatch fixes.
          - key: F15.4.2
            title: Accuracy panel
            labels: [frontend]
            detail: >
              A panel in Preferences showing the share of receipts corrected, the shops behind
              them and the trend.

  - key: E16
    title: Personal Price History
    br: []
    phase: 2
    scope: diploma
    groomed: true
    summary: >
      Every receipt holds unit prices, and no app on the market uses them for the person who
      paid: banks never see a price, and receipt scanners stop at totals per category. The
      user's own receipts are enough to show how the price of what they buy is moving and
      where they pay less for the same thing, and those are the most concrete savings advice
      can name. This is personal, from one user's receipts only; aggregating across users is
      E13 and stays out of scope.
    features:
      - key: F16.1
        title: One product across receipts
        labels: [backend, frontend]
        requirements: []
        depends_on: [F3.5, F5.2]
        intent: >
          The same product printed differently on different receipts and shops ("Jogurt Natural
          330ml", "JOG NAT 330ML") is one product for that user, with a way to merge or split
          what was matched wrongly. Price history means nothing without it.
        demo: >
          Open the products list and see one "Jogurt naturalny 330 ml" bought 9 times across two
          shops; merge in a line the matcher missed and split one it got wrong.
        tasks:
          - key: F16.1.1
            title: Product model and matcher
            labels: [backend, database, ai]
            detail: >
              A per-user product entity, line items linked to it, and a matcher that normalises
              names, sizes and units, behind a port so a model can help with ambiguous names.
          - key: F16.1.2
            title: Products list with merge and split
            labels: [frontend]
            detail: >
              A products screen listing what the user buys, with merge and split of wrongly
              matched lines.
      - key: F16.2
        title: Exploring what I buy
        labels: [backend, frontend]
        requirements: []
        depends_on: [F16.1]
        intent: >
          The user picks one product or several ("chips and croutons") and a period, and sees how
          often they bought them, how much — in pieces, or kilograms and litres where the receipt
          gives a size — what it cost, and how that went month by month; for each product, what it
          cost in each shop and how much more one shop charged than another; and for one product,
          how its price moved. A selection can be saved under a name and opened again. Only the
          user's own receipts (N2). Lives as a "Products" tab beside categories on Statistics.
        demo: >
          Pick "Chipsy Lay's 140 g" and "Sucharki 150 g", this month: bought 7 times, 0.98 kg,
          41.30 PLN, more than last month; Lay's cost 6.99 at Biedronka and 8.49 at Żabka, 1.50
          (21%) more; save the selection as "Snacks" and open it next month.
        tasks:
          - key: F16.2.1
            title: Purchases of a selection over a period
            labels: [backend]
            detail: >
              Endpoint taking product ids and a period (whole days, inclusive, ADR-0012): times
              bought, quantity in pieces and in kg/l where known (never adding pieces to kilograms),
              amount spent, and the same per calendar month; for each product, each purchase's unit
              price (per kg/l where known) with its shop and date, and the change over the period.
              The caller's own receipts only, with a cross-user test (N2).
          - key: F16.2.2
            title: Price per shop
            labels: [backend]
            detail: >
              For each selected product bought in more than one shop within the period: its average
              and latest unit price per shop, the cheapest shop, and how much more each other shop
              charged, absolute and in percent. Shops grouped ignoring case and spacing. Products
              of different sizes are compared per kg/l, or not at all when no size is known.
          - key: F16.2.3
            title: Saved selections
            labels: [backend, database, frontend]
            detail: >
              Save a selection of products under a name per user, rename it, delete it; a product
              merged or split later (F16.1) keeps the selection pointing at what the user meant.
              Cross-user test (N2).
          - key: F16.2.4
            title: Products tab on Statistics
            labels: [frontend]
            detail: >
              A "Products" tab beside categories on Statistics: search products by name, tick one
              or several, pick the period with the existing period control; totals, month-by-month
              bars, a price-per-shop table and, for one product, the unit-price chart coloured by
              shop with the change stated in words. Saved selections one tap away. Checked at 375,
              768 and 1280 px; on a phone the shop table becomes stacked rows.
      - key: F16.3
        title: Where it costs less
        labels: [backend, frontend]
        requirements: []
        depends_on: [F16.2]
        intent: >
          Without the user asking, products bought in more than one shop say where the user
          recently paid less and by how much, only from their own receipts and only when both
          prices are recent enough to compare.
        demo: >
          The products list says "cheaper at Lidl" next to five products, with the difference per
          unit, and none for a product last bought at Lidl a year ago.
        tasks:
          - key: F16.3.1
            title: Cheaper shop for every product
            labels: [backend]
            detail: >
              Using the price-per-shop comparison of F16.2.2, find the cheaper shop for each of the
              user's products, counting only prices within a freshness window, and report the
              difference per unit.
          - key: F16.3.2
            title: Cheaper-shop marks
            labels: [frontend]
            detail: >
              Mark products with a cheaper shop in the products list and in the Products tab.
      - key: F16.4
        title: Price signals in advice
        labels: [backend, ai]
        requirements: [F2, F4]
        depends_on: [F16.3, F8.5]
        intent: >
          Price rises and cheaper shops become evidence advice can cite, so a recommendation can
          say "buy it at Lidl" with a saving computed from the user's own prices, not asserted.
        demo: >
          Ask for advice on a spending ceiling and read "Buy Jogurt naturalny at Lidl: 0.80 less
          each, about 7 PLN a month at your rate".
        tasks:
          - key: F16.4.1
            title: Price evidence in goal analysis
            labels: [backend]
            detail: >
              Add price rises and cheaper shops for the goal's products to the analysis the
              advice model reads.
          - key: F16.4.2
            title: Saving from a shop switch
            labels: [backend]
            detail: >
              Compute the monthly saving of buying a product in the cheaper shop from the price gap
              and the user's purchase rate, the same way projected impact is computed for F8.5.

  - key: E17
    title: Landing, Search and Analytics
    br: []
    phase: 2
    scope: diploma
    groomed: true
    summary: >
      The product has no public face and no way to tell whether anyone comes: the only page
      before signing in is a short welcome under a hosting address nobody remembers, search
      engines cannot read a client-rendered app, and nothing counts visitors, sign-ups or who
      stays. This epic gives the service a memorable free address and a landing page that
      explains it, makes accounts trustworthy and the user's data rights real (F17.8, F17.9)
      before anyone is invited in, then measures traffic and use without cookies — before anything is done to
      bring visitors, so each later step can be judged by its effect — adds an interactive demo
      on sample data and short how-to videos, makes it findable by search engines, and
      publishes the privacy policy, terms and cookie consent. Nothing here is bought: a domain and advertising wait for traffic (E19).
    features:
      - key: F17.1
        title: A name worth remembering
        labels: [infra]
        requirements: []
        depends_on: [F0.9]
        intent: >
          The service is served at budget-agent.web.app instead of the project-derived hosting
          address, for free. A Firebase site name cannot change, so a new site is created and the
          old address redirects to it, path and query kept; everything that names the address —
          CORS, links, documentation — follows.
        demo: >
          Open budget-agent.web.app and sign in; open the old address with a path and land on the
          same page at the new one.
        tasks:
          - key: F17.1.1
            title: New hosting site with a redirect from the old one
            labels: [infra]
            detail: >
              A second Firebase Hosting site in Terraform as the one deployed to, the old site
              kept serving only a permanent redirect, the Deploy workflow and FIREBASE_SITE_ID
              switched, CORS and deployment documentation updated. Fails safe if the name is
              already taken by another project.
      - key: F17.2
        title: Landing page that explains the product
        labels: [frontend, design]
        requirements: []
        depends_on: [F9.9, F17.1, F20.3, F20.5]
        intent: >
          A visitor learns in one screen what the service does — receipts read from a photo,
          spending by category and product, goals with advice from their own purchases,
          households, trips — a holiday's budget, a business trip settled with its per diem —
          and finds the way to try it or sign up. Served as prerendered HTML, so
          search engines and link previews see the content without running the app; in
          English, Ukrainian and Polish.
        demo: >
          Open the site logged out on a phone: a hero with the promise and a "Try the demo"
          button, sections per feature with real screens, a short FAQ, and the same page in
          Ukrainian and Polish at their own addresses.
        tasks:
          - key: F17.2.1
            title: Landing content and design
            labels: [frontend, design]
            detail: >
              Sections for the main features with screens from the product, a FAQ and calls to
              action, written in all three languages through the locales, designed against
              docs/design and checked at 375, 768 and 1280 px.
          - key: F17.2.2
            title: Prerendered public pages per language
            labels: [frontend, infra]
            detail: >
              Build the landing and the other public pages as static HTML at build time, one
              address per language, so they render without JavaScript; the app takes over after
              load. Lighthouse performance and accessibility at least 90 on a phone.
      - key: F17.3
        title: Knowing who comes and who stays
        labels: [backend, frontend, infra]
        requirements: []
        depends_on: [F17.2, F17.8, F17.9]
        intent: >
          The author can see whether the service has an audience, from analytics of its own
          rather than a third party's: visitors to the public pages and where they come from,
          counted without cookies or any identifier, so no consent is needed and no other
          origin's script loads (F17.7.2); and for signed-in users, a record of what they do —
          signing up, confirming the address, signing in, uploading and reading receipts,
          exporting — kept 12 months for running and supporting the service (legitimate
          interest, art. 6(1)(f)), never the content of a receipt. Read on a dashboard for
          admins: sign-ups, confirmations, active users by week and month, who returns, the
          path from visit to first receipt.
        demo: >
          Open the admin dashboard and read last week's visits to the landing page by source,
          3 sign-ups of which 2 confirmed, 2 users active this week, 1 returning from last week,
          14 receipts uploaded and 12 read.
        tasks:
          - key: F17.3.1
            title: What signed-in users do
            labels: [backend, database]
            detail: >
              An activity table — user, event, when, and nothing more — written for signing up,
              confirming the address, signing in, uploading a receipt, a receipt read and an
              export; owned by the user, so the full export (F17.9.2) carries it and account
              deletion removes it; events older than 12 months pruned daily; ADR-0020 and the
              privacy policy saying what is recorded, why and for how long.
          - key: F17.3.2
            title: Visits to the public pages without an identifier
            labels: [backend, frontend, security]
            detail: >
              The public pages tell the API "a view of this page, from this source" (referrer
              domain, utm_source) — no IP kept, no cookie, nothing stored on the device —
              counted per day, page and source; rate-limited, bots by user agent left out; a
              test that nothing identifying a visitor is stored, and lint:privacy still passing.
          - key: F17.3.3
            title: Metrics dashboard for admins
            labels: [backend, frontend, security]
            detail: >
              An admin-only endpoint and page: visits by page and source, sign-ups and
              confirmations per day, weekly and monthly active users, returning users, receipts
              uploaded and read, and the path from visit to first receipt, over a chosen period;
              refused to anyone but an admin, with a test. Checked at 375, 768 and 1280 px.
      - key: F17.4
        title: Interactive demo on sample data
        labels: [backend, frontend]
        requirements: []
        depends_on: [F17.2, F16.2]
        intent: >
          A visitor clicks through the real screens — month, categories, products and prices,
          a goal with its advice — filled with a realistic sample household, without an
          account and without a single model call, and is invited to sign up from it. Nothing
          a visitor does in the demo is stored or reaches another user's data.
        demo: >
          Press "Try the demo" on the landing page: the dashboard opens on a sample month with a
          "This is a demo" banner; open products, compare a price between shops, open a goal's
          advice; nothing can be uploaded or saved, and "Create an account" is one tap away.
        tasks:
          - key: F17.4.1
            title: Sample data and a read-only demo session
            labels: [backend, security]
            detail: >
              A fixed sample account built from anonymised receipts, reachable through a
              short-lived read-only demo session that refuses every write and every model call,
              rate limited per client. Tests that the demo can neither write nor read real users'
              data (N2).
          - key: F17.4.2
            title: Demo mode in the app
            labels: [frontend]
            detail: >
              Entering the demo from the landing page, a banner saying it is a demo, writes
              disabled with a reason, and sign-up offered from it. Checked at 375, 768 and 1280 px.
      - key: F17.5
        title: How-to videos
        labels: [frontend, design]
        requirements: []
        depends_on: [F17.4]
        intent: >
          Short videos show the main flows on the real app with the sample data — photographing
          a receipt, fixing a doubtful line, watching a product's price, setting a goal — with
          captions in each language, recorded by script so they can be made again when the
          screens change.
        demo: >
          Play "Upload a receipt" on the landing page: 30 seconds from the photo to the month,
          captioned in the page's language, without loading anything until played.
        tasks:
          - key: F17.5.1
            title: Scripted recordings of the main flows
            labels: [frontend]
            detail: >
              Browser-automation scripts that drive the demo and record each flow at phone and
              desktop size; captions per language; output small enough for the landing page.
          - key: F17.5.2
            title: Videos on the landing page
            labels: [frontend]
            detail: >
              Embed the videos with a poster image, loaded only when played, with captions and a
              text alternative.
      - key: F17.6
        title: Found by search engines
        labels: [frontend, infra]
        requirements: []
        depends_on: [F17.3]
        intent: >
          Search engines can find, read and present the service: they are told what to crawl
          and what not to, the public pages carry titles, descriptions and previews, each
          language is linked to the others, and the site is registered with Google Search
          Console as a URL-prefix property, which a web.app address allows. The signed-in app is
          never indexed. Comes after analytics, so the effect of being indexed can be measured.
        demo: >
          Search Console shows the landing page in three languages indexed with no coverage
          errors; sharing the link in a messenger shows the title, description and image.
        tasks:
          - key: F17.6.1
            title: robots.txt, sitemap and page metadata
            labels: [frontend]
            detail: >
              robots.txt allowing the public pages and excluding the app and the API, a
              sitemap.xml of the public pages per language, titles, descriptions, canonical and
              hreflang links, Open Graph and Twitter cards, and SoftwareApplication structured
              data; Lighthouse SEO at least 90.
          - key: F17.6.2
            title: Search Console verification
            labels: [infra]
            detail: >
              Verify budget-agent.web.app in Google Search Console as a URL-prefix property
              through an HTML file or meta tag, submit the sitemap, and document how to read its
              reports.
      - key: F17.7
        title: Privacy policy, terms and cookie consent
        labels: [frontend, security]
        requirements: []
        depends_on: [F17.2]
        intent: >
          The service states what it collects and why and the terms it is offered under, in all
          three languages, linked from every public page and from sign-up. The website keeps on
          the device only what is strictly needed — the session, and choices the user made
          (theme, language, a list's period) — and loads nothing from third parties, so under
          ePrivacy it asks no consent, and a consent banner with nothing to ask would only train
          people to click through. A check in CI keeps it so: the day anything needing consent
          arrives, the build fails until it comes with its banner — on the website with AdSense
          (F19.3), in the app through Google's UMP (F19.4.1). Analytics (F17.3) stays cookieless
          and needs none. Wording to be checked against the E18 legal investigation.
        demo: >
          Open the landing page on a phone: no banner, no cookie set; "Privacy" in the footer
          opens the policy in the page's language, which says what is kept on the device and
          why no consent is asked.
        tasks:
          - key: F17.7.1
            title: Privacy policy and terms pages
            labels: [frontend]
            detail: >
              The privacy policy and terms pages at /privacy and /terms, drafted in F17.9.4 from
              the record of processing (ADR-0020) and already linked from sign-up and Profile:
              their wording checked and completed (cookieless analytics, the consent choice),
              prerendered like the landing, and linked from the footer of every public page.
              Checked at 375, 768 and 1280 px.
          - key: F17.7.2
            title: Nothing that needs consent, kept so by CI
            labels: [frontend, security]
            detail: >
              A check run in CI that fails when the built site or the client's source loads a
              script, style, font or image from another origin, sets a cookie, or writes to the
              device's storage under a key not on the list of strictly needed ones; the list and
              why each entry is exempt in the privacy policy and ADR-0020. The consent banner
              itself moves to F19.3, where AdSense first needs it.

      - key: F17.8
        title: Trusted accounts
        labels: [backend, frontend, infra, security]
        requirements: []
        depends_on: [F17.2]
        intent: >
          An account belongs to a real address its owner can read: sign-up sends a link that
          confirms it, a forgotten password is reset and an address changed through a link sent
          to it, and throwaway or non-existent addresses are refused at sign-up. Until the
          address is confirmed the user may look around but not upload receipts, forward them by
          email or invite to a household. Mail goes out through App Engine's Mail API from
          noreply@<project>.appspotmail.com — free and needing no domain — behind a port, so a
          provider such as Resend replaces it once a domain is bought (E19); Google recommends
          moving off the legacy Mail API to SMTP providers, which the port makes a one-adapter
          change.
        demo: >
          Sign up with a fresh address and find the confirmation letter; before following it the
          upload button explains why it waits; follow it and upload. Ask for a password reset and
          sign in with the new password. Try a mailinator address and a misspelt domain: both
          are refused with a reason.
        tasks:
          - key: F17.8.1
            title: Outgoing email
            labels: [backend, infra]
            detail: >
              An EmailSender port with an App Engine Mail adapter (the existing mail relay app,
              or a send endpoint beside it) and a stub for tests; letters in English, Ukrainian
              and Polish in the user's language; the daily quota checked in the project's console
              and recorded in an ADR with the fallback provider; sending failures logged and
              retried, never failing the request that caused them.
          - key: F17.8.2
            title: Email confirmation
            labels: [backend, frontend, security]
            detail: >
              A confirmed flag on the user; a single-use signed link valid 24 hours sent on
              sign-up and on request, rate-limited; until confirmed, uploads, forwarded receipts
              and household invites are refused with a problem code the UI explains beside a
              banner offering to resend. Accounts created before this are marked confirmed by
              the migration. Checked at 375, 768 and 1280 px.
          - key: F17.8.3
            title: Password reset and email change
            labels: [backend, frontend, security]
            detail: >
              Forgot-password sends a single-use link valid one hour, the same answer whether the
              address is known or not; setting a new password ends every session. Changing the
              address sends a link to the new one and only then switches it, telling the old one.
              Checked at 375, 768 and 1280 px.
          - key: F17.8.4
            title: Refusing throwaway and undeliverable addresses
            labels: [backend, security]
            detail: >
              Sign-up and address change refuse domains on the open disposable-email-domains list,
              kept in the repository with a script that refreshes it, and domains without an MX
              (or A) record; each refusal with its own problem code and words in three languages.
              No third-party validation service: no address leaves the service at sign-up.

      - key: F17.9
        title: Data rights and retention
        labels: [backend, frontend, infra, security]
        requirements: [N6]
        depends_on: [F17.2]
        intent: >
          What GDPR requires before the service is offered to the public and before payments
          (E18): a user can take everything held about them and delete their account with all of
          it; receipt photos are kept 90 days — compressed when stored — and then deleted by the
          storage itself, while the figures read from them stay; export files are deleted after
          7 days; the acceptance of the terms is recorded at sign-up; and what is processed, why,
          where and by whom — Google Cloud in the US, under the Data Privacy Framework and the
          Cloud DPA — is written down for the privacy policy (F17.7) to state. Replaces F10.7,
          which sat in an epic out of the diploma's scope.
        demo: >
          Download everything from the profile and open the archive; delete the account, then
          fail to sign in and find no photo left in storage. Open a receipt older than 90 days:
          its lines and totals are there, and the photo is marked as removed after 90 days.
        tasks:
          - key: F17.9.1
            title: Account deletion
            labels: [backend, frontend, security]
            detail: >
              Deleting the account, confirmed with the password, removes the user and everything
              theirs — receipts with their photos, trips, goals, advice, categories and rules,
              products, exports, upload jobs — and their place in a household: an owner leaving
              hands it to another member, the last one dissolves it. Sign-in fails afterwards;
              tests prove nothing of the user is left. Checked at 375, 768 and 1280 px.
          - key: F17.9.2
            title: Full data export
            labels: [backend, frontend]
            detail: >
              One archive of everything held about the user — profile, receipts with lines,
              trips, goals and advice, categories and rules, products, household membership — as
              JSON, with the photos still kept, through the export jobs of F7.6. Checked at 375,
              768 and 1280 px.
          - key: F17.9.3
            title: Photo retention and compression
            labels: [backend, frontend, infra]
            detail: >
              Bucket lifecycle rules in Terraform deleting receipts/ objects after 90 days and
              exports/ after 7; photos re-encoded on upload to about 2000 px JPEG after reading;
              a receipt whose photo is gone says so instead of a broken image, and a business
              trip warns before its photos expire. The settlement PDF is still produced after:
              the summary and totals unchanged, no page for a photo that is gone — no
              placeholder — and its receipt marked "photo removed after 90 days" in the list, as
              a typed-in expense is marked "no receipt"; with every photo gone it is the summary
              alone. Checked at 375, 768 and 1280 px.
          - key: F17.9.4
            title: Terms acceptance and the record of processing
            labels: [backend, frontend, docs]
            detail: >
              Sign-up requires accepting the terms and privacy policy, storing when and which
              version; an ADR listing the personal data held, its purpose, legal basis, storage
              location, retention and processors (Google Cloud, Vertex AI, Firebase), and the
              transfer to the US, for the privacy policy to rest on. Checked at 375, 768 and
              1280 px.

      - key: F17.10
        title: Help and contact
        labels: [frontend, backend]
        requirements: []
        depends_on: [F17.2, F17.8]
        intent: >
          A user with a question finds the answer without leaving the product, and when there is
          none, writes to the people running it. A help page answers the usual questions by
          area — receipts, categories, goals, the household, trips and per diem, exports, the
          account and its data — in all three languages, public and prerendered like the
          landing, linked from the header, the account menu and the footer. A contact form
          sends the message to the administrators by the outgoing mail of F17.8, so no address
          is published and no domain is needed.
        demo: >
          Open Help from the account menu on a phone, find how a business trip's per diem is
          counted, then send a question through the form and see it arrive in the
          administrators' inbox with the sender's address to reply to.
        tasks:
          - key: F17.10.1
            title: Help page
            labels: [frontend]
            detail: >
              /help with questions and answers grouped by area, each answer linkable, in three
              languages through the locales, prerendered with the public pages, linked from the
              header, the account menu, the phone's profile menu and the footer. Checked at 375,
              768 and 1280 px.
          - key: F17.10.2
            title: Contact form
            labels: [backend, frontend, security]
            detail: >
              A form — reply address (filled in for a signed-in user), topic, message — whose
              submission is mailed to the administrators (admin_emails) through the EmailSender
              port, rate-limited per address and IP, with a honeypot field against bots and a
              length limit; the sender gets a copy confirming it was received. Checked at 375,
              768 and 1280 px.
      - key: F17.11
        title: The public site in the new design
        labels: [frontend]
        requirements: []
        depends_on: [F17.2, F17.10, F23.2]
        intent: >
          The landing and Help still show the first design and the app as it was before E23:
          old screens, old paths (Profile, Categories, Receipts) and Polish shops and złoty
          on the front page. The product is for any country, so the public pages say nothing
          tied to one: amounts follow the visitor's language, shops are generic. The landing
          follows variant C of the design canvas — a large headline over three phones showing
          the real screens, "one total vs every line", three steps, a tabbed "see what you can
          do" over Home, Spending, Products and Plan, the features, a free card, questions
          and a closing call. Help becomes something to use, not to read through: a search,
          the app in four steps, topics that filter the answers, each answer saying where in
          the app the thing is, and the contact form beneath.
        demo: >
          On a phone, open the landing, tap through Home, Spending, Products and Plan in "see
          what you can do", then open Help, search "rent" and follow the answer to Plan ›
          Regular bills; switch the language to Polish and see both pages in it.
        tasks:
          - key: F17.11.1
            title: Landing in the new design
            labels: [frontend]
            detail: >
              The landing rebuilt after the canvas's "Landing C" (docs/design/v2.md):
              hero with three phones drawn with the app's own ring, colours and rows on sample data,
              "most apps see one total, Budget Agent sees every line", three steps, the tabbed
              Home / Spending / Products / Plan showcase, six feature cards, the free plan, the
              questions and the closing call, in the v2 tokens and palette. No country, shop or
              currency is named; sample amounts are formatted for the page's language. All text
              through the locales in en, uk and pl, still prerendered with its title,
              description and previews per language. Checked at 375, 768 and 1280 px.
          - key: F17.11.2
            title: Help that is easy to use
            labels: [frontend]
            detail: >
              /help rebuilt after the canvas's "Help" (docs/design/v2.md): a search over
              questions and answers, "the app in four steps" (add a receipt, check what was
              read, see where it went, plan the month), topic cards that filter the answers
              (receipts, spending, products, income and bills, goals, household, holidays and
              trips, account and data), answers rewritten for the app as it is now, each with
              where it lives ("Plan › Regular bills"), each still linkable, and the contact form
              of F17.10.2 beneath. Three languages, prerendered. Checked at 375, 768 and 1280 px.

  - key: E18
    title: Subscriptions and Payments
    br: []
    phase: 2
    scope: out-of-scope
    groomed: true
    summary: >
      Payments stay out of the diploma's scope, but plans (F18.2), what a plan gives (F18.4) and
      the admin console that grants them (F18.6) are in it. A free account reads ten receipts a
      month (and, once E19 brings them, sees ads). Paying
      raises the limit, and removes ads when there are any, priced from what a receipt read actually costs, so the service covers
      its model calls. The author sells through a Polish sole-proprietorship (JDG); how that
      may lawfully take card payments for a subscription — VAT on EU consumers, invoices and
      receipts, consumer withdrawal rights, the terms — is investigated before any code, and
      the payment provider is chosen from it. Payments run in the provider's test mode until
      the legal checklist is closed. Out of the diploma's scope while traffic is unproven: it
      needs paid services and legal work the author will not spend on before there are users.
    features:
      - key: F18.1
        title: Selling a subscription as a Polish JDG
        labels: [docs]
        requirements: []
        depends_on: []
        intent: >
          What a JDG must have and do to sell a monthly subscription to consumers in Poland and
          the EU: where the money is paid out to, VAT for EU consumers (OSS) or a merchant of
          record taking it on, invoices and receipts (including whether a cash register is
          required for online payments, and KSeF), the consumer's right of withdrawal for a
          digital service, and what the terms must say. Answered with sources in an ADR and a
          checklist for the author's accountant; not legal advice.
        demo: >
          Read the ADR: it recommends selling directly or through a merchant of record, lists
          what the JDG needs (business bank account, VAT registration status, documents), and
          the open points for the accountant.
        tasks:
          - key: F18.1.1
            title: Legal and tax investigation
            labels: [docs]
            detail: >
              Research the questions above from official sources (podatki.gov.pl, EU OSS, UOKiK,
              the act on providing services electronically) and the providers' own terms; write
              the ADR with sources and the accountant checklist.
          - key: F18.1.2
            title: Choose the payment provider
            labels: [docs]
            detail: >
              Compare a direct processor (Stripe) with merchants of record (Paddle, Lemon
              Squeezy) on fees, VAT handling, payout to a Polish account, JDG eligibility,
              Polish payment methods (BLIK, Przelewy24) and test mode; record the choice in an ADR.
      - key: F18.2
        title: Plans and prices
        labels: [backend, docs]
        scope: diploma
        requirements: []
        depends_on: [F10.6]
        intent: >
          Plans priced from what a receipt read costs: the free plan keeps its limit (and the ads
          E19 may bring); a paid plan raises the limit and is ad-free; a larger one raises it further. The
          figures — cost per read, limits, prices, margin — are worked out and recorded, and the
          plans live in configuration, not code.
        demo: >
          Read the pricing ADR: cost per read from the model's measured tokens, three plans with
          limits and prices, and the margin at each.
        tasks:
          - key: F18.2.1
            title: Cost per read and the plans
            labels: [docs]
            detail: >
              Measure tokens per receipt read and per advice call, cost them at the model's
              prices and the hosting costs, and set the plans' limits and prices in an ADR.
          - key: F18.2.2
            title: Plans in configuration
            labels: [backend]
            detail: >
              Plans with their monthly receipt limit and ad-free flag in settings, replacing the
              single free limit: free (10 reads a month) and a paid plan (200), more added by
              configuration; the free plan unchanged for existing accounts.
      - key: F18.3
        title: Paying for a subscription
        labels: [backend, frontend, security]
        requirements: []
        depends_on: [F18.1, F18.2]
        intent: >
          A user subscribes, changes plan or cancels through the provider's hosted checkout and
          customer portal — card details never touch the service — and the service learns of
          every change from the provider's signed webhooks, idempotently, so a retried or late
          event never double-charges or misstates a plan.
        demo: >
          In test mode, choose the paid plan, pay with the provider's test card on its checkout
          page, return to the app with the plan active; cancel in the portal and see it end at
          the period's close.
        tasks:
          - key: F18.3.1
            title: Checkout and customer portal
            labels: [backend, frontend]
            detail: >
              Endpoints creating a checkout session and a portal session for the signed-in user,
              behind a port so the provider can be swapped; test keys only in development and
              CI; secrets in Secret Manager.
          - key: F18.3.2
            title: Signed webhooks and subscription state
            labels: [backend, database, security]
            detail: >
              A webhook endpoint verifying the provider's signature, storing each event once,
              and keeping the user's subscription — plan, status, period end — current; tests
              for replayed, out-of-order and forged events, and a cross-user test (N2).
      - key: F18.4
        title: What a plan gives
        labels: [backend, frontend]
        scope: diploma
        requirements: []
        depends_on: [F18.2]
        intent: >
          The plan sets the month's receipt limit and whether ads may show (E19). Until payments
          exist (F18.3) a paid plan is one an admin granted for a time (F18.6); then a
          subscription gives it the same way. A plan that ends — a grant past its date, a
          cancelled subscription past its period — leaves the free plan.
        demo: >
          Granted the paid plan for a month, the profile shows 200 receipts a month until the
          grant's end date; the day after, 10 again.
        tasks:
          - key: F18.4.1
            title: Limits and ads from the plan
            labels: [backend]
            detail: >
              The receipt quota (F10.6) and an ad-free flag on the user read from the active
              plan, falling back to free at period end.
          - key: F18.4.2
            title: Plan on the profile
            labels: [frontend]
            detail: >
              The current plan, its limit and its end date on Profile, and the provider's portal
              link once payments exist (F18.3). Checked at 375, 768 and 1280 px.
      - key: F18.5
        title: Pricing page
        labels: [frontend]
        requirements: []
        depends_on: [F18.2, F17.2]
        intent: >
          A public page comparing the plans in each language, from the same configuration the
          service enforces, leading signed-out visitors to sign up and signed-in ones to
          checkout.
        demo: >
          Open "Pricing" from the landing page on a phone: three plans side by side as stacked
          cards, the current plan marked when signed in.
        tasks:
          - key: F18.5.1
            title: Plans comparison page
            labels: [frontend]
            detail: >
              Public, prerendered pricing page per language from the plans endpoint, with
              calls to action by state. Checked at 375, 768 and 1280 px.
      - key: F18.6
        title: Admin console
        labels: [backend, frontend, security]
        scope: diploma
        requirements: [N2]
        depends_on: [F17.3, F18.2, F17.8]
        intent: >
          Running the service without touching the database: super admins (the author and his
          wife, named in configuration) appoint and remove admins, and only they can; every admin
          signs in with a second factor, which any user may also turn on for their own account; admins find a user by address and see their account —
          whether confirmed, when they signed up and were last active, the month's reads, the
          plan and until when, recent activity — never their receipts (N2); and act for them:
          confirm the address, send the confirmation or a password reset link, grant a paid plan
          for a time or take it back. Every admin action is recorded, who did what to whom.
        demo: >
          Sign in as a super admin with the authenticator code, make a user an admin, grant
          another the paid plan until next month and see it on their profile; read both actions
          in the admin log.
        tasks:
          - key: F18.6.1
            title: Roles and two-factor sign-in
            labels: [backend, frontend, security]
            detail: >
              Super admins from configuration (admin_emails), admins as a role stored on the user,
              granted and removed only by a super admin; a TOTP second factor (authenticator app,
              set up by QR code, with 10 single-use recovery codes) that any user may turn on in
              Preferences and that every admin must have — an admin without it is asked to set it
              up before any admin page opens — switched off by a setting for local work; a letter
              to the admin on each admin sign-in; tests that an admin cannot appoint anyone and
              that a password alone never opens an admin session. Checked at 375, 768 and 1280 px.
          - key: F18.6.2
            title: Users and support actions
            labels: [backend, frontend]
            detail: >
              The users list with search by address and filters (confirmed, plan, active), the
              user's card with account facts, usage and recent activity (F17.3.1) but nothing of
              their receipts, and the actions: confirm the address, resend the confirmation, send
              a password reset link (F17.8.3). Checked at 375, 768 and 1280 px.
          - key: F18.6.3
            title: Granted plans and the admin log
            labels: [backend, frontend, database]
            detail: >
              Plan grants — user, plan, from, until, who granted, why — made, extended and taken
              back from the user's card, the active one setting the plan (F18.4); an admin log of
              every admin action, read by super admins; ADR-0020 listing the admin log. Checked at
              375, 768 and 1280 px.

  - key: E19
    title: Advertising
    br: []
    phase: 2
    scope: diploma
    groomed: true
    summary: >
      Advertising is how the free plan pays for itself. In the Android app (E22) it needs no
      domain: AdMob ties ads to the app in Google Play, with app-ads.txt on the web.app site
      the listing names. Free accounts see an unobtrusive banner, and once the month's ten
      receipt reads are used up, can watch a rewarded ad for one more — a view earns more than
      a read costs (about $0.005-0.02 against $0.001-0.005), and the user chooses it. Ads on
      the website still need a domain of the service's own (AdSense wants ads.txt at a
      domain's root), so F19.1 and F19.3 wait, out of the diploma's scope, for traffic. Taken
      on with E22, after F17.7, whose consent covers ads.
    features:
      - key: F19.1
        title: The service's own domain
        labels: [infra]
        scope: out-of-scope
        requirements: []
        depends_on: [F17.3]
        intent: >
          Once traffic justifies it, the service moves to a domain of its own, bought by the
          author, with HTTPS and the API under the same name; budget-agent.web.app redirects to it.
        demo: >
          Open the service at its own domain over HTTPS; the web.app address redirects to it.
        tasks:
          - key: F19.1.1
            title: Domain on hosting and API, in Terraform
            labels: [infra]
            detail: >
              Point the domain at Firebase Hosting and the API at Cloud Run through Terraform,
              with managed certificates; redirect the web.app address; update CORS, Search
              Console (as a domain property) and the deployment documentation.
      - key: F19.4
        title: Ads in the Android app
        labels: [frontend, infra]
        requirements: []
        depends_on: [F22.2, F17.7]
        intent: >
          AdMob in the app for accounts without an ad-free plan: one banner of reserved size at
          the foot of the dashboard and statistics, never in the upload flow, a dialog or a
          form, shown only after the EEA consent Google's UMP SDK asks for (personalised or not,
          as chosen). app-ads.txt is served from budget-agent.web.app, the site the Play listing
          names.
        demo: >
          In the app on a free account, accept or refuse ad consent, then scroll the dashboard
          to its foot: one banner that did not shift the page; none on an admin account.
        tasks:
          - key: F19.4.1
            title: AdMob account, app-ads.txt and consent
            labels: [infra]
            detail: >
              The AdMob account under the business, the app registered, app-ads.txt on Firebase
              Hosting, the UMP consent form in three languages with the choice changeable from
              Profile; the record of processing (ADR-0020) and /privacy updated for ads.
          - key: F19.4.2
            title: Banner placements
            labels: [frontend]
            detail: >
              Reserved-size banner slots in the app only (never on the web build), hidden for
              admins and ad-free plans, and a test that no slot appears in the upload flow or
              any dialog. Checked on a phone and a tablet.
      - key: F19.5
        title: One more receipt for a rewarded ad
        labels: [backend, frontend, security]
        requirements: []
        depends_on: [F19.4, F10.6]
        intent: >
          When the month's receipt reads are used up, the upload screen offers "Watch a short ad
          for one more receipt" instead of only saying when the limit resets. The extra read is
          granted by the server only when AdMob's server-side verification callback confirms the
          ad was watched — signed by Google, checked against its public keys, each reward once
          — so it cannot be claimed by calling the API. A daily cap keeps it bounded.
        demo: >
          On an account at its limit, press "Watch an ad for one more receipt", watch it, and
          upload a receipt; the quota shows the extra read was used.
        tasks:
          - key: F19.5.1
            title: Verified rewards in the quota
            labels: [backend, security]
            detail: >
              A public SSV callback endpoint verifying Google's signature and refusing a
              transaction id seen before; earned reads stored per account and day and counted by
              the quota (F10.6) after the monthly ones; a daily cap as a setting; tests of a
              forged, replayed and over-cap reward.
          - key: F19.5.2
            title: Rewarded ad on the upload screen
            labels: [frontend]
            detail: >
              The offer at the limit in the app only, the rewarded ad loaded and shown, the
              quota re-read after the reward; what the web build says instead. Checked on a phone
              and a tablet.
      - key: F19.3
        title: Advertising on the website
        labels: [frontend, infra]
        scope: out-of-scope
        requirements: []
        depends_on: [F19.1, F17.7]
        intent: >
          Google AdSense shows ads on the public pages and in one or two places in the app that
          never sit inside a task — never in the upload wizard, a dialog or a form — and only
          for accounts whose plan is not ad-free (F18.4). Ads respect consent, do not shift the
          layout as they load, and fit a phone.
        demo: >
          Signed in on the free plan, scroll the dashboard to its foot and see one ad block that
          did not move the page as it loaded; on a paid account the block is not there.
        tasks:
          - key: F19.3.1
            title: AdSense account, site approval and consent
            labels: [infra, frontend]
            detail: >
              Create the AdSense account for the business, add ads.txt at the domain's root,
              request site approval, and document the policies the placements must keep to; the
              consent banner moved here from F17.7.2 — a Google-certified consent platform with
              accept, reject and per-purpose choices in three languages and Consent Mode v2, no
              ad script before consent, the choice changeable from the privacy page.
          - key: F19.3.2
            title: Ad placements
            labels: [frontend]
            detail: >
              Reserved-size ad slots on the landing page and at the foot of the dashboard and
              statistics, loaded after consent, hidden for an ad-free plan, and a test that no
              slot appears in the upload wizard or any dialog. Checked at 375, 768 and 1280 px.


  - key: E20
    title: Trips
    br: []
    phase: 2
    scope: diploma
    groomed: true
    summary: >
      A trip is spending with a shape of its own — a week in Egypt, a weekend in the mountains,
      a client visit in Berlin — that a month's total hides. A user marks a trip, and its
      receipts gather on it, foreign ones already converted at NBP rates (ADR-0016). A personal
      trip is the user's own money: it stays in the month, shown apart, with a budget of its own
      and what it cost by day and category. A business trip is the employer's money: it stays
      out of the personal budget, and the service works out the per diem owed under Polish rules
      and produces the settlement to hand in — the service's small step towards business use,
      without accounts for companies. One kind of record serves both; only how a trip counts
      and what comes with it differ.
    features:
      - key: F20.1
        title: Trips and their receipts
        labels: [backend, frontend, database]
        requirements: []
        depends_on: [F3.9, F11.7]
        intent: >
          A user records a trip — personal or business, a name, where to (country and city), when
          it started and ended, and why — and its receipts gather on it: a personal trip takes
          those dated within it by itself, a business trip asks about each one first (a purchase
          on a business trip may be the user's own), any can be added or taken out by hand,
          receipts can be uploaded straight from the trip's page, and a run of foreign receipts on
          consecutive days prompts "was this a trip?". A personal trip's receipts stay in the
          month and its limit, marked as the trip's; a business trip's are the employer's money and
          stay out of the personal month, its limit, statistics, goals and advice, and the
          household's totals. The dashboard says how much went on trips, apart.
        demo: >
          Create "Egypt, holiday, 1–8 Oct" as personal and "Berlin, client visit, 13–15 Oct" as
          business: October still counts the Egypt receipts, with "of which Egypt: 2 840.00 PLN"
          beside the total; the Berlin ones are out of it, shown as "Business trips, to be repaid:
          612.40 PLN".
        tasks:
          - key: F20.1.1
            title: Trips and receipt assignment
            labels: [backend, database]
            detail: >
              Trip entity per user with its kind (personal or business), destination, dates and
              purpose; receipts within a personal trip's dates joined automatically, those within
              a business trip's dates only asked about and counted in the user's budget until
              answered; manual add and remove that later automatic passes respect; the upload
              wizard's commit records the user's answer per receipt; one trip per receipt; the
              suggestion from consecutive foreign receipts. Endpoints for trips and their
              receipts, cross-user tests (N2).
          - key: F20.1.2
            title: How a trip counts in the budget
            labels: [backend]
            detail: >
              Business trip receipts excluded from the month, its limit and snapshots,
              statistics, goal progress and advice, and the household's totals; personal trip
              receipts counted as before and marked with their trip; the month's summary carries
              both amounts apart. Tests for each, domain model updated.
          - key: F20.1.3
            title: Trips screen and trip page
            labels: [frontend]
            detail: >
              A trips list and a trip page with its receipts, creating and editing a trip of
              either kind, moving a receipt in or out from the receipt view, the suggestion as a
              dismissible note, and the dashboard's trip lines. The upload wizard asks about a
              receipt dated within a trip — a tick for a personal one, a required "the company's
              or mine?" for a business one — an upload started on a trip's page goes into it, a
              business trip's page asks about receipts that arrived by email, and the receipts
              list labels each receipt's trip. Checked at 375, 768 and 1280 px.
      - key: F20.2
        title: What a trip cost, by kind
        labels: [backend, frontend, ai]
        requirements: []
        depends_on: [F20.1]
        intent: >
          A trip's spending splits into transport, accommodation, meals and other — what a
          settlement asks for and what a holiday is remembered by — each receipt filed under one,
          guessed from its shop and lines and corrected by the user, with totals per kind in the
          account's currency and in each currency paid.
        demo: >
          Open the Egypt trip: transport 1 900.00, accommodation 0.00 (all-inclusive), meals
          310.00, other 630.00 PLN; the souvenirs paid in Egyptian pounds show their own amount
          beside the converted one; move a taxi receipt from "other" to "transport" and the totals
          follow.
        tasks:
          - key: F20.2.1
            title: Expense kind per trip receipt
            labels: [backend, ai]
            detail: >
              Each trip receipt filed under transport, accommodation, meals or other, guessed from
              the merchant and its categories behind a port, the user's choice kept over later
              guesses; totals per kind and per currency paid.
          - key: F20.2.2
            title: Trip spending by kind on the trip page
            labels: [frontend]
            detail: >
              Totals per kind and per currency, each receipt's kind changeable in place. Checked
              at 375, 768 and 1280 px.
      - key: F20.3
        title: A personal trip's budget and story
        labels: [backend, frontend]
        requirements: []
        depends_on: [F20.2]
        intent: >
          A personal trip can have a budget of its own — "3 000 zł for the mountains" — and the
          trip page says how much of it is left, what each day cost and where the money went by
          category, during the trip and after it. The month it falls in still counts it; the trip
          page is where it is read as one story.
        demo: >
          Give "Mountains, 10–12 Oct" a 3 000 PLN budget: day by day 1 120, 860 and 640 PLN,
          380 PLN left, most of it on accommodation; the month's dashboard counts the 2 620 PLN
          and links to the trip.
        tasks:
          - key: F20.3.1
            title: Trip budget and daily spending
            labels: [backend]
            detail: >
              An optional budget on a personal trip, what is left of it, spending per day of the
              trip and per category, from the trip's receipts only; the user's own trips (N2).
          - key: F20.3.2
            title: Budget and days on the trip page
            labels: [frontend]
            detail: >
              Setting the trip budget, a meter of it, the days and categories, and the link from
              the dashboard's trip line. Checked at 375, 768 and 1280 px.
      - key: F20.4
        title: Per diem under Polish rules
        labels: [backend, frontend, docs]
        requirements: []
        depends_on: [F20.1]
        intent: >
          For a business trip, the per diem an employer owes, as the Polish regulation on
          employees' business travel sets it: the domestic rate, or the destination country's
          rate in its currency for a trip abroad, by the hours away, reduced for meals that were
          provided — worked out from the departure and return times the user gives, never
          guessed, and showing how it was reached.
        demo: >
          A business trip from 13 Oct 06:00 to 15 Oct 21:00 in Germany with two hotel
          breakfasts: the trip page shows the per diem in euros and in złoty, each day and each
          reduction itemised, with the regulation it follows named.
        tasks:
          - key: F20.4.1
            title: Per diem rules and rates
            labels: [docs]
            detail: >
              Research the current regulation and its annex from official sources: the domestic
              rate, rates per country, how hours away become days and parts of days at home and
              abroad, meal reductions, and when the rate in force is read; an ADR with sources,
              and the rates in configuration with the date they apply from.
          - key: F20.4.2
            title: Per diem calculation
            labels: [backend]
            detail: >
              A pure calculation from departure and return times, destination and meals provided,
              itemised per day, tested against the regulation's own worked cases; converted to
              złoty at the NBP rate the rules name; stored with the trip. Business trips only.
          - key: F20.4.3
            title: Per diem on the trip page
            labels: [frontend]
            detail: >
              Departure and return times and meals provided entered on a business trip, the per
              diem shown itemised with the rule behind each line. Checked at 375, 768 and 1280 px.
      - key: F20.5
        title: Business trip settlement to hand in
        labels: [backend, frontend]
        requirements: [N6]
        depends_on: [F20.2, F20.4, F7.6]
        intent: >
          The settlement an employee gives the employer for a business trip: its details,
          spending by kind and currency, the per diem, any advance already received, and what
          remains to be paid back to them — as a PDF with every receipt's photo attached, and as
          CSV, in the user's language. An expense with no receipt — a tour paid in cash, a tip —
          can be typed in, anywhere a receipt can be added, and counts like one, marked as having
          no document.
        demo: >
          Enter a 500 PLN advance on the Berlin trip and download the settlement: one PDF with the
          summary, "to reimburse 612.40 + 207.00 − 500.00 = 319.40 PLN", and the receipts' photos
          on the pages after.
        tasks:
          - key: F20.5.1
            title: Settlement export
            labels: [backend]
            detail: >
              PDF and CSV of a business trip's settlement through the export jobs of F7.6, with
              the receipts' photos in the PDF, in the user's language; the advance stored on the
              trip; the user's own trips only (N2). An expense without a receipt stored as a
              one-line receipt of a `manual` channel — description, date, amount, currency,
              category, optional kind and trip — counted like any receipt, kept out of the
              reading-accuracy report, and marked in the settlement.
          - key: F20.5.2
            title: Advance and download on the trip page
            labels: [frontend]
            detail: >
              The advance received, the amount to reimburse, and the settlement download on a
              business trip; adding an expense without a receipt from the receipts list, the
              upload page and a trip's page, asked about a trip like the wizard asks. Checked at
              375, 768 and 1280 px.

  - key: E21
    title: Voice and Chat Assistant
    br: []
    phase: 2
    scope: diploma
    groomed: true
    summary: >
      After the Android app (E22) and its ads (E19), before E13. The agent the diploma is about, made something a user talks
      to: they say or type what they want — "I spent 45 zloty on a taxi yesterday", "how much
      did I spend on coffee in October?", "I want to save 3 000 for a holiday by June" — and the
      assistant answers in a chat, showing what it understood as a card. Nothing is written until
      the user presses Save on the card; a question is answered at once, since it changes
      nothing. It grows step by step until everything a user can create or look up on the
      screens can be done by voice — expenses, receipts' trips and categories, goals, questions
      about spending, products and prices — but never settings, the account or anything that
      deletes. The assistant acts only through the services the screens use, so ownership (N2),
      quotas and every rule hold as they do; conversations and their cards are kept like any
      other user data, exported and deleted with the account.
    features:
      - key: F21.1
        title: Conversations and the chat screen
        labels: [backend, frontend, database]
        requirements: [N2, N6]
        depends_on: [F17.9]
        intent: >
          A chat screen, reachable from the navigation on every screen, where the user writes and
          the assistant answers; conversations kept and listed, newest first, each one reopened
          where it was left. A message is the user's text, the assistant's text, or a card — a
          proposed action with its fields and its state (proposed, saved, dismissed) and, once
          saved, a link to what it created. Every question and every card is a model call,
          counted against the account's quota like a receipt read.
        demo: >
          Open the assistant, ask "what can you do?", close the app, open it again: the
          conversation is there and continues.
        tasks:
          - key: F21.1.1
            title: Conversation and message storage
            labels: [backend, database]
            detail: >
              Conversation and message tables owned by the user (ON DELETE CASCADE, so account
              deletion and the full export of F17.9 take them with no extra code); a message's
              kind, text and card as JSON with its state; endpoints to list, open and continue a
              conversation; cross-user access tests (N2); rate limit and quota per message.
          - key: F21.1.2
            title: Assistant port and the tool protocol
            labels: [backend, ai]
            detail: >
              An AssistantPort behind the LiteLLM agent (ADR-0006) taking the conversation and a
              registry of tools, each a narrow function over an existing service: read tools run
              at once, write tools only return a proposed card. A stub for tests; an ADR on why
              writes go through user-approved cards and never straight from the model;
              docs/architecture/overview.md and ADR-0020 (conversations and transcripts as
              personal data, kept until deleted) updated.
          - key: F21.1.3
            title: Chat screen
            labels: [frontend]
            detail: >
              The chat: messages, cards rendered by kind with Save and Dismiss, the conversation
              list, a store owning it all; three languages. Checked at 375, 768 and 1280 px.
      - key: F21.2
        title: Speaking to the assistant
        labels: [frontend, backend, ai]
        requirements: []
        depends_on: [F21.1]
        intent: >
          A microphone button beside the text field: the user speaks in Polish, Ukrainian or
          English, the recording goes to the model, which understands audio directly, and the
          words it heard appear as the user's message before the answer. The audio itself is
          never stored, only what was understood.
        demo: >
          Hold the microphone and say "wczoraj taxi 45 złotych": the message "wczoraj taxi 45
          złotych" appears, then the assistant's answer.
        tasks:
          - key: F21.2.1
            title: Voice recording and transcription
            labels: [frontend, backend, ai]
            detail: >
              Recording in the browser (MediaRecorder; the microphone permission asked for and a
              refusal explained), a size and length limit, the audio sent to the model with the
              conversation and discarded after; the transcript stored as the user's message.
              Checked at 375, 768 and 1280 px and in the installed app on a phone.
      - key: F21.3
        title: Expenses by voice
        labels: [backend, frontend, ai]
        requirements: []
        depends_on: [F21.2, F20.5]
        intent: >
          The first thing the assistant does: "I spent 45 zloty on a taxi yesterday" becomes a
          card — description, amount, currency, date, category, trip if it falls in one — that
          the user corrects in place and saves as an expense without a receipt (F20.5), or
          dismisses. Several expenses in one sentence become several cards.
        demo: >
          Say "yesterday taxi 45, coffee 12": two cards appear; change the coffee's category,
          press Save on both; both are on the receipts list and in the month's total.
        tasks:
          - key: F21.3.1
            title: Expense tool and card
            labels: [backend, frontend, ai]
            detail: >
              A write tool proposing manual expenses, dates resolved against the user's today and
              timezone, the category from the user's categories; the card's fields editable before
              Save; saving through the manual expense service, the card then linked to the
              receipt; tests that nothing is stored before Save and that another user's category
              or trip is never offered (N2). Checked at 375, 768 and 1280 px.
      - key: F21.4
        title: Questions about spending
        labels: [backend, frontend, ai]
        requirements: []
        depends_on: [F21.1]
        intent: >
          "How much did I spend on coffee in October?", "where do I buy milk cheapest?", "what
          did I spend in Lidl this month?" — answered from the same queries the statistics,
          receipts and products screens use, as text and, where a figure is clearer drawn, a
          small chart card, with a link to the screen that shows it in full.
        demo: >
          Ask "how much did I spend on groceries this month compared to last?": the answer with
          both sums, the change, and a link to Statistics for those two months.
        tasks:
          - key: F21.4.1
            title: Read tools over statistics, receipts and products
            labels: [backend, ai]
            detail: >
              Read tools for category totals over a period, receipts by shop, text and period,
              and a product's prices and shops (F16.2-3); answers in the user's language and
              currency; tests that a tool only ever reads the caller's data (N2).
          - key: F21.4.2
            title: Answer and chart cards
            labels: [frontend]
            detail: >
              A chart card for totals over time or by category, and a link card to the screen with
              the same filters. Checked at 375, 768 and 1280 px.
      - key: F21.5
        title: Goals by voice
        labels: [backend, frontend, ai]
        requirements: []
        depends_on: [F21.3]
        intent: >
          "I want to save 3 000 for a holiday by June", "spend less on eating out" — a goal card
          with its type, target and date, saved through the goals service so its mapping and
          advice follow as from the goals screen; "how am I doing with my holiday goal?" answered
          from its progress.
        demo: >
          Say "I want to stop spending more than 400 a month on restaurants": a spending-ceiling
          goal card; Save; it is on the goals screen with its categories mapped.
        tasks:
          - key: F21.5.1
            title: Goal tools and card
            labels: [backend, frontend, ai]
            detail: >
              A write tool proposing a goal and a read tool for goal progress; the card editable
              before Save; saving through the goal service (F8.1-F8.2). Checked at 375, 768 and
              1280 px.
      - key: F21.6
        title: Receipts, trips and products by voice
        labels: [backend, frontend, ai]
        requirements: []
        depends_on: [F21.4, F21.5]
        intent: >
          The rest of what the screens create or change about the user's purchases, never
          settings, the account or a deletion: put a receipt on a trip or take it off, change a
          line's category, start a trip, save a selection of products to watch — each as a card
          saved by the user. The assistant says plainly what it cannot do and where on the screen
          it is done instead.
        demo: >
          Say "the Żabka receipt from Monday was on the Berlin trip": a card naming the receipt and
          the trip; Save; the receipt is on the trip.
        tasks:
          - key: F21.6.1
            title: Remaining write tools
            labels: [backend, frontend, ai]
            detail: >
              Write tools for a receipt's trip, a line's category, a new trip and a product
              selection, each a card saved through its service; a test that no tool exists for
              settings, the account or deleting anything. Checked at 375, 768 and 1280 px.
      - key: F21.7
        title: Everything by voice, approved on a card
        labels: [backend, frontend, ai]
        requirements: []
        depends_on: [F21.1, F23.15, F12.8]
        intent: >
          Anything the user can create or change on a screen can be asked for in the chat —
          incomes, bills, the budget, goals, accounts and their rules — and removed too, the
          user's account and settings excepted. Nothing is written until a card shows what was
          understood: it looks like the screen it belongs to, every field on it can be changed,
          and Approve (a tap, or saying "approve") saves it. Intent decides the branch the
          agent takes (an agent graph; LangGraph open source is the candidate).
        demo: >
          Say "raise the budget to 2 500 and stop the gym bill": two cards, change one amount,
          say "approve"; Plan shows both.
        tasks:
          - key: F21.7.1
            title: Reusable approve cards
            labels: [frontend]
            detail: >
              One card component per entity built from the same pieces as its screen (Plan
              rows, the account card, the goal card), editable fields, Approve and Cancel, and
              approval by voice. Checked at 375, 768 and 1280 px.
          - key: F21.7.2
            title: Intent routing and write tools for every entity
            labels: [backend, ai]
            detail: >
              Intent classification routing to read, create, change or remove branches; tools
              for incomes, bills, the budget, goals, accounts, rules and transfers, each saving
              only through its service after approval; a test that settings and the account
              have no tool. Supersedes F21.6.1's "nothing is deleted" for these entities.
      - key: F21.8
        title: A receipt told, not photographed
        labels: [backend, frontend, ai]
        requirements: []
        depends_on: [F21.2, F21.7]
        intent: >
          "I was at Biedronka today: milk 4, bread 5, apples 7.50" becomes a receipt card with
          its lines and categories; Approve stores it as a receipt of that shop with our own
          id, no photo, marked as told. One photo receipt can also be sent into the chat.
        demo: >
          Dictate a shopping trip, fix one price on the card, approve: it is in Spending and its
          products in Products like any receipt.
        tasks:
          - key: F21.8.1
            title: Told receipts and a photo in the chat
            labels: [backend, frontend, ai]
            detail: >
              A receipt channel "told" with lines from speech or text, categorised as read ones
              are; a single photo sent in the chat goes through the upload pipeline and comes
              back as a card. Checked at 375, 768 and 1280 px.
      - key: F21.9
        title: One AI budget a month
        labels: [backend, frontend]
        requirements: []
        depends_on: [F18.2, F21.1]
        intent: >
          Reading receipts and talking to the assistant spend one monthly budget, worth the
          plan's receipts (10 free, 200 paid), charged by the tokens really used; typing by hand
          stays free. The user sees one meter.
        demo: >
          Ask three questions and read one receipt: the meter shows what is left in receipts'
          worth.
        tasks:
          - key: F21.9.1
            title: Credits by tokens
            labels: [backend, frontend]
            detail: >
              The cost of a read measured (F18.2.1), credits charged per call by tokens, a cap
              per message, the quota (F10.6) moved onto credits and the meter on the ＋ screen and
              in Settings. Checked at 375, 768 and 1280 px.

  - key: E22
    title: Android App
    br: []
    phase: 2
    scope: diploma
    groomed: true
    summary: >
      The service in Google Play, where advertising needs no domain (E19) and a phone's camera,
      haptics and share sheet are at hand. The app is the existing web client wrapped in
      Capacitor — one codebase, the same API in the cloud — with one platform module the rest
      of the client asks what the device can do, so a feature checks "is there a camera, can it
      vibrate, was a file shared in" in one place and the web build keeps working unchanged.
      Published under the business's developer account, registered as an organisation with a
      D-U-N-S number (which spares the closed test with twelve testers a personal account
      needs), with a support mailbox of its own as the public contact. Built, signed and
      released by GitHub Actions after the first upload by hand. Next after F17.7, before E19's
      in-app ads and E21.
    features:
      - key: F22.1
        title: Developer account and store listing
        labels: [infra, docs]
        requirements: []
        depends_on: [F17.7, F17.9, F17.10]
        intent: >
          A Google Play developer account for the JDG as an organisation (D-U-N-S number asked
          for early: it takes days), a dedicated support mailbox as the public contact, and the
          listing: name, descriptions and screenshots in three languages, icon, content rating,
          the privacy policy's address, the Data safety form answered from ADR-0020, and the
          account deletion address Google asks for (F17.9.1).
        demo: >
          Open the listing in Play: descriptions in Polish, Ukrainian and English, the support
          address, the privacy policy link opening /privacy, and the Data safety section.
        tasks:
          - key: F22.1.1
            title: Account, listing and Data safety
            labels: [docs]
            detail: >
              The steps and answers recorded in docs/ (what each Data safety question was
              answered and why, from ADR-0020), the listing texts in three languages kept in the
              repository, screenshots at phone and tablet sizes; an ADR for the organisation
              account, D-U-N-S and what the listing publishes about the business.
          - key: F22.1.2
            title: The support mailbox in the service
            labels: [backend, frontend]
            detail: >
              A support_email setting the contact form (F17.10.2) mails instead of admin_emails,
              named on the Help page and in the privacy policy; Terraform and the deployment
              documentation updated.
      - key: F22.2
        title: The app on the phone
        labels: [frontend, infra]
        requirements: []
        depends_on: [F22.1]
        intent: >
          The client built into an Android app with Capacitor: the API's address and the app's
          origin in CORS, Android's back button moving back through the screens, the status bar
          and splash in the service's colours, the offline page, and links from letters
          (confirming an address, resetting a password) opening the app through Android App
          Links (assetlinks.json on Firebase Hosting). Everything that differs on a device goes
          through one platform module, so screens never ask "am I in the app".
        demo: >
          Install the app, sign in, follow the confirmation link from the letter on the same
          phone and land in the app with the address confirmed; press back through three
          screens.
        tasks:
          - key: F22.2.1
            title: Capacitor project and the platform module
            labels: [frontend, infra]
            detail: >
              The Android project from the existing build, the platform module (web and native
              implementations behind one interface, tested with both), CORS for the app's
              origin, the back button, status bar, splash and App Links; the architecture
              overview updated. Checked on a phone and a tablet.
          - key: F22.2.2
            title: Camera, haptics and sharing a receipt in
            labels: [frontend]
            detail: >
              The native camera for receipts, a short vibration when a receipt is read or saved,
              and "Share → Budget Agent" for images and PDFs from other apps opening the upload
              flow with them — each behind the platform module, the web build unchanged.
      - key: F22.3
        title: Building and releasing the app
        labels: [infra]
        requirements: []
        depends_on: [F22.2]
        intent: >
          After the first upload by hand, every merge to main builds a signed app bundle and
          puts it on Play's internal track; promoting a build to production is one manual run
          of the same workflow. No key file anywhere: GitHub signs in to Google through Workload
          Identity Federation, as the Cloud Run deploy does, as a service account added to the
          Play Console; the upload key lives in GitHub's secrets, Google holding the app signing
          key (Play App Signing).
        demo: >
          Merge a change to main and find the new version on the internal track a few minutes
          later; promote it to production from the Actions tab.
        tasks:
          - key: F22.3.1
            title: Release identity in Terraform
            labels: [infra]
            detail: >
              The publishing service account and its Workload Identity binding for the
              repository, in infra/terraform; the steps to add it to the Play Console and to
              store the upload key in GitHub documented.
          - key: F22.3.2
            title: Build and release workflow
            labels: [infra]
            detail: >
              A GitHub Actions workflow building the web client and the signed AAB (versionCode
              from the run number), uploading it to the internal track on merge to main and to
              production on a manual run; the release documentation updated.

  - key: E23
    title: Improvements
    br: []
    phase: 2
    scope: diploma
    groomed: false
    summary: >
      What using the product feels like, after competitors were compared on the App Store
      (Fleur, Bloomly, Spendee, Buddy, Copilot; Billy, the Polish line-item app, at 3.7
      stars): the features were stronger than theirs, the screens weaker. One branch,
      improvements, built in one go from the mockups at
      https://claude.ai/artifact/J4TvghztEyxSjmfyNWXqet — a new navigation, palettes the user
      chooses, colourful interactive charts, a first sign-in that sets things up, money coming
      in as well as going out, and a manual discount on a receipt. No issue per change: this
      epic lists what was improved.
    features:
      - key: F23.1
        title: Palettes and chart colours
        labels: [frontend, backend]
        requirements: []
        depends_on: []
        intent: >
          Six palettes — Midnight (the default, today's dark), Daylight (today's light), Rose,
          Lavender, Sage and Ocean — each with its own series for charts, kept on the account so
          every device shows the one chosen, with "dark at night" following the phone.
        demo: >
          In Settings tap Rose: every screen and chart turns rose at once, and stays so after
          signing in on another browser.
      - key: F23.2
        title: Navigation by what people do
        labels: [frontend]
        requirements: []
        depends_on: [F23.1]
        intent: >
          Home · Spending · ＋ · Products · Plan in a bottom bar on a phone and a side menu on a
          tablet and desktop; Receipts becomes the history behind "All receipts", categories to
          review become a card on Home, trips move into Plan and Settings. Home is «Головна»
          in Ukrainian and «Start» in Polish.
        demo: >
          On a phone reach every former screen from the five tabs; on a desktop the same from
          the side menu.
      - key: F23.3
        title: Home
        labels: [frontend]
        requirements: []
        depends_on: [F23.2]
        intent: >
          A ring with what is left to spend this month, income and budget editable in place,
          the categories as coloured tiles, the price change worth knowing, and the latest
          purchases.
        demo: >
          Open the app: what is left this month is the first thing read; tap Income, change it,
          and the ring follows.
      - key: F23.4
        title: Spending
        labels: [frontend]
        requirements: []
        depends_on: [F23.2]
        intent: >
          An interactive ring by category with last month beside each, spending by day, and
          the way into every receipt.
        demo: >
          Tap Eating out: the ring highlights it and its total shows in the middle.
      - key: F23.5
        title: Products
        labels: [frontend, backend]
        requirements: []
        depends_on: [F23.2]
        intent: >
          Price changes across everything bought, what is bought most, which shop the usual
          basket is cheapest in, and exploring several products together — today's exploration,
          kept whole, in the new look.
        demo: >
          Open Products, see the milk that got dearer, open Explore, pick milk and coffee and
          read what they cost by month.
      - key: F23.6
        title: Adding a receipt
        labels: [frontend]
        requirements: []
        depends_on: [F23.2]
        intent: >
          ＋ offers the camera where there is one, photos and PDFs, the forwarding address, and
          dropping a file on a desktop; reading shows its progress, and the review is the
          receipt's lines in their categories.
        demo: >
          On a phone, ＋ → Take a photo opens the camera; on a desktop drop a PDF on the page.
      - key: F23.7
        title: A discount the receipt does not show
        labels: [backend, frontend, database]
        requirements: []
        depends_on: [F23.6]
        intent: >
          Paid 69 of the 169 printed — a gift card, a voucher, a deal at the till: the user
          enters the discount on the receipt, it is spread over its lines in proportion (or
          only over the lines chosen), the month, categories and statistics count what was
          paid, and price history keeps the shelf price.
        demo: >
          Add a 100 zł discount to a 169 zł receipt: the month grows by 69 zł, and milk's price
          history is unchanged.
      - key: F23.8
        title: Settings
        labels: [frontend]
        requirements: []
        depends_on: [F23.1]
        intent: >
          Preferences become Settings: the palette, money (currency, income, payday),
          language, household, work trips, account and security, and the user's data, in
          sections that read at a glance.
        demo: >
          Open Settings from the avatar and change the palette, the language and the income.
      - key: F23.9
        title: First sign-in
        labels: [frontend, backend]
        requirements: []
        depends_on: [F23.1, F23.10]
        intent: >
          Once, after the first sign-in, and skippable: language and currency guessed from the
          browser, the palette, the usual monthly income and payday, and two-factor sign-in.
          Skipping keeps the defaults.
        demo: >
          Register in a Polish browser: Polski and PLN are chosen, pick Lavender, and the app
          opens in it; sign in elsewhere and the onboarding does not come back.
      - key: F23.10
        title: Money coming in
        labels: [backend, frontend, database]
        requirements: []
        depends_on: []
        intent: >
          Income as entries — when, how much, from what — summed per month, the usual monthly
          income standing in until the month's arrive; changed in place on Home and in Plan.
          Months stay calendar months; payday is kept for later.
        demo: >
          Add the salary on Home, see what is left grow; next month it shows the usual income
          until this month's arrives.
      - key: F23.11
        title: Income from a document
        labels: [backend, ai, frontend]
        requirements: []
        depends_on: [F23.10]
        intent: >
          A payslip or transfer confirmation sent through ＋ or by email is recognised as
          income, not a receipt, and shown as a card to confirm before anything is written;
          only the amount, the date and the source are kept, the file deleted once read.
        demo: >
          Forward a payslip PDF: the card says "Income: 6 200 zł from ACME, 10 October"; save it
          and Home counts it.
      - key: F23.12
        title: Holidays and business trips apart
        labels: [frontend, backend]
        requirements: []
        depends_on: [F23.2]
        intent: >
          Personal trips are Holidays in Plan, with their budget and day-by-day spending;
          business trips, with per diem and the settlement, appear once "I travel for work" is
          on in Settings.
        demo: >
          Plan shows the holiday; turn on work trips in Settings and the business trip list
          appears.
      - key: F23.13
        title: Goals that are easy to set
        labels: [frontend, backend, ai]
        requirements: []
        depends_on: [F23.2]
        intent: >
          A new goal starts from four large choices instead of selects, asks name, amount and
          date with buttons, and is checked before it is saved — doable, or a stretch with
          where the money could come from.
        demo: >
          Ask for 8 000 by June: "A stretch", with two changes that close the gap.
      - key: F23.14
        title: Balance
        labels: [backend, frontend, database]
        requirements: []
        depends_on: [F23.10]
        intent: >
          What the user has now: a starting balance entered once — in the first sign-in or in
          Settings, explained as "money on your accounts today", not income — that then moves
          by itself, up with every income entered or read, down with every purchase counted,
          shown on Home.
        demo: >
          Start with 5 000 zł; store a 169 zł receipt and the balance reads 4 831 zł; add the
          salary and it grows by it.
      - key: F23.15
        title: Accounts and money between them
        labels: [backend, frontend, database, security]
        requirements: []
        depends_on: [F23.14, F12.8]
        groomed: true
        intent: >
          Where the money is, for a family with a business too: accounts the user names
          (personal, business, deposit — a deposit just an amount for now), each personal or
          shared with the family. Money arrives ON an account FROM outside (income) or from
          another own account (a transfer, neither income nor spending). A business account
          carries the tax rule (a rate per payment in — common ones offered, any one allowed),
          so a payment shows the tax and the clean amount at once; regular bills (ZUS, an
          accountant) and regular transfers ("6 000 to our card on the 10th") belong to an
          account and post themselves on their day — a day already past this month starts next
          month. A regular income is exact or about (230 000 a year ÷ 12): an "about" one shows
          as expected on its day until the real amount is confirmed; a bonus is a one-off.
          Every account keeps a bank-like history; this month's entries can be changed,
          earlier months are closed. Income from email whose account is unknown waits in "To
          check" with the account to pick. Without accounts, everything works as today.
        demo: >
          Add a shared business account with 5 % tax, ZUS 1 600 on the 20th and 6 000 to "Our
          card" on the 10th; press ＋, enter 10 000 from a client and see −500 tax, 9 500
          clean; on the 10th the transfer appears in both histories by itself.
        tasks:
          - key: F23.15.1
            title: Accounts, entries and dated rules
            labels: [backend, database]
            detail: >
              Accounts (name, kind, owner or household, opening amount), entries (income from
              outside, transfer between own accounts, bill, adjustment) and monthly rules
              (income exact/about, bill, transfer) posted by date — never for a day already
              past when the rule is made; this month's entries editable, earlier months closed;
              the tax rule on business accounts. The balance (F23.14) becomes the sum of the
              accounts the user sees when there are any. Domain model and an ADR; ownership and
              cross-household tests (N2).
          - key: F23.15.2
            title: Accounts screens
            labels: [frontend]
            detail: >
              Where the money is (canvas F_Accounts), one account with ＋ Money in, Move and its
              history (F_Account), its rules (F_Rules), and "To check" for expected income and
              email income without an account (F_Check). Checked at 375, 768 and 1280 px.
      - key: F23.16
        title: Paying one's own taxes
        labels: [backend, frontend, database]
        requirements: []
        depends_on: [F23.10, F23.14]
        intent: >
          For a sole trader or contractor, whose income comes before tax: a switch in Settings
          with their own rate and an optional fixed sum a month; each income says whether the
          tax comes out of it, "left to spend" counts what is theirs to keep, and taxes paid
          leave the balance without counting as spending.
        demo: >
          Set 12 % and 1 600 zł a month, see 20 000 zł earned leave 16 000 zł to live on, and
          the balance say how much of it is still owed in taxes.
      - key: F23.17
        title: Regular incomes
        labels: [backend, frontend, database]
        requirements: []
        depends_on: [F23.10, F23.14]
        intent: >
          A salary, a side job, a pension — set once in Settings or the first-sign-in setup,
          counted in every month by themselves, the balance gaining each on its day; anything
          that comes on top is added by hand through ＋ or from a document.
        demo: >
          Add a 10 000 zł salary on the 10th and a 1 000 zł side job; next month both count
          without entering anything, and 500 zł added on top joins them.
      - key: F23.18
        title: Regular bills
        labels: [backend, frontend, database]
        requirements: []
        depends_on: [F23.17]
        intent: >
          Rent, subscriptions, a loan — set once, gone every month by themselves: off what is
          left on Home and in Plan and off the balance on their day, never counted as
          purchases in Spending's figures, and listed there in their own section.
        demo: >
          Add rent of 3 000 zł on the 5th; Plan shows spent · bills · free, and the balance
          drops by 3 000 on the 5th of each month.
      - key: F23.19
        title: Where receipts and categories live
        labels: [frontend, design]
        requirements: []
        depends_on: []
        intent: >
          Not decided yet. Spending mixes the receipts list and the categories behind one
          switch, which reads as clutter. Keep the receipts list (a receipt is still fixed or
          deleted from it) and the review of uncertain items; move managing categories and
          the remembered rules to Settings. Three ways are drawn in the design canvas
          (https://claude.ai/artifact/J4TvghztEyxSjmfyNWXqet): A — receipts stay in Spending,
          items sorted card by card; B — a clean Spending with a category drill-down and
          receipts as their own history with search and filters; C — one "To check" inbox
          for receipts that do not add up, items without a category and income from email.
          Pick one with the user, update docs/design, then build it.
        demo: >
          Open Spending and see no receipts/categories switch; fix or delete a receipt from
          its history; sort uncategorised items one at a time; rename a category in Settings.
      - key: F23.20
        title: A receipt paid from another card
        labels: [backend, frontend]
        requirements: []
        depends_on: [F23.15]
        intent: >
          Purchases come off the purchase card (F23.15): one's own, else the family's shared
          one. Sometimes a receipt was paid from another — fuel or a cola on the business
          card. Changing a receipt's card moves its amount to that account's history and
          balance; the ledger already reads purchases per buyer, so only where one receipt
          lands changes.
        demo: >
          Open a fuel receipt, choose the business card, and see it leave "Our card" and
          appear in the business account's history that day.

  - key: E24
    title: Bugfixes
    br: []
    phase: 2
    scope: diploma
    groomed: false
    summary: >
      Bugs found while using the product, fixed on a bugfix branch without an issue each;
      every batch is listed here so the board shows what was fixed and when.
    features:
      - key: F24.1
        title: Fixes of 15–16 October 2026
        labels: [backend, frontend]
        requirements: []
        depends_on: []
        intent: >
          Product search and selection, product names carrying a date, a saved selection
          offering Save again, the receipts page's default period and order, and endless
          loading on a phone after the server's cold start (PR #519).
        demo: >
          No screen of its own — each fix is seen where the bug was.
