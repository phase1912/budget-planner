<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Agent</title>
    <meta
      name="description"
      content="Photograph your receipts; see where the money goes and what to cut."
    />
    <!-- The dark theme before the first paint, so a prerendered page (F17.2) never flashes
         light for a reader who chose dark; ThemeStore owns it from then on. -->
    <script>
      try {
        var theme = localStorage.getItem("budget-planner.theme");
        if (theme === "dark" || (!theme && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- Installable app (F9.8): the manifest for Android and desktop, the Apple tags for iOS. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Budget" />
  </head>
  <body>
    <div id="root"></div>
    <!-- A signed-in reader opening "/" is going to the dashboard: the prerendered landing
         (F17.2) is cleared before it is ever painted. -->
    <script>
      try {
        if (localStorage.getItem("budget_access_token")) {
          document.getElementById("root").replaceChildren();
          // The server may be asleep: start it while the app's code is still downloading.
          if ("%VITE_API_BASE_URL%".indexOf("http") === 0)
            fetch("%VITE_API_BASE_URL%/health", { mode: "no-cors", credentials: "omit" }).catch(
              function () {},
            );
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
