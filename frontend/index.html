<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Budget Agent</title>
    <meta
      name="description"
      content="Photograph your receipts; see where the money goes and what to cut."
    />
    <!-- The palette before the first paint, so a prerendered page (F17.2) never flashes
         another look; Midnight unless chosen otherwise. ThemeStore owns it from then on. -->
    <script>
      try {
        var p = localStorage.getItem("budget-planner.theme");
        if (!p || p === "dark") p = "midnight";
        if (p === "light") p = "daylight";
        var dark = p === "midnight" || p === "ocean";
        if (
          !dark &&
          localStorage.getItem("budget-planner.dark-at-night") === "1" &&
          matchMedia("(prefers-color-scheme: dark)").matches
        ) {
          p = "midnight";
          dark = true;
        }
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.dataset.palette = p;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- Installable app (F9.8): the manifest for Android and desktop, the Apple tags for iOS. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Budget" />
  </head>
  <body>
    <div id="root"></div>
    <!-- A signed-in reader opening "/" is going to the dashboard: the prerendered landing
         (F17.2) is cleared before it is ever painted. -->
    <script>
      try {
        if (localStorage.getItem("budget_access_token")) {
          document.getElementById("root").replaceChildren();
          // The server may be asleep: start it while the app's code is still downloading.
          if ("%VITE_API_BASE_URL%".indexOf("http") === 0)
            fetch("%VITE_API_BASE_URL%/health", { mode: "no-cors", credentials: "omit" }).catch(
              function () {},
            );
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
