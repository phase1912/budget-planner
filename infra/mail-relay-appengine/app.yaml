# Mail relay: inbound receipts (F0.9.4, ADR-0013) and outgoing account letters (ADR-0019).
# env.yaml is written by the Deploy workflow from Secret Manager and Terraform outputs;
# it is never committed.
runtime: python312
service: default
instance_class: F1
app_engine_apis: true
automatic_scaling:
  max_instances: 1
inbound_services:
  - mail
includes:
  - env.yaml
handlers:
  - url: /_ah/mail/.+
    script: auto
    login: admin
  - url: /send
    script: auto
    secure: always
