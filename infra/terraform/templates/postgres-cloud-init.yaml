#cloud-config
# Postgres for production on Container-Optimized OS (F0.9.3, ADR-0014). The data lives on
# its own disk, formatted on first boot and kept across VM rebuilds; the password is read
# from Secret Manager at every start, so it never sits in instance metadata.

write_files:
  - path: /var/lib/pg/prepare.sh
    permissions: "0644"
    content: |
      set -eu
      DEVICE=/dev/disk/by-id/google-pgdata
      MOUNT=/mnt/disks/pgdata
      if ! blkid "$DEVICE" >/dev/null 2>&1; then
        mkfs.ext4 -m 0 -F "$DEVICE"
      fi
      mkdir -p "$MOUNT"
      mountpoint -q "$MOUNT" || mount -o discard,defaults "$DEVICE" "$MOUNT"
      mkdir -p "$MOUNT/data"
      # IAM grants take minutes to propagate, so on a fresh project the first boot can
      # come before the VM may read its secret: keep trying for ten minutes.
      PASSWORD=""
      for attempt in $(seq 1 60); do
        TOKEN=$(curl -sf -H 'Metadata-Flavor: Google' \
          http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token \
          | sed -E 's/.*"access_token":"([^"]+)".*/\1/') || TOKEN=""
        RESPONSE=$(curl -sf -H "Authorization: Bearer $TOKEN" \
          "https://secretmanager.googleapis.com/v1/projects/${project_id}/secrets/${password_secret}/versions/latest:access") || RESPONSE=""
        if [ -n "$RESPONSE" ]; then
          PASSWORD=$(printf '%s' "$RESPONSE" | tr -d ' \n' | sed -E 's/.*"data":"([^"]+)".*/\1/' | base64 -d)
          break
        fi
        echo "prepare: secret ${password_secret} not readable yet (attempt $attempt)" >&2
        sleep 10
      done
      [ -n "$PASSWORD" ] || { echo "prepare: gave up reading ${password_secret}" >&2; exit 1; }
      umask 077
      printf 'POSTGRES_PASSWORD=%s\n' "$PASSWORD" > /var/lib/pg/env

  - path: /etc/systemd/system/postgres.service
    permissions: "0644"
    content: |
      [Unit]
      Description=PostgreSQL ${postgres_version}
      Requires=docker.service network-online.target
      After=docker.service network-online.target
      StartLimitIntervalSec=0

      [Service]
      TimeoutStartSec=15min
      ExecStartPre=/bin/bash /var/lib/pg/prepare.sh
      ExecStartPre=-/usr/bin/docker rm -f postgres
      ExecStart=/usr/bin/docker run --rm --name postgres -p 5432:5432 \
        --env-file /var/lib/pg/env \
        -e POSTGRES_USER=${database_user} -e POSTGRES_DB=${database_name} \
        -v /mnt/disks/pgdata/data:/var/lib/postgresql/data \
        --memory=640m \
        postgres:${postgres_version} \
        -c shared_buffers=96MB -c effective_cache_size=256MB -c max_connections=40 \
        -c work_mem=2MB -c maintenance_work_mem=32MB
      ExecStop=/usr/bin/docker stop postgres
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

runcmd:
  - systemctl daemon-reload
  - systemctl enable --now postgres.service
